name: matchbook-diag
on:
  push:
    branches: [matchbook-diag]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Settle up is live
        run: |
          S=https://pm-toolkit-matchbook.vercel.app
          echo "=== GET bill (expect 404 JSON, proves the function + SDK load)"; curl -s -m 60 -w "\n[%{http_code}]\n" "$S/api/action?bill=ZZZZZZ&me=diagdiagdiag"
          echo "=== /s/ link serves the app"; curl -s -m 30 -o /dev/null -w "[%{http_code}]\n" "$S/s/ZZZZZZ"; curl -s -m 30 "$S/s/ZZZZZZ" | grep -c "billFromUrl"
          echo "=== a deck action still works (expect 400 bad code)"; curl -s -m 30 -w "\n[%{http_code}]\n" -X POST -H 'content-type: application/json' -d '{"type":"swipe","code":"x"}' "$S/api/action"
