name: matchbook-diag
on:
  push:
    branches: [matchbook-diag]
jobs:
  build-list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Status before
        run: curl -s -m 70 "https://pm-toolkit-matchbook.vercel.app/api/boards?op=status"
      - name: Repair missing parts (same calls the Top tab makes)
        run: |
          S=https://pm-toolkit-matchbook.vercel.app
          for i in $(seq 1 80); do
            r=$(curl -s -m 70 -X POST -H 'content-type: application/json' -d '{"op":"buildstep"}' "$S/api/boards")
            echo "$(date +%T) $r"
            echo "$r" | grep -q '"done":true' && break
            echo "$r" | grep -q '"busy":true' && sleep 10 || sleep 1
          done
      - name: After
        run: |
          S=https://pm-toolkit-matchbook.vercel.app
          curl -s -m 70 "$S/api/boards?op=status"; echo
          curl -s -m 70 -w "\n[%{http_code} in %{time_total}s]\n" "$S/api/boards?op=boards&me=diagdiagdiag" | python3 -c "import sys,json; t=sys.stdin.read(); j=json.loads(t[:t.rindex('[')]); print('ready', j.get('ready'), 'building', j.get('building')); [print(b['title'], b['size'], (b['first'] or {}).get('name')) for b in j['boards']]; print(t[t.rindex('['):])"
