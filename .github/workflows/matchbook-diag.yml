name: matchbook-diag
on:
  push:
    branches: [matchbook-diag]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Live API
        run: |
          S=https://pm-toolkit-matchbook.vercel.app
          for u in "/api/boards?op=status" "/api/boards?op=boards&me=diagdiagdiag" "/api/boards?op=tonight" "/api/boards?op=mine&me=diagdiagdiag"; do
            echo "=== GET $u"; curl -s -m 70 -w "\n[%{http_code} in %{time_total}s]\n" "$S$u" | cut -c1-600
          done
          echo "=== POST buildstep"; curl -s -m 70 -w "\n[%{http_code} in %{time_total}s]\n" -X POST -H 'content-type: application/json' -d '{"op":"buildstep"}' "$S/api/boards"
          echo "=== GET status again"; curl -s -m 70 -w "\n[%{http_code} in %{time_total}s]\n" "$S/api/boards?op=status"
          echo "=== index has autobuild?"; curl -s "$S/" | grep -c "driveBuild"
      - name: Overpass reachability
        run: |
          Q='[out:json][timeout:25];area["wikidata"="Q11299"]->.m;(nwr(area.m)["amenity"~"^(bar|pub|biergarten|nightclub|music_venue)$"];);out center tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            echo "=== $u"; curl -s -m 60 -o /tmp/o.json -w "[%{http_code} in %{time_total}s, %{size_download} bytes]\n" --data-urlencode "data=$Q" "$u"; head -c 200 /tmp/o.json; echo
          done
