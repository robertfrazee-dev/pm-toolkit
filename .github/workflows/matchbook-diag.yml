name: matchbook-diag
on:
  push:
    branches: [matchbook-diag]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: What's popping is live
        run: |
          S=https://pm-toolkit-matchbook.vercel.app
          sleep 75
          echo "=== page has the new Top tab"; curl -s -m 30 "$S/" | grep -c "hoodStrip"
          for q in "window=tonight&auto=1" "window=month" "window=month&area=East%20Village"; do echo "=== $q"; curl -s -m 60 -w "\n[%{http_code} %{time_total}s]\n" "$S/api/boards?op=trending&$q" | python3 -c 'import json,sys;t=sys.stdin.read();j,_,tail=t.rpartition("}");d=json.loads(j+"}");print(d["window"],"| hoods:",[(h["hood"],h["points"],h["spots"],(h["top"] or {}).get("name")) for h in d["hoods"]][:10]);print("bars:",[(p["name"],p["hood"],p["kind"],p["points"]) for p in d["bars"]]);print("places:",len(d["places"]),tail)'; done
          echo "=== second call (cached)"; curl -s -m 60 -o /dev/null -w "[%{http_code} %{time_total}s]\n" "$S/api/boards?op=trending&window=month"
