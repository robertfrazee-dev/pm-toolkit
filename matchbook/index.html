let animating = false;
function wireCard(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, pid = null;
  const yes = $(".stamp.yes", card), no = $(".stamp.no", card);
  card.addEventListener("pointerdown", (e) => {
    if (e.target.closest("a,button") || animating) return;
    active = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.setPointerCapture(pid); card.classList.add("dragging"); card.style.transition = "none";
  });
  card.addEventListener("pointermove", (e) => {
    if (!active || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px, ${dy * 0.4}px) rotate(${dx / 16}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!active) return; active = false; card.classList.remove("dragging");
    if (Math.abs(dx) > 100) fly(card, dx > 0 ? 1 : -1, dy);
    else { card.style.transition = "transform .25s"; card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", () => { if (active) { dx = 0; end(); } });
}
function flyTop(dir) { const c = $("#stack .card:not(.behind)"); if (c && !animating) fly(c, dir, 0); }
function fly(card, dir, dy) {
  animating = true;
  $(dir > 0 ? ".stamp.yes" : ".stamp.no", card).style.opacity = 1;
  haptic(dir > 0 ? "medium" : "light");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.style.transition = reduce ? "none" : "transform .32s ease-in, opacity .32s";
  card.style.transform = `translate(${dir * (window.innerWidth + 200)}px, ${dy * 0.4 + 40}px) rotate(${dir * 28}deg)`;
  card.style.opacity = 0;
  setTimeout(() => { animating = false; if (card.dataset.ad) { S.adPending = null; render(); } else decide(card.dataset.id, dir > 0); }, reduce ? 0 : 300);
}
document.addEventListener("keydown", (e) => {
  if (S.view !== "swipe" || e.target.closest("input,textarea")) return;
  if (e.key === "ArrowLeft") flyTop(-1);
  if (e.key === "ArrowRight") flyTop(1);
  if (e.key === "Backspace" || e.key.toLowerCase() === "z") undo();
});

function decide(id, liked) {
  const m = S.mine;
  S.history.push(id);
  if (liked) m.likes = [...m.likes, id]; else m.passes = [...m.passes, id];
  if (liked) {
    const others = Object.entries(S.swipes).filter(([pid, s]) => pid !== S.me && (s.likes || []).includes(id)).map(([pid]) => nameOf(pid));
    if (others.length) { haptic("match"); showMatch(placeById(id), others); }
  }
  m.done = remaining().length === 0;
  if (!m.done) maybeQueueAd();
  S.swipes[S.me] = { ...(S.swipes[S.me] || {}), name: S.name, likes: m.likes, passes: m.passes, done: m.done };
  saveMine();
  if (m.done) setView("waiting"); else render();
}

// Take back the last swipe, as long as ranking hasn't started.
function undo() {
  if (animating || !S.history.length) return;
  if (S.session.phase !== "swiping") { toast("Ranking has started, so swipes are locked."); return; }
  const id = S.history.pop(), m = S.mine;
  m.likes = m.likes.filter((x) => x !== id); m.passes = m.passes.filter((x) => x !== id); m.done = false;
  S.swipes[S.me] = { ...(S.swipes[S.me] || {}), name: S.name, likes: m.likes, passes: m.passes, done: false };
  haptic("light"); saveMine();
  setView("swipe");
}

let saving = false, saveAgain = false;
async function saveMine() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const r = await api("/api/action", { type: "swipe", code: S.code, playerId: S.me, name: S.name, likes: S.mine.likes, passes: S.mine.passes, done: S.mine.done });
    if (r.phase === "ranking") refresh();
  } catch (e) {
    toast(e.message);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; saveMine(); }
  }
}

function inviteBlock() {
  const b = el(`<div class="invite"><div class="inv-text"><span class="muted small">Invite code</span><span class="code">${esc(S.code)}</span></div>
    <button class="btn primary" type="button">${ICON.share} Invite</button></div>`);
  $("button", b).addEventListener("click", () => invite(b));
  return b;
}

// Everyone in the deck, still-swiping first so it's obvious who the group is waiting on. Wraps, so a group of 12 all fits.
// In the ranking round, "done" means their ranking is in. Everyone in the deck counts, swiped or not.
const rankPeople = () => [...new Set([...participants(), ...Object.keys(S.ranks)])];
// People still going first, then alphabetical, so nobody jumps around between refreshes.
function avatarRow(kind = "swipe") {
  const total = S.session.places.length, ppl = kind === "rank" ? rankPeople() : participants();
  const done = (pid) => (kind === "rank" ? !!S.ranks[pid] : !!S.swipes[pid]?.done);
  const order = [...ppl].sort((a, b) => (done(a) ? 1 : 0) - (done(b) ? 1 : 0) || byName(a, b));
  const host = isHost();
  return el(`<div class="avatars${ppl.length > 6 ? " many" : ""}" aria-label="${kind === "rank" ? "Who has ranked" : "Who's done swiping"}">${order.map((pid) => {
    const sw = S.swipes[pid] || {}, n = (sw.likes?.length || 0) + (sw.passes?.length || 0);
    let label, cls = "";
    if (done(pid)) { label = kind === "rank" ? "Ranked" : "Done"; cls = " done"; }
    else if (kind === "rank") [label, cls] = isHere(pid, "rank") ? ["Ranking now", " live"] : ["Hasn't ranked", " away"];
    else if (isHere(pid, "swipe")) { label = `Swiping ${n}/${total}`; cls = " live"; }
    else { label = n ? `${n}/${total} · away` : "Hasn't started"; cls = " away"; }
    return `<div class="av${cls}" data-person="${esc(pid)}" role="button" tabindex="0" title="See ${esc(nameOf(pid))}'s picks"><span class="${COVERS[hash(pid) % COVERS.length]}">${esc(nameOf(pid).slice(0, 1).toUpperCase())}</span>
      <small>${esc(nameOf(pid))}</small><em>${label}</em></div>`;
  }).join("")}</div>`);
}
const removeHint = () => `<p class="small muted">Tap anyone to see their picks${isHost() && S.session.phase !== "done" ? ", or to remove a duplicate or someone who isn't coming" : ""}.</p>`;
// Who has submitted a ranking, live. Shown on the ranking screen and on the results while votes come in.
function rankStatus() {
  const ppl = rankPeople(), n = ppl.filter((pid) => S.ranks[pid]).length;
  const box = el(`<section class="panel" id="rankStatus"><div class="row spread"><div class="eyebrow">${n === ppl.length ? "Everyone has ranked" : `${n} of ${ppl.length} ranked`}</div></div></section>`);
  box.append(avatarRow("rank"));
  box.append(el(removeHint()));
  if (S.session.phase === "ranking" && !S.session.announced && ppl.some((pid) => pid !== S.me && !S.ranks[pid])) {
    const nudge = el(`<button class="btn block" type="button">👀 Nudge everyone who hasn't ranked</button>`);
    nudge.addEventListener("click", () => nudgeOthers(nudge)); box.append(nudge);
  }
  return box;
}
async function invite(scope) {
  const url = inviteUrl(S.code);
  const where = S.session.category === "saved" ? "" : S.session.area === "you" ? " nearby" : " near " + S.session.area;
  const text = S.session.category === "saved" ? (fromHot(S.session) ? `Help me pick from the hot list! Swipe with me:` : "Help me pick from our saved places! Swipe with me:") : `Help me pick ${S.session.label.toLowerCase()}${where}! Swipe with me:`;
  if (NATIVE && Plug.Share) {
    try { await Plug.Share.share({ title: "Matchbook", text, url, dialogTitle: "Invite to Matchbook" }); return; } catch { return; }
  }
  if (navigator.share) {
    try { await navigator.share({ title: "Matchbook", text, url }); return; } catch (e) { if (e?.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(`${text} ${url}`); toast("Invite link copied"); }
  catch { toast(url); }
}

function matchItem(id, idx, extra = "") {
  const p = placeById(id); if (!p) return "";
  const img = p.photo ? ` has-img" style="background-image:url('${esc(photoUrl(p))}')` : "";
  return `<li class="mitem" data-id="${esc(id)}"><span class="sw ${coverFor(p)}${img}"><span>${idx != null ? idx + 1 : ""}</span></span>
    <span class="info"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${esc([p.kind, p.rating ? "★ " + p.rating.toFixed(1) : "", p.price, p.distance != null ? p.distance + " mi" : ""].filter(Boolean).join(" · "))}${hotOf(p) ? `<br><span class="hot">${hotOf(p).hot ? "🔥 " : ""}${esc(hotText(hotOf(p)))}</span>` : ""}</span></span>${extra}</li>`;
}

const isHost = () => !S.session.hostId || S.session.hostId === S.me;
const hostName = () => S.session.hostId ? nameOf(S.session.hostId) : "the host";
function defaultBar(n) { return n <= 3 ? n : Math.ceil((n * 2) / 3); }
function qualifying(minYes) {
  const c = likeCounts();
  return S.session.places.filter((p) => (c[p.id] || 0) >= minYes).sort((a, b) => c[b.id] - c[a.id]).map((p) => p.id);
}

function viewWaiting() {
  const ppl = participants(), n = ppl.length;
  const doneCount = ppl.filter((u) => S.swipes[u]?.done).length;
  const allDone = n > 0 && doneCount === n;
  const counts = likeCounts();
  const host = isHost();
  const stored = host && S.minYes != null ? S.minYes : S.session.minYes;
  const minYes = Math.min(Math.max(stored ?? defaultBar(n), 1), Math.max(n, 1));
  const ids = qualifying(minYes);

  const pending = ppl.filter((u) => u !== S.me && !S.swipes[u]?.done).map(nameOf);
  const title = n < 2 ? "Invite your people" : allDone ? (host ? "Everyone's done swiping" : `Waiting on ${hostName()}`) : pending.length === 1 ? `Waiting on ${pending[0]}` : pending.length <= 3 ? `Waiting on ${pending.slice(0, -1).join(", ")} & ${pending.at(-1)}` : `Waiting on ${pending.length} people`;
  const root = el(`<div class="app waiting">
    <div class="status"><h2>${esc(title)}</h2><p class="muted">${n < 2 ? "Send the link so someone can swipe this deck with you." : `${doneCount} of ${n} done swiping`}</p>
    ${S.session.swipeEndsAt ? `<div class="timer-line">${timerChip(S.session.swipeEndsAt, "swipe")}</div>` : ""}</div>
  </div>`);
  if (n >= 2) { root.append(avatarRow()); if (removeHint()) root.append(el(removeHint())); }
  root.append(inviteBlock());

  const mp = el(`<section class="panel"></section>`);
  if (n >= 2) {
    mp.append(el(`<div class="field"><span class="label">Count it as a match when</span>
      <div class="stepper" role="group" aria-label="Yes votes needed">
        <button type="button" class="btn" data-step="-1" aria-label="Fewer" ${minYes <= 1 || !host ? "disabled" : ""}>−</button>
        <span class="stepper-val"><b>${minYes}</b> of ${n} say yes${minYes === n ? " (everyone)" : ""}</span>
        <button type="button" class="btn" data-step="1" aria-label="More" ${minYes >= n || !host ? "disabled" : ""}>+</button>
      </div>
      ${host ? "" : `<p class="small muted">${esc(hostName())} sets this.</p>`}</div>`));
  }
  const shown = ids.slice(0, 10);
  mp.append(el(`<div class="row spread"><div class="eyebrow">${n < 2 ? "Your yeses" : "Matches"}</div><span class="count">${ids.length}</span></div>`));
  if (shown.length) mp.append(el(`<ul class="mlist">${shown.map((id) => matchItem(id, null, n >= 2 ? `<span class="yes">${counts[id]}/${n}</span>` : "")).join("")}</ul>`));
  else mp.append(el(`<p class="muted">${n < 2 ? "You passed on everything." : "Nothing has that many yeses yet. Lower the bar or wait for more swipes."}</p>`));
  if (ids.length > 10) mp.append(el(`<p class="small muted">The 10 with the most yeses go to the ranking round.</p>`));
  mp.addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (!b || !host) return;
    S.minYes = minYes + +b.dataset.step; render(); saveBar();
  });
  root.append(mp);

  const go = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
  if (host) {
    // Swiping stays open until the host closes it; then the same link is the ranking round for everyone.
    const left = n - doneCount, few = allDone && n >= 2 && (S.session.needsMore || canDealMore()) && ids.length < 3;
    const what = ids.length === 1 ? `go with ${placeById(ids[0])?.name}` : `rank ${Math.min(ids.length, 10)} places`;
    const close = el(`<button class="btn primary block big" type="button"></button>`);
    if (!ids.length) { close.textContent = n < 2 ? "Nothing to rank yet" : "No matches to rank yet"; close.disabled = true; }
    else if (!allDone && n >= 2 && S.confirmEarly) close.textContent = `Tap again to close: ${left} still swiping`;
    else close.textContent = `Close swiping and ${what}`;
    close.addEventListener("click", () => {
      if (!allDone && n >= 2 && !S.confirmEarly) { S.confirmEarly = true; render(); return; }
      startRanking(minYes, close);
    });
    const block = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
    if (few) {
      block.append(el(`<div class="notice">${ids.length ? `Only ${ids.length} match${ids.length === 1 ? "" : "es"} so far.` : "No matches yet."} Deal 10 more places to swipe${ids.length ? ", or close swiping and rank what you have" : ""}.</div>`));
      if (canDealMore()) { const more = el(`<button class="btn primary block" type="button">Deal 10 more cards</button>`); more.addEventListener("click", () => dealMore(more)); block.append(more); close.classList.remove("primary"); }
    }
    block.append(close);
    block.append(el(`<p class="small muted">${n < 2 ? "Swiping stays open until you close it, so send the link first." : allDone ? "Everyone who's joined is done. More people can still join until you close swiping." : `${left} ${left === 1 ? "person is" : "people are"} still swiping. Swiping stays open until you close it.`} After that, the same link opens the ranking round for everyone.</p>`));
    // The host's one big decision sits right under who's done.
    root.insertBefore(block, $(".invite", root));
    const timers = el(`<section class="panel"><div class="eyebrow">Timers</div></section>`);
    timers.append(timerControls("swipe"), timerControls("rank"));
    root.append(timers);
  } else {
    go.append(el(`<div class="notice">${allDone && !Object.keys(counts).length ? `Nobody's said yes to anything yet. ${esc(hostName())} can deal more cards.` : `Ranking starts when ${esc(hostName())} closes swiping. This page updates on its own.`}</div>`));
  }
  if (!allDone && n >= 2 && S.mine.done) {
    const nudge = el(`<button class="btn block" type="button">Nudge the others</button>`);
    nudge.addEventListener("click", () => nudgeOthers(nudge)); go.append(nudge);
  }
  if (S.history.length && S.session.phase === "swiping") {
    const u = el(`<button class="btn ghost block" type="button">Undo my last swipe</button>`); u.addEventListener("click", undo); go.append(u);
  }
  const notify = pushPrompt("Turn on notifications for reminders");
  if (notify) root.insertBefore(notify, $(".invite", root));
  const again = el(`<button class="btn ghost block" type="button">Start a new deck</button>`);
  again.addEventListener("click", leave);
  go.append(again);
  root.append(go);
  return root;
}

let barTimer;
function saveBar() {
  clearTimeout(barTimer);
  barTimer = setTimeout(() => api("/api/action", { type: "bar", code: S.code, playerId: S.me, name: S.name, minYes: S.minYes }).catch((e) => toast(e.message)), 400);
}

async function startRanking(minYes, btn) {
  btn.disabled = true;
  try {
    const r = await api("/api/action", { type: "phase", code: S.code, playerId: S.me, name: S.name, minYes });
    const single = r.matches.length === 1;
    S.session = { ...S.session, phase: single ? "done" : "ranking", matches: r.matches };
    setView(single ? "results" : "rank");
  } catch (e) { btn.disabled = false; toast(e.message); }
}

function viewRank() {
  const ids = S.session.matches || [];
  if (!S.rankOrder || S.rankOrder.length !== ids.length || !ids.every((i) => S.rankOrder.includes(i))) {
    S.rankOrder = [...ids].sort((a, b) => (S.mine.likes.includes(b) ? 1 : 0) - (S.mine.likes.includes(a) ? 1 : 0));
  }
  const root = el(`<div class="app rank" style="padding:0">
    <div><div class="eyebrow">Round 2 · Rank</div><h2 style="font-size:28px;margin-top:4px">Put your favorite on top</h2>
    <p class="muted" style="margin-top:6px">Drag by the dots, or use the arrows. Everyone's lists combine into one winner.</p></div>
    ${S.session.rankEndsAt && !S.session.announced ? `<div>${timerChip(S.session.rankEndsAt, "rank")}</div>` : ""}
    <div id="rankStatusSlot"></div>
    <ol class="mlist" id="rankList"></ol>
    <button class="btn primary block" type="button" id="submitRank">Submit my ranking</button>
  </div>`);
  $("#rankStatusSlot", root).replaceWith(rankStatus());
  const list = $("#rankList", root);
  const draw = () => {
    list.innerHTML = S.rankOrder.map((id, i) => matchItem(id, i, `<span class="handle"><button type="button" data-mv="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${ICON.up}</button><button type="button" data-mv="1" aria-label="Move down" ${i === S.rankOrder.length - 1 ? "disabled" : ""}>${ICON.down}</button><span class="grip" aria-hidden="true">${ICON.grip}</span></span>`)).join("");
  };
  draw();
  list.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mv]"); if (!b) return;
    const id = b.closest(".mitem").dataset.id, i = S.rankOrder.indexOf(id), j = i + +b.dataset.mv;
    if (j < 0 || j >= S.rankOrder.length) return;
    [S.rankOrder[i], S.rankOrder[j]] = [S.rankOrder[j], S.rankOrder[i]]; draw(); haptic("light");
    list.querySelector(`[data-id="${CSS.escape(id)}"] [data-mv="${b.dataset.mv}"]`)?.focus();
  });
  let drag = null;
  list.addEventListener("pointerdown", (e) => {
    const item = e.target.closest(".mitem"); if (!item || e.target.closest("button")) return;
    if (e.pointerType !== "mouse" && !e.target.closest(".grip")) return;
    e.preventDefault(); drag = { item, pid: e.pointerId }; item.classList.add("lifted"); list.setPointerCapture(e.pointerId);
  });
  list.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    let placed = false;
    for (const s of [...list.children].filter((c) => c !== drag.item)) {
      const r = s.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { if (drag.item.nextElementSibling !== s) list.insertBefore(drag.item, s); placed = true; break; }
    }
    if (!placed && list.lastElementChild !== drag.item) list.append(drag.item);
  });
  const drop = () => {
    if (!drag) return; drag.item.classList.remove("lifted"); drag = null; haptic("light");
    S.rankOrder = [...list.children].map((c) => c.dataset.id); draw();
  };
  list.addEventListener("pointerup", drop); list.addEventListener("pointercancel", drop);

  $("#submitRank", root).addEventListener("click", async (e) => {
    const btn = e.currentTarget; btn.disabled = true;
    try {
      await api("/api/action", { type: "rank", code: S.code, playerId: S.me, name: S.name, order: S.rankOrder });
      S.ranks[S.me] = { name: S.name, order: [...S.rankOrder] };
      setView("results");
    } catch (err) { btn.disabled = false; toast(err.message); }
  });
  return root;
}

function tally() {
  const ids = S.session.matches || [], n = ids.length;
  const pts = Object.fromEntries(ids.map((i) => [i, 0])), per = {};
  for (const [pid, r] of Object.entries(S.ranks)) {
    (r.order || []).filter((i) => i in pts).forEach((id, pos) => { pts[id] += n - pos; (per[id] ||= {})[pid] = pos + 1; });
  }
  const ranked = ids.slice().sort((a, b) => pts[b] - pts[a] || ids.indexOf(a) - ids.indexOf(b));
  return { ranked, pts, per };
}

function viewResults() {
  const rankers = Object.keys(S.ranks);
  const everyone = [...new Set([...participants(), ...rankers])];
  const waiting = everyone.filter((u) => !S.ranks[u]);
  const { ranked, pts, per } = tally();
  const top = placeById(ranked[0]);
  const final = S.session.phase === "done" || (waiting.length === 0 && rankers.length > 0);
  if (final && S.celebrated !== S.code) { S.celebrated = S.code; haptic("win"); setTimeout(() => revealWinner(top), 0); }
  const tied = ranked.slice(1).filter((id) => pts[id] === pts[ranked[0]]).map((id) => placeById(id)?.name);
  const waitingText = waiting.length <= 3 ? waiting.map(nameOf).join(", ") : `${waiting.slice(0, 2).map(nameOf).join(", ")} and ${waiting.length - 2} more`;
  const root = el(`<div class="app" style="padding:0">
    <div><div class="eyebrow">${final ? "The verdict" : `Results so far · ${rankers.length} of ${everyone.length} ranked`}</div>
    <h2 style="font-size:28px;margin-top:4px">${final ? "You're going to…" : `Waiting on ${esc(waitingText)}`}</h2></div>
  </div>`);
  if (!final && S.session.rankEndsAt) root.append(el(`<div>${timerChip(S.session.rankEndsAt, "rank")}</div>`));
  if (!final) root.append(rankStatus()); // while votes are coming in, who's ranked is the main thing to see

  if (top) root.append(el(`<section class="winner ${coverFor(top)}">
    ${top.photo ? `<img src="${esc(photoUrl(top))}" alt="" style="width:calc(100% + 44px);margin:-22px -22px 4px;height:180px;object-fit:cover;display:block" onerror="this.remove()">` : ""}
    <div class="pad">
    <div class="eyebrow" style="color:inherit;opacity:.85">${final ? "Winner" : "Leading"}${ranked.length > 1 ? ` · ${pts[top.id]} pts` : " · the only place you all agreed on"}</div>
    <h2>${esc(top.name)}</h2>
    <div>${esc([top.kind, top.rating ? "★ " + top.rating.toFixed(1) : "", top.price].filter(Boolean).join(" · "))}</div>
    <div>${esc(top.address)}</div>
    ${hotOf(top) ? `<div class="hot-line">${hotOf(top).hot ? "🔥 " : ""}Everyone else on Matchbook: ${esc(hotText(hotOf(top)))}</div>` : ""}
    ${tied.length ? `<p style="font-weight:600">Tied with ${esc(tied.join(" and "))}. It's listed first only because it had more yeses or came up earlier. Talk it out or flip a coin.</p>` : ""}
    ${bookingRow(top)}
    <div class="row spread"><a class="maps" style="font-weight:700" href="${esc(mapsUrl(top))}" target="_blank" rel="noopener">Open in Google Maps</a>
    <button type="button" class="fav-inline" data-fav="${esc(top.id)}" aria-pressed="${isFav(top)}">${ICON.star}<span>${isFav(top) ? "Saved" : "Save"}</span></button></div>
  </div></section>`));
  const winDeal = top && dealOf(top);
  if (winDeal) {
    const d = el(`<section class="panel"><div class="eyebrow">🎟 Group deal at ${esc(top.name)}</div><h3 style="font-size:20px">${esc(winDeal.title)}</h3>
      <p class="muted">${esc(money(winDeal.ppp))} per person · groups of ${winDeal.minGroup}–${winDeal.maxGroup}${winDeal.includes.length ? " · " + esc(winDeal.includes.slice(0, 3).join(", ")) : ""}</p>
      <button class="btn primary block" type="button">Book it for the group</button></section>`);
    $("button", d).addEventListener("click", () => { adlog(winDeal.id, "tap"); openOffer(winDeal.id, "deck"); });
    root.append(d);
  }
  if (ranked.length > 1) {
    const opts = el(`<section class="panel"><div class="eyebrow">Book any of them</div>
      <p class="small muted">Winner booked up? Go down the list.</p>
      <ul class="mlist">${ranked.map((id, i) => placeRow(placeById(id), i)).join("")}</ul></section>`);
    root.append(opts);
  }
  // Who put each place first: the quickest read on how split the group was.
  const firstFor = (id) => rankers.filter((u) => per[id]?.[u] === 1).sort(byName).map(nameOf);
  if (ranked.length > 1) root.append(el(`<section class="panel"><div class="eyebrow">Combined ranking</div><table class="scores">
    <thead><tr><th>#</th><th>Place</th><th class="n">Pts</th></tr></thead>
    <tbody>${ranked.map((id, i) => { const f = firstFor(id); return `<tr><td>${i + 1}</td><td>${esc(placeById(id)?.name)}${f.length ? `<div class="small muted">#1 for ${esc(f.join(", "))}</div>` : ""}</td><td class="n">${pts[id]}</td></tr>`; }).join("")}</tbody>
  </table><p class="small muted">Each person's list gives their top pick ${ranked.length} points, the next ${Math.max(ranked.length - 1, 0)}, and so on.</p></section>`));
  // Everyone's picks: a person per row (name pinned on the left), places across in the combined order. Scrolls sideways.
  if (ranked.length > 1 && rankers.length) {
    const short = (n) => (n.length > 16 ? n.slice(0, 15) + "…" : n);
    root.append(el(`<section class="panel"><div class="row spread"><div class="eyebrow">How everyone ranked (${rankers.length})</div>${ranked.length > 3 ? `<span class="small muted">Scroll sideways →</span>` : ""}</div>
      <div class="table-wrap"><table class="scores who">
      <thead><tr><th>Person</th>${ranked.map((id, i) => `<th class="n" title="${esc(placeById(id)?.name)}">${i + 1}. ${esc(short(placeById(id)?.name || ""))}</th>`).join("")}</tr></thead>
      <tbody>${[...rankers].sort(byName).map((u) => `<tr><td><button type="button" class="link who-name" data-person="${esc(u)}">${esc(nameOf(u))}</button></td>${ranked.map((id) => `<td class="n${per[id]?.[u] === 1 ? " pick1" : ""}">${per[id]?.[u] ? "#" + per[id][u] : "–"}</td>`).join("")}</tr>`).join("")}</tbody>
    </table></div>
      <input type="range" class="hbar" min="0" max="1000" value="0" aria-label="Scroll the table sideways">
      <p class="small muted">Each number is where that person put the place. Drag the bar or swipe the table to see more. Tap a name (or anyone's picture) to see their list in order.</p></section>`));
    wireTableBar(root.lastElementChild);
  }
  if (final && ranked.length > 1) root.append(rankStatus());
  const row = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
  if (!final && isHost()) {
    const close = el(`<button class="btn primary block" type="button">Close voting and pick the winner</button>`);
    close.addEventListener("click", async () => {
      close.disabled = true;
      try { await api("/api/action", { type: "close", code: S.code, playerId: S.me, name: S.name }); S.session = { ...S.session, phase: "done" }; render(); }
      catch (e) { close.disabled = false; toast(e.message); }
    });
    row.append(close);
  }
  if (!final) { const notify = pushPrompt("Turn on notifications for the result"); if (notify) row.append(notify); }
  if (!final && isHost()) { const t = el(`<section class="panel"></section>`); t.append(timerControls("rank")); row.append(t); }
  if (S.session.phase === "ranking") {
    const edit = el(`<button class="btn block" type="button">Change my ranking</button>`); edit.addEventListener("click", () => setView("rank"));
    row.append(edit);
  }
  if (final && top) {
    const share = el(`<button class="btn primary block" type="button">Share the plan with the group</button>`);
    share.addEventListener("click", () => sharePlan(top, share));
    row.prepend(share);
  }
  const again = el(`<button class="btn ghost block" type="button">Start a new deck</button>`); again.addEventListener("click", leave);
  row.append(again); root.append(row);
  const cp = crewPanel(); if (cp) root.append(cp);
  if (final && !store.get("mb.fb." + S.code)) root.append(feedbackPanel());
  return root;
}

// ---------- flows ----------
async function createDeck() {
  const f = S.form; S.error = "";
  if (f.cat === "any" && !f.mood.trim()) { S.error = "Type what you're in the mood for, or pick a kind of place."; return render(); }
  if (f.lat == null && !f.area.trim() && !f.mood.trim()) { S.error = "Add a city, neighborhood or ZIP code, or tap Near me."; return render(); }
  setView("loading");
  try {
    const { code } = await api("/api/deck", {
      category: f.cat, mood: f.mood, area: f.area, lat: f.lat, lng: f.lng, areaLabel: f.lat != null ? "you" : "",
      playerId: S.me, radiusMi: f.radius, count: f.count, openNow: f.openNow, maxPrice: f.maxPrice, swipeMinutes: f.swipeMin, rankMinutes: f.rankMin, crewId: S.crewFor?.id,
    });
    S.crewFor = null;
    rememberForm(f);
    openSession(code);
  } catch (e) { S.error = e.message; setView("home"); }
}

// One tap: rerun the last search (asking for location again if it was "near me").
function quickStart(last) {
  Object.assign(S.form, { cat: last.cat, mood: last.mood || "", area: last.area || "", radius: last.radius || 3, count: last.count || 15, openNow: !!last.openNow, maxPrice: last.maxPrice || 0, swipeMin: last.swipeMin ?? 15, rankMin: last.rankMin ?? 5, lat: null, lng: null });
  askForPush();
  if (!last.nearMe) return createDeck();
  if (!navigator.geolocation) { toast("Location isn't available here. Type an area instead."); return render(); }
  setView("loading");
  navigator.geolocation.getCurrentPosition(
    (pos) => { S.form.lat = pos.coords.latitude; S.form.lng = pos.coords.longitude; createDeck(); },
    () => { toast("Couldn't get your location. Type an area instead."); setView("home"); },
    { timeout: 15000, maximumAge: 300000 },
  );
}

async function createSavedDeck(btn) {
  const nameInput = $("#nameNew");
  if (!S.name && !(nameInput && takeName(nameInput))) { toast("Add your name at the top first."); nameInput?.focus(); return; }
  if (nameInput?.value.trim()) takeName(nameInput);
  btn.disabled = true;
  try {
    const saved = favs().slice(0, 40).map((f) => ({ ...f, category: f.ctx?.category }));
    const { code } = await api("/api/deck", { playerId: S.me, saved, swipeMinutes: S.form.swipeMin, rankMinutes: S.form.rankMin, crewId: S.crewFor?.id });
    S.crewFor = null;
    openSession(code);
  } catch (e) { btn.disabled = false; toast(e.message); }
}

function stopPolling() { clearInterval(S.pollTimer); S.pollTimer = null; }
function leave() {
  stopPolling(); clearInterval(S.bookingTimer);
  Object.assign(S, { code: null, session: null, lastSig: null, me: ME, crewId: null, crewData: null, swipes: {}, ranks: {}, rankOrder: null, minYes: null, confirmEarly: false, history: [], mine: { likes: [], passes: [], done: false }, error: "" });
  try { history.replaceState(null, "", "/"); } catch {}
  setView("home");
}

const presenceView = () => (S.view === "rank" ? "rank" : S.view === "swipe" ? "swipe" : S.view === "results" ? "results" : "waiting");
async function refresh() {
  if (!S.code || document.hidden) return;
  try {
    // Every 4th refresh (about 12 seconds) also says "I'm here, on this screen" for the live status.
    const ping = (S.polls = (S.polls || 0) + 1) % 4 === 1 ? `&me=${S.me}&v=${presenceView()}` : "";
    const r = await api("/api/deck?code=" + S.code + ping);
    S.skew = r.now ? r.now - Date.now() : 0; S.seen = r.seen || {};
    // Most polls bring nothing new: leave the screen alone. (Who's here counts as news.)
    const here = Object.keys(S.seen).filter((pid) => isHere(pid)).sort().map((pid) => pid + S.seen[pid].view);
    const sig = JSON.stringify([r.deck, r.swipes, r.ranks, here]);
    if (sig === S.lastSig) return;
    S.lastSig = sig;
    S.session = r.deck; S.swipes = r.swipes; S.ranks = r.ranks; S.booking = r.booking;
    if (remaining().length) S.mine.done = false; // more cards were dealt
    if (["offer", "booking", "deals", "hot"].includes(S.view)) return; // looking at a deal; the deck catches up when they come back
    if (!S.swipes[S.me]) S.swipes[S.me] = { name: S.name, likes: S.mine.likes, passes: S.mine.passes, done: S.mine.done };
    route();
  } catch { /* keep showing what we have; the next poll tries again */ }
}

function route() {
  const mineRanked = !!S.ranks[S.me];
  let want;
  if (S.session.phase === "done") want = "results";
  else if (S.session.phase === "ranking") want = !mineRanked ? "rank" : S.view === "rank" ? "rank" : "results";
  else want = remaining().length === 0 ? "waiting" : "swipe";
  if (want !== S.view) setView(want);
  else if (S.view === "waiting" || S.view === "results") render(); // live updates; never redraw mid-swipe or mid-sort
  else if (S.view === "rank") $("#rankStatus")?.replaceWith(rankStatus()); // just who's ranked, not the list being sorted
}

async function openSession(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
  if (!code) return;
  if (!S.name) {
    S.pendingCode = code;
    S.me = aliasFor(code) || ME;
    try { const r = await api("/api/deck?code=" + code); S.preview = { deck: r.deck, host: r.swipes[r.deck.hostId]?.name || "", people: Object.keys(r.swipes).length }; }
    catch (e) { S.error = e.message; return setView("missing"); }
    return setView("name");
  }
  stopPolling();
  Object.assign(S, { code, session: null, lastSig: null, swipes: {}, ranks: {}, rankOrder: null, minYes: null, confirmEarly: false, history: [], mine: { likes: [], passes: [], done: false }, error: "", me: aliasFor(code) || ME, polls: 0 });
  try { history.replaceState(null, "", "/#" + code); } catch {}
  let r;
  try { r = await api(`/api/deck?code=${code}&me=${S.me}&v=waiting`); }
  catch (e) { S.error = e.message; S.code = null; return setView("missing"); }
  // New on this device, but someone with the same name is already in: probably them in another browser.
  if (!r.swipes[S.me] && !r.ranks[S.me] && !S.claimSkip?.has(code)) {
    const norm = (x) => String(x || "").trim().toLowerCase();
    const twin = Object.entries({ ...r.swipes, ...r.ranks }).find(([pid, x]) => pid !== S.me && norm(x.name) === norm(S.name));
    if (twin) { S.claim = { code, pid: twin[0], name: twin[1].name }; S.code = null; return setView("claim"); }
  }
  S.skew = r.now ? r.now - Date.now() : 0; S.seen = r.seen || {};
  S.session = r.deck; S.swipes = r.swipes; S.ranks = r.ranks; S.booking = r.booking;
  if (pushOnHere()) subscribeWebPush(true); // keep this browser's subscription pointed at whoever it is in this deck
  remember(r.deck);
  if (r.deck.center && r.deck.category !== "saved") store.set("mb.lastArea", JSON.stringify({ lat: r.deck.center.latitude, lng: r.deck.center.longitude, label: r.deck.area }));
  S.hot = {}; loadHot();
  Object.assign(S, { offers: [], ads: [], adPending: null, adSeen: new Set(), adCount: 0, sinceAd: 0 }); loadOffers();
  const mine = S.swipes[S.me];
  if (mine) S.mine = { likes: [...(mine.likes || [])], passes: [...(mine.passes || [])], done: !!mine.done };
  else { S.swipes[S.me] = { name: S.name, likes: [], passes: [], done: false }; saveMine(); } // join as a swiper
  // Cards are swiped in deck order, so the swiped ones in that order are the undo history.
  { const decided = new Set([...S.mine.likes, ...S.mine.passes]); S.history = S.session.places.map((p) => p.id).filter((id) => decided.has(id)); }
  if (S.ranks[S.me]) S.rankOrder = [...S.ranks[S.me].order];
  S.view = "";
  route();
  S.pollTimer = setInterval(refresh, 3000);
}

$("#homeBtn").addEventListener("click", () => { if (S.view !== "loading") leave(); });
$("#codePill").addEventListener("click", () => { if (S.session) invite(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

const fromLink = codeFromUrl(location.pathname) || codeFromUrl(location.hash);
const crewLink = crewFromUrl(location.pathname);
const bookingLink = (location.pathname.match(/^\/b\/([A-Za-z0-9]{6,24})/) || [])[1];
if (bookingLink) { if (new URLSearchParams(location.search).get("paid")) toast("Payment received. Your card is only charged once everyone's paid."); openBooking(bookingLink); }
else if (crewLink) openCrew(crewLink); else if (fromLink) openSession(fromLink); else render();
</script>
