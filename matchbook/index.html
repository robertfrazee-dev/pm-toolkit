<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Swipe on bars, restaurants and things to do with friends, then rank your matches.">
<title>Matchbook</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; each place is a matchbook cover you flick left or right, the striker strip runs along its foot. */
:root {
  --bg: #E9EDF2; --surface: #FFFFFF; --sunk: #DDE3EA; --ink: #17202C; --muted: #586476; --line: #CCD4DE;
  --match: #D33A2C; --match-ink: #FFFFFF; --like: #23895B; --pass: #5F6B7C; --sulfur: #E9A92E;
  --cov1: #1F3A5F; --cov2: #A9352A; --cov3: #2B6448; --cov4: #5F3A82; --cov5: #9A6514; --cov-ink: #FFF7EA;
  --strike: #7B6553; --shadow: 0 10px 30px rgba(23, 32, 44, .16);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --surface: #19212C; --sunk: #222C39; --ink: #E8EDF3; --muted: #9AA6B6; --line: #2C3748;
  --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --pass: #8E9AAB; --sulfur: #F2BB4A;
  --cov1: #284B78; --cov2: #B6463A; --cov3: #2F7454; --cov4: #6F4796; --cov5: #A8721C; --cov-ink: #FFF7EA;
  --strike: #8A7462; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #19212C; --sunk: #222C39; --ink: #E8EDF3; --muted: #9AA6B6; --line: #2C3748;
  --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --pass: #8E9AAB; --sulfur: #F2BB4A;
  --cov1: #284B78; --cov2: #B6463A; --cov3: #2F7454; --cov4: #6F4796; --cov5: #A8721C; --cov-ink: #FFF7EA;
  --strike: #8A7462; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 32px; }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--match); outline-offset: 2px; }
a { color: inherit; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 2px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 21px; height: 44px; }
.bm-stick { fill: #C9A37A; } .bm-head { fill: var(--match); } .bm-flame { fill: var(--sulfur); } .bm-core { fill: #FFE08A; }
.brand h1 { font-size: 24px; font-weight: 800; }
.code-pill { font-family: var(--f-mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; padding: 6px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); border: 0; cursor: pointer; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .field .label { font-weight: 600; font-size: 14px; }
.input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.range-row { display: flex; align-items: center; gap: 14px; }
.range-row input { flex: 1; min-width: 0; accent-color: var(--match); }
.range-val { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 14px; border: 0; cursor: pointer; font-weight: 700; font-size: 15px; background: var(--sunk); color: var(--ink); }
.btn.primary { background: var(--match); color: var(--match-ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: 14px; }
.notice.warn { border-left: 4px solid var(--sulfur); }
.err { color: var(--match); font-size: 14px; font-weight: 600; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hero h2 { font-size: 30px; font-weight: 800; line-height: 1.05; }
.hero p { margin-top: 8px; color: var(--muted); }
.fan { width: 120px; height: 140px; filter: drop-shadow(0 10px 18px rgba(23,32,44,.18)); }
.fan-back { fill: var(--cov1); } .fan-front { fill: var(--match); }
.fan-heart { fill: var(--cov-ink); } .fan-yes { fill: none; stroke: var(--cov-ink); stroke-width: 2; } .fan-yes-t { fill: var(--cov-ink); font: 800 10px var(--f-display); letter-spacing: .06em; }

/* decks list */
.decks { display: flex; flex-direction: column; }
.deck { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
.deck:first-child { border-top: 0; }
.deck .dot { width: 10px; height: 34px; border-radius: 3px; }
.deck .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck .s { font-size: 13px; color: var(--muted); }
.deck .info { min-width: 0; }
.phase { font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.phase.ranking { background: color-mix(in srgb, var(--sulfur) 25%, transparent); color: var(--ink); }
.phase.swiping { background: color-mix(in srgb, var(--like) 20%, transparent); color: var(--ink); }

/* swipe */
.progress { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--match); border-radius: 3px; transition: width .25s; }
.count { font-family: var(--f-mono); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.stack { position: relative; height: min(520px, 64vh); min-height: 400px; }
.card { position: absolute; inset: 0; border-radius: 22px; color: var(--cov-ink); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
.card.behind { transform: scale(.95) translateY(14px); filter: saturate(.8) brightness(.92); pointer-events: none; }
.card.dragging { cursor: grabbing; }
.card .cover { flex: 1; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; position: relative; }
.card .cover::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.16), transparent 60%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 10px, transparent 10px 20px); pointer-events: none; }
.card .kicker { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.card h3 { font-size: clamp(30px, 9vw, 40px); font-weight: 800; line-height: 1; margin-top: auto; overflow-wrap: anywhere; }
.card .where { font-weight: 600; opacity: .92; }
.card .blurb { font-size: 15px; opacity: .95; }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tag { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.16); }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card .maps { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; position: relative; z-index: 1; }
.card .stats { font-family: var(--f-mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .striker { height: 30px; flex: none; background: repeating-linear-gradient(90deg, var(--strike) 0 3px, #5d4a3c 3px 6px); border-top: 3px dashed rgba(255,247,234,.5); }
.stamp { position: absolute; top: 26px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 10px; font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; opacity: 0; z-index: 2; background: rgba(0,0,0,.18); }
.stamp.yes { left: 20px; color: #9BF0C4; transform: rotate(-12deg); }
.stamp.no { right: 20px; color: #FFD0C9; transform: rotate(12deg); }
.actions { display: flex; justify-content: center; gap: 28px; }
.round { width: 66px; height: 66px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); }
.round svg { width: 28px; height: 28px; }
.round.no { color: var(--pass); }
.round.yes { color: var(--like); }
.round:disabled { opacity: .4; }
.round.undo { width: 48px; height: 48px; align-self: center; color: var(--muted); }
.round.undo svg { width: 22px; height: 22px; }
.hint { text-align: center; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.match { background: var(--match); color: var(--match-ink); }

/* people */
.people { display: flex; flex-direction: column; gap: 10px; }
.person { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.person img { width: 30px; height: 30px; border-radius: 50%; }
.person .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .st { font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.person .st.done { color: var(--like); }
.invite { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 2px dashed var(--line); }
.invite .code { font-family: var(--f-mono); font-size: 26px; font-weight: 700; letter-spacing: .18em; }

/* match list / rank */
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mitem { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.mitem .sw { width: 34px; height: 44px; border-radius: 6px; display: grid; place-items: center; color: var(--cov-ink); font-family: var(--f-mono); font-weight: 700; font-size: 15px; position: relative; overflow: hidden; }
.mitem .sw::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: repeating-linear-gradient(90deg, var(--strike) 0 2px, #5d4a3c 2px 4px); }
.mitem .nm { font-weight: 700; min-width: 0; }
.mitem .sub { font-size: 13px; color: var(--muted); }
.mitem .info { min-width: 0; }
.rank .mitem { user-select: none; -webkit-user-select: none; }
.rank .grip { touch-action: none; }
.rank .mitem.lifted { box-shadow: var(--shadow); border-color: var(--match); position: relative; z-index: 2; transform: scale(1.02); }
.handle { display: flex; align-items: center; gap: 2px; }
.handle button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--sunk); cursor: pointer; display: grid; place-items: center; }
.handle button svg { width: 16px; height: 16px; }
.grip { width: 28px; height: 36px; display: grid; place-items: center; cursor: grab; color: var(--muted); }
.grip svg { width: 18px; height: 18px; }

.winner { border-radius: 22px; color: var(--cov-ink); padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.winner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(90deg, var(--strike) 0 3px, #5d4a3c 3px 6px); }
.winner h2 { font-size: 34px; font-weight: 800; line-height: 1.02; }
.winner .pad { padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.scores { width: 100%; border-collapse: collapse; font-size: 14px; }
.scores th, .scores td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.scores th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.scores td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.scores th.n { text-align: right; }
.table-wrap { overflow-x: auto; }

.loading { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 40px; text-align: center; }
.flame { width: 26px; height: 56px; border-radius: 13px 13px 4px 4px; background: linear-gradient(var(--match) 0 30%, var(--sulfur) 30% 38%, #C9A37A 38%); position: relative; }
.flame::before { content: ""; position: absolute; left: 50%; top: -30px; width: 22px; height: 34px; margin-left: -11px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #FFE08A, var(--sulfur) 45%, var(--match) 80%); animation: flick 0.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .flame::before { animation: none; } .card, .bar > i, .toast { transition: none !important; } }
.cov1 { background: var(--cov1); } .cov2 { background: var(--cov2); } .cov3 { background: var(--cov3); } .cov4 { background: var(--cov4); } .cov5 { background: var(--cov5); }
@media (max-width: 460px) {
  .hero h2 { font-size: 25px; }
  .fan { width: 92px; height: 108px; }
}
@media (max-width: 340px) { .hero { grid-template-columns: 1fr; } .fan { display: none; } }
</style>
<style>
.card .photo { height: 42%; flex: none; position: relative; background: rgba(0,0,0,.2); }
.card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card .photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, var(--cov)); }
.card .photo .credit { position: absolute; right: 8px; top: 8px; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; z-index: 1; }
.card .cover { padding-top: 14px; }
.card h3 { margin-top: 0; font-size: clamp(26px, 8vw, 34px); }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; }
.card .blurb { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { margin-top: auto; }
.open { color: #A8F5CB; } .closed { color: #FFC7BE; }
.cov1 { --cov: var(--cov1); } .cov2 { --cov: var(--cov2); } .cov3 { --cov: var(--cov3); } .cov4 { --cov: var(--cov4); } .cov5 { --cov: var(--cov5); }
.attrib { text-align: center; font-size: 11px; color: var(--muted); }
.locbtn { white-space: nowrap; }
.area-row { display: flex; gap: 8px; }
.area-row .input { min-width: 0; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--match); }
.mitem .thumb { width: 34px; height: 44px; border-radius: 6px; object-fit: cover; display: block; }
.mitem .sw.has-img { background-size: cover; background-position: center; }
.mitem .sw.has-img span { background: rgba(0,0,0,.45); border-radius: 4px; padding: 0 4px; z-index: 1; }
.book-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.book { display: inline-flex; align-items: center; padding: 10px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; text-decoration: none; color: var(--cov-ink); background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28); }
.book.primary { background: var(--cov-ink); color: #1d1a17; border-color: var(--cov-ink); }
.fav-btn { position: absolute; top: 12px; left: 12px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: rgba(0,0,0,.35); color: #fff; }
.fav-btn[aria-pressed="true"], .star.on { color: var(--sulfur); }
.fav-btn[aria-pressed="true"] svg, .star.on svg, .fav-inline[aria-pressed="true"] svg { fill: currentColor; }
.fav-inline { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: inherit; font-weight: 700; cursor: pointer; padding: 6px 0; }
.fav-inline[aria-pressed="true"] { color: var(--sulfur); }
.star { width: 34px; height: 34px; border-radius: 8px; border: 0; background: var(--sunk); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.small-btn { padding: 8px 12px; font-size: 13px; }
.book-panel { list-style: none; padding: 4px 4px 8px; display: flex; flex-direction: column; gap: 8px; }
.book-panel .eyebrow { color: var(--muted) !important; opacity: 1 !important; }
.panel .book { color: var(--ink); background: var(--sunk); border-color: var(--line); }
.panel .book.primary { background: var(--match); color: var(--match-ink); border-color: var(--match); }
.quick { flex-direction: column; gap: 2px; padding-block: 14px; }
.quick span { font-size: 12px; font-weight: 600; opacity: .85; text-transform: uppercase; letter-spacing: .08em; }
.quick b { font-size: 17px; }
.moment { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; color: var(--cov-ink); padding: 24px; animation: pop .28s ease-out; transition: opacity .3s; }
.moment.out { opacity: 0; }
.moment-inner { text-align: center; display: flex; flex-direction: column; gap: 10px; max-width: 420px; position: relative; z-index: 1; }
.moment-kicker { font-family: var(--f-mono); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.moment h2 { font-size: clamp(38px, 11vw, 60px); line-height: 1; transition: opacity .35s; }
.moment p { font-size: 17px; opacity: .9; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
@keyframes pop { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .moment { animation: none; } }
textarea.input { resize: vertical; font: inherit; }
.mood-row { position: relative; }
.mood-row .input { padding-right: 44px; }
.mood-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--sunk); color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 10px; align-items: center; }
.stepper .btn { padding: 10px 0; font-size: 20px; }
.stepper-val { text-align: center; }
.stepper-val b { font-family: var(--f-mono); font-size: 20px; }
.mitem .yes { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--like); font-variant-numeric: tabular-nums; }
</style>
<style>
/* Skin v2: cleaner surfaces, one primary action per screen, photo-first cards, an app-style tab bar. */
:root {
  --bg: #F4F5F7; --surface: #FFFFFF; --sunk: #ECEEF2; --ink: #10151D; --muted: #5E6875; --line: #E3E6EB;
  --soft-shadow: 0 1px 2px rgba(16,21,29,.05), 0 10px 28px rgba(16,21,29,.07);
  --ring: color-mix(in srgb, var(--match) 35%, transparent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B0E13; --surface: #151A21; --sunk: #1D232C; --ink: #EEF1F5; --muted: #98A2B1; --line: #262E39;
  --soft-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45);
} }
:root[data-theme="dark"] {
  --bg: #0B0E13; --surface: #151A21; --sunk: #1D232C; --ink: #EEF1F5; --muted: #98A2B1; --line: #262E39;
  --soft-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45);
}
body { font-size: 16px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { height: auto; min-height: 100%; }
body.with-tabs { padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
html:has(body.with-tabs) { scroll-padding-bottom: calc(170px + env(safe-area-inset-bottom, 0px)); }
.app { gap: 20px; }
.top { padding-block: 14px 4px; }
.brand h1 { font-size: 22px; }
.code-pill { font-family: var(--f-body); letter-spacing: 0; font-size: 13px; background: var(--surface); color: var(--ink); box-shadow: var(--soft-shadow); padding: 8px 12px; }

/* Friendlier labels: no more tiny all-caps code text everywhere */
.eyebrow { font-family: var(--f-body); font-size: 13px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--muted); }
.panel { border: 0; border-radius: 22px; box-shadow: var(--soft-shadow); padding: 20px; }
.field label, .field .label { font-size: 15px; font-weight: 700; }
.input { border: 1.5px solid transparent; background: var(--sunk); border-radius: 14px; padding: 14px 16px; transition: border-color .15s, background .15s; }
.input:focus { outline: none; border-color: var(--match); background: var(--surface); box-shadow: 0 0 0 4px var(--ring); }
.input.big { font-size: 18px; padding: 16px 44px 16px 16px; }
.chip { border: 0; background: var(--sunk); font-weight: 600; padding: 9px 14px; transition: transform .12s, background .15s; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; scrollbar-width: none; scroll-snap-type: x proximity; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; scroll-snap-align: start; }
.btn { border-radius: 16px; transition: transform .12s, filter .15s, opacity .15s; }
.btn:active:not(:disabled), .chip:active, .round:active:not(:disabled), .tab:active, .quick:active, .deck:active { transform: scale(.97); }
.btn.big { padding: 17px 20px; font-size: 17px; }
.btn.primary { box-shadow: 0 8px 20px color-mix(in srgb, var(--match) 30%, transparent); }
.btn.ghost { border: 0; background: transparent; color: var(--muted); padding-block: 10px; }
.notice { background: var(--surface); box-shadow: var(--soft-shadow); border-radius: 16px; padding: 14px 16px; }
.link { border: 0; background: none; padding: 0; color: var(--match); font-weight: 700; cursor: pointer; }
.stack-y { display: flex; flex-direction: column; gap: 18px; }

/* Screen-to-screen motion */
#view.enter > * { animation: viewIn .32s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #view.enter > * { animation: none; } }

/* Home */
.hero h2, .greet h2 { font-size: 30px; line-height: 1.05; letter-spacing: -.02em; }
.greet { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.greet p b { color: var(--ink); }
.composer { display: flex; flex-direction: column; gap: 18px; }
.mood-clear { right: 8px; }
.quick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; text-align: left; border: 0; cursor: pointer; padding: 16px 18px; border-radius: 20px; background: var(--ink); color: var(--bg); box-shadow: var(--soft-shadow); transition: transform .12s; }
.quick span { grid-column: 1; font-size: 13px; font-weight: 600; opacity: .7; text-transform: none; letter-spacing: 0; }
.quick b { grid-column: 1; font-size: 17px; font-family: var(--f-display); }
.quick i { grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-size: 22px; }
.filters-toggle { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: var(--surface); box-shadow: var(--soft-shadow); border-radius: 16px; padding: 14px 16px; cursor: pointer; }
.filters-toggle span { font-weight: 700; }
.filters-toggle b { font-weight: 500; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filters-toggle i { font-style: normal; font-size: 20px; color: var(--muted); }
.filters { display: flex; flex-direction: column; gap: 18px; background: var(--surface); box-shadow: var(--soft-shadow); border-radius: 20px; padding: 18px; margin-top: -8px; }
.cta-bar { position: fixed; left: 0; right: 0; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); padding: 14px 16px 10px; background: linear-gradient(to top, var(--bg) 72%, transparent); z-index: 5; }
.cta-bar .btn { max-width: 460px; margin: 0 auto; display: flex; }
.join { display: flex; gap: 10px; }
.code-in { font-family: var(--f-mono); letter-spacing: .2em; text-transform: uppercase; font-size: 18px; min-width: 0; }
.decks { display: flex; flex-direction: column; gap: 10px; }
.deck { grid-template-columns: 12px 1fr auto; background: var(--surface); box-shadow: var(--soft-shadow); border: 0; border-radius: 18px; padding: 14px 16px; transition: transform .12s; }
.deck .dot { width: 12px; height: 40px; border-radius: 6px; }
.deck .t { display: block; font-size: 16px; }
.code-tag { font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 34px 20px; background: var(--surface); border-radius: 22px; box-shadow: var(--soft-shadow); }
.empty-star { color: var(--sulfur); } .empty-star svg { width: 34px; height: 34px; }
.attrib { padding-top: 8px; }
.attrib a { color: inherit; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: center; gap: 4px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tab { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer; position: relative; border-radius: 12px; transition: transform .12s, color .15s; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--match); }
.tab .badge { position: absolute; top: 0; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--match); color: var(--match-ink); font-style: normal; font-size: 11px; line-height: 18px; }

/* Swipe: the card is the screen */
.swipe-view { gap: 12px; }
.deck-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.dh-text { display: flex; flex-direction: column; min-width: 0; }
.dh-text b { font-family: var(--f-display); font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dh-text span { color: var(--muted); font-size: 14px; }
.swipe-view .bar { height: 4px; }
.stack { height: calc(100dvh - 300px); min-height: 400px; max-height: 620px; }
.card { border-radius: 26px; box-shadow: 0 18px 40px rgba(16,21,29,.22); display: block; }
.card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.16), transparent 60%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 10px, transparent 10px 20px); }
.card.has-photo::before { display: none; }
.card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.card-shade { position: absolute; inset: 0; pointer-events: none; }
.card.has-photo .card-shade { background: linear-gradient(to bottom, rgba(0,0,0,.28) 0%, transparent 22%, transparent 38%, rgba(0,0,0,.55) 62%, rgba(0,0,0,.88) 100%); }
.card-body { position: absolute; left: 0; right: 0; bottom: 14px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
.card:not(.has-photo) .card-body { color: var(--cov-ink); text-shadow: none; }
.card .kind { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(6px); }
.card h3 { font-size: clamp(30px, 8.5vw, 38px); line-height: 1; margin: 0; letter-spacing: -.02em; }
.card .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; font-weight: 700; font-family: var(--f-body); }
.card .meta .dim { font-weight: 500; opacity: .75; }
.card .where { font-weight: 500; font-size: 14px; opacity: .9; }
.card .blurb { font-size: 14px; opacity: .9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .credit { font-size: 10px; opacity: .65; }
.card .striker { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; border-top: 0; }
.fav-btn, .map-btn { position: absolute; top: 14px; z-index: 3; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; border: 0; }
.fav-btn { left: 14px; } .card .map-btn { position: absolute; right: 14px; left: auto; font-size: 0; text-decoration: none; }
.map-btn svg { width: 18px; height: 18px; }
.stamp { top: 70px; }
.card.behind { transform: scale(.94) translateY(16px); filter: brightness(.9); }
.actions { gap: 22px; align-items: center; }
.round { width: 68px; height: 68px; box-shadow: var(--soft-shadow); transition: transform .12s; }
.round.yes { background: var(--match); color: #fff; box-shadow: 0 10px 24px color-mix(in srgb, var(--match) 40%, transparent); }
.round.no { color: var(--ink); }
.round.undo { width: 46px; height: 46px; background: var(--surface); }

/* Waiting */
.waiting .status h2 { font-size: 30px; letter-spacing: -.02em; }
.waiting .status p { margin-top: 4px; }
.avatars { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 12px 6px; padding: 4px 2px 6px; }
.avatars.many .av span { width: 42px; height: 42px; font-size: 17px; }
.av { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.av span { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--cov-ink); font-weight: 800; font-size: 20px; font-family: var(--f-display); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--line); }
.av.done span { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--like); }
.av small { font-size: 13px; font-weight: 700; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av em { font-style: normal; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.av.done em { color: var(--like); font-weight: 700; }
.invite { border: 0; background: var(--surface); box-shadow: var(--soft-shadow); border-radius: 20px; padding: 14px 14px 14px 18px; }
.inv-text { display: flex; flex-direction: column; min-width: 0; }
.invite .code { font-size: 24px; letter-spacing: .14em; }
.mitem { border: 0; box-shadow: var(--soft-shadow); border-radius: 16px; }
.winner { border-radius: 26px; }

/* Loading: a placeholder card instead of a spinner */
.loading { padding-block: 24px; gap: 16px; }
.loading h2 { font-size: 22px; }
.skeleton { width: min(100%, 340px); height: 380px; border-radius: 26px; overflow: hidden; background: var(--surface); box-shadow: var(--soft-shadow); display: flex; flex-direction: column; }
.sk-img { flex: 1; background: var(--sunk); }
.sk-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.sk-body i { display: block; height: 14px; border-radius: 7px; background: var(--sunk); }
.sk-body .w40 { width: 40%; } .sk-body .w80 { width: 80%; height: 22px; } .sk-body .w60 { width: 60%; }
.sk-img, .sk-body i { background-image: linear-gradient(90deg, transparent 0, color-mix(in srgb, var(--surface) 60%, transparent) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
@media (prefers-reduced-motion: reduce) { .sk-img, .sk-body i { animation: none; } }

/* Hot on Matchbook: what every group nearby swipes yes on and picks */
.tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
.card .hot-tag { align-self: flex-start; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--sulfur); color: #2a1a00; }
.hot-line { font-size: 14px; font-weight: 600; opacity: .95; }
.sub .hot { color: var(--match); font-weight: 700; }
.hot-entry { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 14px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--soft-shadow); }
.hot-entry .fire { font-size: 24px; }
.hot-entry b { display: block; font-family: var(--f-display); font-size: 17px; }
.hot-entry span span { color: var(--muted); font-size: 14px; }
.hot-entry i { font-style: normal; color: var(--muted); font-size: 20px; }
.hot-list .mitem .rank-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 800; }
.hot-list .mitem:first-child .rank-n { background: var(--sulfur); color: #2a1a00; }
.hot-list .mitem a { font-size: 13px; font-weight: 700; color: var(--match); text-decoration: none; }

/* Group deals: offers venues list, booked with everyone paying their share */
.deal { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--soft-shadow); color: inherit; }
.deal .top-line { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.deal .v { font-size: 13px; font-weight: 700; color: var(--muted); }
.deal h3 { font-size: 19px; }
.deal .price { font-weight: 800; }
.deal .inc { font-size: 14px; color: var(--muted); }
.sponsor { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.card .deal-tag { align-self: flex-start; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #fff; color: #1b1b1b; }
.card.ad-card .card-body { bottom: 22px; }
.card.ad-card .see-deal { align-self: flex-start; margin-top: 6px; background: #fff; color: #1b1b1b; box-shadow: none; }
.offer-hero { border-radius: 26px; padding: 22px; color: var(--cov-ink); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--soft-shadow); }
.offer-hero h2 { font-size: 30px; line-height: 1.05; }
.offer-hero .price { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.inc-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.days::-webkit-scrollbar { display: none; }
.days .chip { flex: none; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; }
.total b { font-family: var(--f-display); font-size: 22px; }
.shares { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.share { padding: 10px; border-radius: 14px; background: var(--sunk); display: flex; flex-direction: column; gap: 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
.share b { color: var(--ink); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share.paid { background: color-mix(in srgb, var(--like) 18%, var(--surface)); color: var(--like); }
.share.pending { background: color-mix(in srgb, var(--sulfur) 22%, var(--surface)); }
.big-status h2 { font-size: 30px; letter-spacing: -.02em; }
.meter { height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--like); border-radius: 4px; transition: width .3s; }
/* Timers, live status, removing people */
.timer { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--sunk); color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.urgent { background: color-mix(in srgb, var(--match) 18%, var(--surface)); color: var(--match); }
.timer-line { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.av.away span { opacity: .55; } .av.away em { color: var(--muted); font-style: italic; }
.av.live em { color: var(--sulfur); font-weight: 700; }
.claim h2 { font-size: 26px; }
.tab { max-width: 120px; }
.tt-entry { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; cursor: pointer; padding: 16px 18px; border-radius: 22px; background: linear-gradient(135deg, var(--match), color-mix(in srgb, var(--match) 55%, var(--sulfur))); color: #fff; box-shadow: 0 10px 24px color-mix(in srgb, var(--match) 30%, transparent); }
.tt-entry .tt-icon { font-size: 26px; }
.tt-entry b { display: block; font-family: var(--f-display); font-size: 19px; }
.tt-entry span span { font-size: 14px; opacity: .9; }
.tt-entry i { font-style: normal; font-weight: 800; font-size: 17px; }
.board-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.board-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; border: 0; cursor: pointer; padding: 14px; border-radius: 18px; background: var(--surface); box-shadow: var(--soft-shadow); color: inherit; min-height: 108px; }
.board-tile .be { font-size: 26px; margin-bottom: 4px; }
.board-tile b { font-family: var(--f-display); font-size: 16px; line-height: 1.15; }
.board-tile .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.top10 .rank-n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 800; }
.top10 .rank-n.gold { background: var(--sulfur); color: #2a1a00; }
.top10 a { color: var(--match); font-weight: 700; text-decoration: none; }
.found { padding: 8px 0; border-top: 1px solid var(--line); }
.tt-head h2 { font-size: 26px; margin-top: 4px; }
.tt-pair { display: flex; flex-direction: column; gap: 10px; position: relative; }
.tt-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 0; cursor: pointer; padding: 26px 22px; border-radius: 24px; color: var(--cov-ink); box-shadow: var(--soft-shadow); min-height: 150px; justify-content: flex-end; transition: transform .15s, opacity .2s; }
.tt-card b { font-family: var(--f-display); font-size: clamp(24px, 7vw, 32px); line-height: 1.05; }
.tt-card span { font-weight: 600; opacity: .9; }
.tt-card:active:not(:disabled) { transform: scale(.98); }
.tt-card.chosen { box-shadow: 0 0 0 4px var(--sulfur), var(--soft-shadow); }
.tt-card.other { opacity: .6; }
.tt-card:disabled { cursor: default; }
.tt-vs { align-self: center; font-family: var(--f-display); font-weight: 800; color: var(--muted); margin: -4px 0; }
.tt-pct { width: 100%; height: 26px; border-radius: 13px; background: rgba(0,0,0,.25); position: relative; overflow: hidden; margin-top: 6px; }
.tt-pct i { position: absolute; inset: 0 auto 0 0; background: rgba(255,255,255,.35); border-radius: 13px; }
.tt-pct em { position: relative; font-style: normal; font-weight: 800; padding: 0 12px; line-height: 26px; }
.tt-result { font-weight: 600; text-align: center; }
.tt-done { text-align: center; display: flex; flex-direction: column; gap: 8px; padding: 30px 10px 10px; }
.tt-done .tt-fire { font-size: 54px; }
.board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; counter-reset: b; }
.board li { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: center; counter-increment: b; }
.board li::before { content: counter(b); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 800; font-size: 13px; }
.board li:first-child::before { background: var(--sulfur); color: #2a1a00; }
.board .pbar { grid-column: 2 / 4; }
.pbar { display: block; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--like); border-radius: 3px; }
.crew-view .panel > div + div, .crew-view .panel .row + .row { margin-top: 2px; }
.history { display: flex; flex-direction: column; }
.hist { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; border: 0; background: none; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; color: inherit; }
.hist:first-child { border-top: 0; }
.hist span span { display: block; }
.live-card { box-shadow: 0 0 0 2px var(--match), var(--soft-shadow); }
.crew-banner { box-shadow: 0 0 0 2px var(--like), var(--soft-shadow); }
.table-wrap { -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.scores.who th { white-space: nowrap; }

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="brand" id="homeBtn" type="button" aria-label="Matchbook home"><svg class="brand-mark" viewBox="31 12 38 80" aria-hidden="true"><path d="M50 44 C36 35 33 21 42 17 C47 15 50 19 50 22 C50 19 53 15 58 17 C67 21 64 35 50 44Z" class="bm-flame"/><path d="M50 40 C42 34 41 26 45 24 C48 23 50 26 50 27 C50 26 52 23 55 24 C59 26 58 34 50 40Z" class="bm-core"/><rect x="45" y="50" width="10" height="40" rx="3" class="bm-stick"/><ellipse cx="50" cy="50" rx="8" ry="9" class="bm-head"/></svg><h1>Matchbook</h1></button>
    <button class="code-pill" id="codePill" type="button" hidden></button>
  </header>
  <main id="view"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = [
  { id: "any", label: "Anything" }, { id: "bars", label: "Bars" }, { id: "restaurants", label: "Restaurants" }, { id: "coffee", label: "Coffee & brunch" },
  { id: "activities", label: "Activities" }, { id: "sights", label: "Sights & tourism" }, { id: "outdoors", label: "Outdoors" },
  { id: "music", label: "Live music" }, { id: "dessert", label: "Dessert" },
];
const COVERS = ["cov1", "cov2", "cov3", "cov4", "cov5"];
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.5 2.6-5.8 4.2-8.8.4 2 1.6 3.2 2.8 3.9 0-1.7.6-3.6 2-4.9.6 2.7 3.9 5 3.9 9.4 0 3.8-2.6 6.6-6.4 6.6z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>',
  crew: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="3" width="13" height="17" rx="2.5" transform="rotate(8 13.5 11.5)"/><rect x="4" y="4" width="13" height="17" rx="2.5"/></svg>',
  share: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/></svg>',
  star: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function playerId() {
  let id = store.get("mb.player");
  if (!id || !/^[A-Za-z0-9]{8,40}$/.test(id)) {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    id = [...a].map((n) => "abcdefghijklmnopqrstuvwxyz0123456789"[n % 36]).join("");
    store.set("mb.player", id);
  }
  return id;
}

// This device's id. In a deck where they said "that's me" to an earlier entry, S.me is that entry's id instead.
const ME = playerId();
const aliasFor = (code) => { const a = store.get("mb.as." + code); return /^[A-Za-z0-9]{8,40}$/.test(a || "") ? a : null; };
const S = {
  me: ME, name: store.get("mb.name") || "",
  view: "home", code: null, session: null, swipes: {}, ranks: {}, rankOrder: null,
  mine: { likes: [], passes: [], done: false },
  form: { cat: "bars", mood: "", area: "", lat: null, lng: null, radius: 3, count: 15, openNow: false, maxPrice: 0, swipeMin: 15, rankMin: 5, ...lastForm() },
  error: "", pollTimer: null, pendingCode: null, minYes: null, confirmEarly: false, history: [], tab: store.get("mb.tab") || "pick", filtersOpen: false, editName: false,
  hot: {}, hotCat: "all", hotList: null,
  offers: [], ads: [], adPending: null, adSeen: new Set(), adCount: 0, sinceAd: 0, deals: null, offerData: null, offerForm: null, offerFrom: "", booking: null, bookingTimer: null,
};

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const coverFor = (p) => COVERS[hash(p.id + p.name) % COVERS.length];
// One size everywhere so each photo is fetched (and billed) once, then cached.
const photoUrl = (p, w = 640) => p.photo ? `/api/photo?name=${encodeURIComponent(p.photo)}&w=${w}` : "";
const mapsUrl = (p) => p.maps || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.name + ", " + p.address);
function ago(t) { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return "just now"; if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + " hr ago"; return Math.round(h / 24) + " d ago"; }
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

let toastTimer;
function toast(msg, kind) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast show" + (kind ? " " + kind : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = "toast"), 2600);
}

async function api(path, data) {
  let r;
  try { r = await fetch(path, data ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) } : {}); }
  catch { throw Object.assign(new Error(navigator.onLine === false ? "You're offline. Reconnect and try again." : "Couldn't reach Matchbook. Check your connection and try again."), { status: 0 }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Couldn't reach the server. Check your connection."), { status: r.status });
  return j;
}

// ---------- iPhone app (Capacitor) ----------
// Inside the App Store app, Capacitor injects window.Capacitor with native plugins; on the web these are no-ops.
const SITE = "https://pm-toolkit-matchbook.vercel.app";
const NATIVE = !!window.Capacitor?.isNativePlatform?.();
const Plug = NATIVE ? window.Capacitor.Plugins : {};
function haptic(kind) {
  try {
    if (NATIVE) {
      if (kind === "match" || kind === "win") Plug.Haptics?.notification({ type: "SUCCESS" });
      else Plug.Haptics?.impact({ style: kind === "medium" ? "MEDIUM" : "LIGHT" });
    } else if (navigator.vibrate) navigator.vibrate(kind === "match" || kind === "win" ? [15, 40, 15] : 8);
  } catch {}
}
const inviteUrl = (code) => `${NATIVE ? SITE : location.origin}/j/${code}`;
const codeFromUrl = (url) => (String(url).match(/\/j\/([A-Za-z0-9]{5})/) || String(url).match(/#([A-Za-z0-9]{5})$/) || [])[1];

const pushOn = () => store.get("mb.push") === "on";
async function enablePush() {
  if (!NATIVE || !Plug.PushNotifications) return;
  try {
    let perm = await Plug.PushNotifications.checkPermissions();
    if (perm.receive !== "granted") perm = await Plug.PushNotifications.requestPermissions();
    if (perm.receive !== "granted") { toast("Notifications are off. You can turn them on in Settings → Matchbook."); return; }
    await Plug.PushNotifications.register(); // the token arrives in the "registration" listener
  } catch { toast("Couldn't turn on notifications."); }
}
if (NATIVE) {
  Plug.PushNotifications?.addListener("registration", async ({ value }) => {
    try { await api("/api/push", { playerId: S.me, token: value }); store.set("mb.push", "on"); toast("Notifications on"); render(); }
    catch (e) { toast(e.message); }
  });
  // Tapping a notification or an invite link opens that deck.
  Plug.PushNotifications?.addListener("pushNotificationActionPerformed", ({ notification }) => {
    const code = notification?.data?.code; if (code) openSession(code);
  });
  Plug.App?.addListener("appUrlOpen", ({ url }) => { const crew = crewFromUrl(url); if (crew) return openCrew(crew); const b = (String(url).match(/\/b\/([A-Za-z0-9]{6,24})/) || [])[1]; if (b) return openBooking(b); const code = codeFromUrl(url); if (code) openSession(code); });
  // Keep the token fresh on each launch once someone has opted in.
  if (pushOn()) Plug.PushNotifications?.register().catch(() => {});
}
// Web push: browsers, and iPhones that opened Matchbook from the Home Screen (iOS only allows it there).
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const STANDALONE = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const webPushable = () => !NATIVE && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReady = null;
if (!NATIVE && "serviceWorker" in navigator) swReady = navigator.serviceWorker.register("/sw.js").then(() => navigator.serviceWorker.ready).catch(() => null);
const myIds = () => [...new Set([ME, S.me, ...Object.keys(localStorageSafe()).filter((k) => k.startsWith("mb.as.")).map((k) => store.get(k))].filter((id) => /^[A-Za-z0-9]{8,40}$/.test(id || "")))];
function localStorageSafe() { try { return localStorage; } catch { return {}; } }
const u8 = (b64) => { const s = atob(b64.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (b64.length % 4)) % 4)); return Uint8Array.from(s, (c) => c.charCodeAt(0)); };
// Subscribes this browser and tells the server which player ids it speaks for. Quiet = no toasts (used on every open).
async function subscribeWebPush(quiet = false) {
  try {
    const reg = await swReady; if (!reg) return false;
    const { publicKey } = await api("/api/push");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: u8(publicKey) });
    await api("/api/push", { playerIds: myIds(), sub: sub.toJSON() });
    store.set("mb.push", "on");
    if (!quiet) { toast("Notifications on"); haptic("medium"); }
    return true;
  } catch (e) { if (!quiet) toast("Couldn't turn on notifications. Check your browser settings."); return false; }
}
// Ask right inside a tap (join, find places): browsers only show the prompt for a tap.
function askForPush() {
  if (!webPushable() || Notification.permission !== "default") return;
  Notification.requestPermission().then((p) => { if (p === "granted") subscribeWebPush(true).then((ok) => ok && render()); }).catch(() => {});
}
const pushOnHere = () => (NATIVE ? pushOn() : webPushable() && Notification.permission === "granted" && pushOn());
function pushPrompt(text) {
  if (NATIVE) {
    if (pushOn()) return null;
    const b = el(`<button class="btn block" type="button">🔔 ${esc(text)}</button>`);
    b.addEventListener("click", enablePush);
    return b;
  }
  if (webPushable()) {
    if (Notification.permission === "denied" || pushOnHere()) return null;
    const b = el(`<button class="btn block bell" type="button">🔔 ${esc(text)}</button>`);
    b.addEventListener("click", async () => {
      b.disabled = true;
      const p = await Notification.requestPermission().catch(() => "default");
      if (p === "granted") await subscribeWebPush(); else toast("Notifications are blocked. Turn them on in your browser settings.");
      render();
    });
    return b;
  }
  // iPhone in a Safari tab: push only works from the Home Screen.
  if (IOS && !STANDALONE && store.get("mb.iostip") !== "hide") {
    const n = el(`<div class="notice bell-tip"><b>🔔 Get reminders on your iPhone</b><br><span class="small">Tap Share, then <b>Add to Home Screen</b>. Open Matchbook from your Home Screen, open this deck, and tap Turn on notifications.</span>
      <button type="button" class="link small" style="display:block;margin-top:6px">Not now</button></div>`);
    $("button", n).addEventListener("click", () => { store.set("mb.iostip", "hide"); n.remove(); });
    return n;
  }
  return null;
}

// ---------- booking buttons on the winner ----------
// Partner IDs come from the server (Vercel env vars); without them these are plain links.
const EATS = /restaurant|bistro|brasserie|steak|sushi|trattoria|osteria|grill|diner|eatery|tavern|gastropub|brunch|ramen|pizzeria|seafood|bbq|barbecue/i;
const DOES = /museum|attraction|tour|gallery|zoo|aquarium|landmark|amusement|bowling|escape|arcade|observation|cruise|historical|monument|theater|theatre|karaoke|golf|climbing|axe|go-kart|mini golf/i;
const inNyc = (c) => !!c && c.latitude > 40.47 && c.latitude < 40.93 && c.longitude > -74.28 && c.longitude < -73.68;
function bookingLinks(p, ctx = S.session) {
  const b = S.booking || {}, cat = p.cat || ctx.category, enc = encodeURIComponent, links = [];
  const where = [p.name, p.address].filter(Boolean).join(", ");
  if (cat === "restaurants" || EATS.test(p.kind)) {
    let url = `https://www.opentable.com/s?term=${enc(p.name)}` + (p.lat != null ? `&latitude=${p.lat}&longitude=${p.lng}` : "");
    if (b.opentableWrap) url = b.opentableWrap.replace("{url}", enc(url));
    links.push({ kind: "reserve", label: "OpenTable", url, primary: true });
    // Resy's links need a city; NYC is the launch market (and covers Hoboken and Jersey City).
    if (inNyc(ctx.center)) links.push({ kind: "resy", label: "Resy", url: `https://resy.com/cities/new-york-ny/search?query=${enc(p.name)}`, primary: true });
  } else if (cat === "activities" || cat === "sights" || DOES.test(p.kind)) {
    let url = `https://www.viator.com/searchResults/all?text=${enc((p.name + " " + (ctx.area === "you" ? "" : ctx.area || "")).trim())}`;
    if (b.viatorPid) url += `&pid=${enc(b.viatorPid)}&mcid=${enc(b.viatorMcid || "42383")}&medium=link`;
    links.push({ kind: "tickets", label: "Get tickets", url, primary: true });
  }
  let ride = `https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[nickname]=${enc(p.name)}&dropoff[formatted_address]=${enc(where)}`;
  if (p.lat != null) ride += `&dropoff[latitude]=${p.lat}&dropoff[longitude]=${p.lng}`;
  links.push({ kind: "ride", label: "Ride there", url: ride });
  if (p.website) links.push({ kind: "website", label: "Website", url: p.website });
  if (p.phone) links.push({ kind: "call", label: "Call", url: "tel:" + p.phone.replace(/[^\d+]/g, "") });
  return links;
}
function bookingRow(p, ctx) {
  const links = bookingLinks(p, ctx);
  const pill = (l) => `<a class="book${l.primary ? " primary" : ""}" data-kind="${l.kind}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`;
  const reserve = links.filter((l) => l.kind === "reserve" || l.kind === "resy"), rest = links.filter((l) => !reserve.includes(l));
  return (reserve.length ? `<div class="eyebrow" style="color:inherit;opacity:.85">Reserve a table</div><div class="book-row">${reserve.map(pill).join("")}</div>` : "")
    + `<div class="book-row">${rest.map(pill).join("")}</div>`;
}
document.addEventListener("click", (e) => {
  const a = e.target.closest("a.book, a.maps"); if (!a || !S.code) return;
  const kind = a.dataset.kind || "maps";
  haptic("light");
  try { navigator.sendBeacon("/api/click", new Blob([JSON.stringify({ code: S.code, kind })], { type: "application/json" })); } catch {}
});

// ---------- saved places (this device only) ----------
function favs() { try { return JSON.parse(store.get("mb.favs") || "[]"); } catch { return []; } }
const favKey = (p) => p.gid || p.key || `${p.name}|${p.address}`;
const isFav = (p) => !!p && favs().some((f) => f.key === favKey(p));
function toggleFav(p, ctx = S.session) {
  let list = favs(); const key = favKey(p);
  const saved = !list.some((f) => f.key === key);
  if (saved) {
    list.unshift({ key, gid: p.gid || "", name: p.name, kind: p.kind || "", address: p.address || "", price: p.price || "", maps: p.maps || "",
      website: p.website || "", phone: p.phone || "", lat: p.lat ?? null, lng: p.lng ?? null,
      ctx: { category: p.cat || ctx?.category || "any", area: ctx?.area || "", center: ctx?.center || null }, at: Date.now() });
    haptic("light"); toast("Saved to your places");
  } else { list = list.filter((f) => f.key !== key); toast("Removed from saved places"); }
  store.set("mb.favs", JSON.stringify(list.slice(0, 200)));
  return saved;
}
// A place row with Save and a Book button that opens the same buttons as the winner.
function placeRow(p, i, ctx) {
  if (!p) return "";
  const key = p.id || p.key;
  return `<li class="mitem" data-row="${esc(key)}"><span class="sw ${coverFor({ id: key, name: p.name })}"><span>${i != null ? i + 1 : ""}</span></span>
    <span class="info"><span class="nm" style="display:block">${esc(p.name)}</span><span class="sub">${esc([p.kind, p.price, p.distance != null ? p.distance + " mi" : ctx?.area].filter(Boolean).join(" · "))}${hotOf(p) ? `<br><span class="hot">${hotOf(p).hot ? "🔥 " : ""}${esc(hotText(hotOf(p)))}</span>` : ""}</span></span>
    <span class="handle"><button type="button" class="star${isFav(p) ? " on" : ""}" data-fav="${esc(key)}" aria-pressed="${isFav(p)}" aria-label="Save">${ICON.star}</button>
    <button type="button" class="btn small-btn" data-book="${esc(key)}" aria-expanded="false">Book</button></span></li>
    <li class="book-panel" data-panel="${esc(key)}" hidden>${bookingRow(p, ctx)}</li>`;
}
// One handler for every Save and Book button, wherever it's drawn.
document.addEventListener("click", (e) => {
  const book = e.target.closest("[data-book]");
  if (book) {
    const panel = document.querySelector(`[data-panel="${CSS.escape(book.dataset.book)}"]`);
    if (panel) { panel.hidden = !panel.hidden; book.setAttribute("aria-expanded", String(!panel.hidden)); book.textContent = panel.hidden ? "Book" : "Close"; }
    return;
  }
  const fav = e.target.closest("[data-fav]"); if (!fav) return;
  e.preventDefault(); e.stopPropagation();
  const id = fav.dataset.fav;
  const fromDeck = S.session && placeById(id);
  const saved = fromDeck ? toggleFav(fromDeck) : (() => { const f = favs().find((x) => x.key === id); return f ? toggleFav(f, f.ctx) : false; })();
  document.querySelectorAll(`[data-fav="${CSS.escape(id)}"]`).forEach((b) => {
    b.setAttribute("aria-pressed", String(saved)); b.classList.toggle("on", saved);
    const label = b.querySelector("span"); if (label) label.textContent = saved ? "Saved" : "Save";
  });
  if (S.view === "home" && !saved) render();
});

// ---------- deal more, nudge ----------
const canDealMore = () => isHost() && !!S.session.search && (S.session.deals || 0) < 2 && S.session.places.length < 40;

function confetti(canvas) {
  const dpr = devicePixelRatio || 1, w = (canvas.width = innerWidth * dpr), h = (canvas.height = innerHeight * dpr), ctx = canvas.getContext("2d");
  const css = getComputedStyle(document.documentElement), colors = ["--sulfur", "--cov-ink", "--like", "--match"].map((v) => css.getPropertyValue(v).trim() || "#fff");
  const bits = Array.from({ length: 140 }, () => ({ x: Math.random() * w, y: -Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 6 * dpr, vy: (2 + Math.random() * 5) * dpr, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, s: (6 + Math.random() * 8) * dpr, c: colors[(Math.random() * colors.length) | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, w, h);
    for (const b of bits) { b.x += b.vx; b.y += b.vy; b.vy += 0.12 * dpr; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); }
    if (t - t0 < 2400 && canvas.isConnected) requestAnimationFrame(frame);
  })(t0);
}

// A 1080×1350 image of the plan for the group chat (no Google photo: it can't be drawn into an image).
async function planImage(p) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d"), css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--" + coverFor(p)).trim() || "#1F3A5F", ink = css.getPropertyValue("--cov-ink").trim() || "#FFF7EA";
  try { await Promise.all([document.fonts.load('800 120px "Bricolage Grotesque"'), document.fonts.load('700 36px "JetBrains Mono"'), document.fonts.load('600 40px Figtree')]); } catch {}
  x.fillStyle = bg; x.fillRect(0, 0, W, H);
  x.fillStyle = "rgba(255,255,255,.05)"; for (let i = -H; i < W; i += 60) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + H, H); x.lineTo(i + H + 30, H); x.lineTo(i + 30, 0); x.fill(); }
  for (let i = 0; i < W; i += 12) { x.fillStyle = i % 24 ? "#5d4a3c" : "#8A7462"; x.fillRect(i, H - 110, 12, 110); }
  x.fillStyle = ink; x.textBaseline = "top";
  x.font = '700 34px "JetBrains Mono", monospace'; x.fillText("WE'RE GOING TO", 80, 120);
  let size = 132; x.font = `800 ${size}px "Bricolage Grotesque", sans-serif`;
  const words = p.name.split(" "), lines = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (x.measureText(t).width > W - 160 && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line);
  if (lines.length > 4) { size = 96; x.font = `800 ${size}px "Bricolage Grotesque", sans-serif`; }
  lines.slice(0, 5).forEach((l, i) => x.fillText(l, 80, 200 + i * size * 1.02));
  const y = 200 + Math.min(lines.length, 5) * size * 1.02 + 40;
  x.font = '600 42px Figtree, sans-serif'; x.globalAlpha = .9;
  x.fillText([p.kind, p.rating ? "★ " + p.rating.toFixed(1) : "", p.price].filter(Boolean).join("  ·  "), 80, y);
  x.fillText(p.address || "", 80, y + 62, W - 160); x.globalAlpha = 1;
  x.font = '700 30px "JetBrains Mono", monospace'; x.fillText("PICKED TOGETHER WITH MATCHBOOK", 80, H - 200);
  return new Promise((ok) => c.toBlob(ok, "image/png"));
}
async function sharePlan(p, btn) {

  } catch (e) { if (e?.name !== "AbortError") { await navigator.clipboard?.writeText(text).catch(() => {}); toast("Copied the plan. Paste it in your group chat."); } }

const bookingUrl = (id) => `${NATIVE ? SITE : location.origin}/b/${id}`;
function calendarFile(b) {
  const stamp = (t) => new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const clean = (x) => String(x).replace(/[\\,;]/g, (c) => "\\" + c).replace(/\n/g, " ");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Matchbook//Group booking//EN", "BEGIN:VEVENT", `UID:${b.id}@matchbook`, `DTSTAMP:${stamp(Date.now())}`,
    `DTSTART:${stamp(b.slotAt)}`, `DTEND:${stamp(b.slotAt + b.duration * 60e3)}`, `SUMMARY:${clean(`${b.title} at ${b.venueName}`)}`, `LOCATION:${clean(b.venueAddress)}`,
    `DESCRIPTION:${clean(`Group of ${b.size}, booked and paid on Matchbook. ${bookingUrl(b.id)}`)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  return new Blob([ics], { type: "text/calendar" });
}

  const paid = b.shares.filter((s) => s.status === "paid").length, open = b.shares.filter((s) => s.status === "open").length;

const participants = () => Object.keys(S.swipes);

function likeCounts() {
  const c = {};
  for (const s of Object.values(S.swipes)) for (const id of s.likes || []) c[id] = (c[id] || 0) + 1;
  return c;
}
function currentMatches() {
  const n = participants().length; if (!n) return [];
  const c = likeCounts();
  return S.session.places.filter((p) => c[p.id] === n).map((p) => p.id);
}
const placeById = (id) => S.session?.places.find((p) => p.id === id);

// ---------- timers ----------
// The server's clock is the one that counts; S.skew corrects for a phone that's a little off.
const serverNow = () => Date.now() + (S.skew || 0);
const mmss = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)); return t >= 3600 ? `${Math.floor(t / 3600)}:${String(Math.floor((t % 3600) / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}` : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
const timerChip = (endsAt, what) => !endsAt ? "" : `<span class="timer${endsAt - serverNow() <= 120e3 ? " urgent" : ""}" data-ends="${endsAt}">⏱ <b>${mmss(endsAt - serverNow())}</b> left to ${what}</span>`;
setInterval(() => {
  let expired = false;
  document.querySelectorAll(".timer[data-ends]").forEach((t) => {
    const left = +t.dataset.ends - serverNow();
    t.querySelector("b").textContent = mmss(left); t.classList.toggle("urgent", left <= 120e3);
    if (left <= 0) expired = true;
  });
  // Time's up: ask the server right away (it closes the step) instead of waiting for the next refresh.
  if (expired && S.code && !S.timerKick) { S.timerKick = true; setTimeout(() => { S.timerKick = false; }, 4000); S.lastSig = null; refresh(); }
}, 1000);
function timerControls(stage) {
  const s = S.session, opts = stage === "swipe" ? [0, 5, 10, 15, 30, 60] : [0, 2, 5, 10, 15];
  const cur = stage === "swipe" ? (s.swipeEndsAt ? s.swipeMinutes : 0) : s.phase === "ranking" ? (s.rankEndsAt ? s.rankMinutes : 0) : (s.rankMinutes ?? 5);
  const label = stage === "swipe" ? "Swiping closes in" : s.phase === "ranking" ? "Ranking closes in" : "Ranking gets";
  const note = stage === "swipe" || s.phase === "ranking" ? "Picking a time starts the clock from now. Everyone gets a reminder 2 minutes before it closes." : "Starts when swiping closes.";
  const box = el(`<div class="field timer-ctl"><span class="label">${label}</span>
    <div class="chips">${opts.map((m) => `<button type="button" class="chip" data-timer="${m}" aria-pressed="${cur === m}">${minLabel(m)}</button>`).join("")}</div>
    <span class="small muted">${note}</span></div>`);
  box.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-timer]"); if (!b) return;
    b.disabled = true;
    try {
      await api("/api/action", { type: "timer", stage, minutes: +b.dataset.timer, code: S.code, playerId: S.me, name: S.name });
      toast(+b.dataset.timer ? `${stage === "swipe" ? "Swiping" : "Ranking"} timer set` : "Timer off"); haptic("light");
      S.lastSig = null; await refresh();
    } catch (err) { b.disabled = false; toast(err.message); }
  });
  return box;
}

// ---------- who's here ----------
// A phone checks in every few refreshes; anyone seen in the last 40 seconds is "here".
const isHere = (pid, view) => {
  if (pid === S.me) return !view || S.view === view;
  const x = S.seen?.[pid];
  return !!x && serverNow() - x.at < 40e3 && (!view || x.view === view);
};
const byName = (a, b) => (a === S.me ? -1 : b === S.me ? 1 : nameOf(a).localeCompare(nameOf(b)));
// A visible bar under the wide table: phones hide scroll bars, so this shows there's more and lets you drag to it.
function wireTableBar(section) {
  const wrap = $(".table-wrap", section), bar = $(".hbar", section);
  const sync = () => {
    const max = wrap.scrollWidth - wrap.clientWidth;
    bar.hidden = max <= 4;
    bar.value = max > 0 ? Math.round((wrap.scrollLeft / max) * 1000) : 0;
  };
  bar.addEventListener("input", () => { wrap.scrollLeft = (bar.value / 1000) * (wrap.scrollWidth - wrap.clientWidth); });
  wrap.addEventListener("scroll", sync, { passive: true });
  requestAnimationFrame(sync);
}

function render() {

  const v = $("#view"), next = fn(), cur = v.firstElementChild;
  document.body.classList.toggle("with-tabs", S.view === "home");
  if (S.lastView === S.view && cur && cur.tagName === next.tagName && cur.className === next.className) patch(cur, next);
  else { v.innerHTML = ""; v.append(next); }
  if (S.lastView !== S.view) { v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); S.lastView = S.view; }

// Redrawing the same screen keeps every section that didn't change, so photos don't reload and the page doesn't flash.
function patch(cur, next) {
  const olds = [...cur.children], news = [...next.children];
  news.forEach((n, i) => {
    const o = olds[i];
    if (o && (o.isEqualNode(n) || (o.dataset.keep && o.dataset.keep === n.dataset.keep))) return;
    if (o) o.replaceWith(n); else cur.append(n);
  });
  olds.slice(news.length).forEach((o) => o.remove());
}

  </div>`);
  const stack = $("#stack", root);
  if (S.adPending && left[0]) {
    // A sponsored group deal, every so often between swipes. Either swipe just moves on.

    $(".see-deal", c).addEventListener("click", () => { adlog(S.adPending.id, "tap"); openOffer(S.adPending.id, "deck"); });
