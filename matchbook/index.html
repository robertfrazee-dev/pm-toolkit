<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Swipe on bars, restaurants and things to do with friends, then rank your matches.">
<title>Matchbook</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column; each place is a matchbook cover you flick left or right, the striker strip runs along its foot. */
:root {
  --bg: #E9EDF2; --surface: #FFFFFF; --sunk: #DDE3EA; --ink: #17202C; --muted: #586476; --line: #CCD4DE;
  --match: #D33A2C; --match-ink: #FFFFFF; --like: #23895B; --pass: #5F6B7C; --sulfur: #E9A92E;
  --cov1: #1F3A5F; --cov2: #A9352A; --cov3: #2B6448; --cov4: #5F3A82; --cov5: #9A6514; --cov-ink: #FFF7EA;
  --strike: #7B6553; --shadow: 0 10px 30px rgba(23, 32, 44, .16);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --surface: #19212C; --sunk: #222C39; --ink: #E8EDF3; --muted: #9AA6B6; --line: #2C3748;
  --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --pass: #8E9AAB; --sulfur: #F2BB4A;
  --cov1: #284B78; --cov2: #B6463A; --cov3: #2F7454; --cov4: #6F4796; --cov5: #A8721C; --cov-ink: #FFF7EA;
  --strike: #8A7462; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #19212C; --sunk: #222C39; --ink: #E8EDF3; --muted: #9AA6B6; --line: #2C3748;
  --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --pass: #8E9AAB; --sulfur: #F2BB4A;
  --cov1: #284B78; --cov2: #B6463A; --cov3: #2F7454; --cov4: #6F4796; --cov5: #A8721C; --cov-ink: #FFF7EA;
  --strike: #8A7462; --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; padding-top: env(safe-area-inset-top, 0px); background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 0 32px; }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--match); outline-offset: 2px; }
a { color: inherit; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 2px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; }
.brand-mark { width: 14px; height: 30px; border-radius: 7px 7px 3px 3px; background: linear-gradient(var(--match) 0 38%, var(--sulfur) 38% 44%, #C9A37A 44%); }
.brand h1 { font-size: 24px; font-weight: 800; }
.code-pill { font-family: var(--f-mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; padding: 6px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); border: 0; cursor: pointer; }

.eyebrow { font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label, .field .label { font-weight: 600; font-size: 14px; }
.input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
.input::placeholder { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.range-row { display: flex; align-items: center; gap: 14px; }
.range-row input { flex: 1; min-width: 0; accent-color: var(--match); }
.range-val { font-family: var(--f-mono); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 5.5ch; text-align: right; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 14px; border: 0; cursor: pointer; font-weight: 700; font-size: 15px; background: var(--sunk); color: var(--ink); }
.btn.primary { background: var(--match); color: var(--match-ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-size: 14px; }
.notice.warn { border-left: 4px solid var(--sulfur); }
.err { color: var(--match); font-size: 14px; font-weight: 600; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
.hero h2 { font-size: 30px; font-weight: 800; line-height: 1.05; }
.hero p { margin-top: 8px; color: var(--muted); }
.fan { position: relative; width: 112px; height: 150px; }
.fan .mini { position: absolute; inset: 0; border-radius: 12px; color: var(--cov-ink); padding: 10px; font-family: var(--f-display); font-weight: 800; font-size: 14px; line-height: 1.05; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.fan .mini::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: repeating-linear-gradient(90deg, var(--strike) 0 2px, #5d4a3c 2px 4px); }
.fan .mini span { font-family: var(--f-mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-weight: 700; }
.fan .mini:nth-child(1) { background: var(--cov3); transform: rotate(-12deg) translateX(-16px); }
.fan .mini:nth-child(2) { background: var(--cov1); transform: rotate(-3deg); }
.fan .mini:nth-child(3) { background: var(--cov2); transform: rotate(8deg) translateX(14px); }

/* decks list */
.decks { display: flex; flex-direction: column; }
.deck { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; width: 100%; }
.deck:first-child { border-top: 0; }
.deck .dot { width: 10px; height: 34px; border-radius: 3px; }
.deck .t { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.deck .s { font-size: 13px; color: var(--muted); }
.deck .info { min-width: 0; }
.phase { font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.phase.ranking { background: color-mix(in srgb, var(--sulfur) 25%, transparent); color: var(--ink); }
.phase.swiping { background: color-mix(in srgb, var(--like) 20%, transparent); color: var(--ink); }

/* swipe */
.progress { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--match); border-radius: 3px; transition: width .25s; }
.count { font-family: var(--f-mono); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.stack { position: relative; height: min(520px, 64vh); min-height: 400px; }
.card { position: absolute; inset: 0; border-radius: 22px; color: var(--cov-ink); box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
.card.behind { transform: scale(.95) translateY(14px); filter: saturate(.8) brightness(.92); pointer-events: none; }
.card.dragging { cursor: grabbing; }
.card .cover { flex: 1; padding: 22px 22px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; position: relative; }
.card .cover::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 100% 0%, rgba(255,255,255,.16), transparent 60%), repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 10px, transparent 10px 20px); pointer-events: none; }
.card .kicker { display: flex; justify-content: space-between; gap: 12px; font-family: var(--f-mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.card h3 { font-size: clamp(30px, 9vw, 40px); font-weight: 800; line-height: 1; margin-top: auto; overflow-wrap: anywhere; }
.card .where { font-weight: 600; opacity: .92; }
.card .blurb { font-size: 15px; opacity: .95; }
.card .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tag { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.16); }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card .maps { font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; position: relative; z-index: 1; }
.card .stats { font-family: var(--f-mono); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .striker { height: 30px; flex: none; background: repeating-linear-gradient(90deg, var(--strike) 0 3px, #5d4a3c 3px 6px); border-top: 3px dashed rgba(255,247,234,.5); }
.stamp { position: absolute; top: 26px; padding: 6px 12px; border: 3px solid currentColor; border-radius: 10px; font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: .04em; opacity: 0; z-index: 2; background: rgba(0,0,0,.18); }
.stamp.yes { left: 20px; color: #9BF0C4; transform: rotate(-12deg); }
.stamp.no { right: 20px; color: #FFD0C9; transform: rotate(12deg); }
.actions { display: flex; justify-content: center; gap: 28px; }
.round { width: 66px; height: 66px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--surface); box-shadow: var(--shadow); }
.round svg { width: 28px; height: 28px; }
.round.no { color: var(--pass); }
.round.yes { color: var(--like); }
.round:disabled { opacity: .4; }
.hint { text-align: center; font-size: 12px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.match { background: var(--match); color: var(--match-ink); }

/* people */
.people { display: flex; flex-direction: column; gap: 10px; }
.person { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.person img { width: 30px; height: 30px; border-radius: 50%; }
.person .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .st { font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.person .st.done { color: var(--like); }
.invite { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 2px dashed var(--line); }
.invite .code { font-family: var(--f-mono); font-size: 26px; font-weight: 700; letter-spacing: .18em; }

/* match list / rank */
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mitem { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.mitem .sw { width: 34px; height: 44px; border-radius: 6px; display: grid; place-items: center; color: var(--cov-ink); font-family: var(--f-mono); font-weight: 700; font-size: 15px; position: relative; overflow: hidden; }
.mitem .sw::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 7px; background: repeating-linear-gradient(90deg, var(--strike) 0 2px, #5d4a3c 2px 4px); }
.mitem .nm { font-weight: 700; min-width: 0; }
.mitem .sub { font-size: 13px; color: var(--muted); }
.mitem .info { min-width: 0; }
.rank .mitem { user-select: none; -webkit-user-select: none; }
.rank .grip { touch-action: none; }
.rank .mitem.lifted { box-shadow: var(--shadow); border-color: var(--match); position: relative; z-index: 2; transform: scale(1.02); }
.handle { display: flex; align-items: center; gap: 2px; }
.handle button { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--sunk); cursor: pointer; display: grid; place-items: center; }
.handle button svg { width: 16px; height: 16px; }
.grip { width: 28px; height: 36px; display: grid; place-items: center; cursor: grab; color: var(--muted); }
.grip svg { width: 18px; height: 18px; }

.winner { border-radius: 22px; color: var(--cov-ink); padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.winner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(90deg, var(--strike) 0 3px, #5d4a3c 3px 6px); }
.winner h2 { font-size: 34px; font-weight: 800; line-height: 1.02; }
.winner .pad { padding-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
.scores { width: 100%; border-collapse: collapse; font-size: 14px; }
.scores th, .scores td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.scores th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.scores td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.scores th.n { text-align: right; }
.table-wrap { overflow-x: auto; }

.loading { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-block: 40px; text-align: center; }
.flame { width: 26px; height: 56px; border-radius: 13px 13px 4px 4px; background: linear-gradient(var(--match) 0 30%, var(--sulfur) 30% 38%, #C9A37A 38%); position: relative; }
.flame::before { content: ""; position: absolute; left: 50%; top: -30px; width: 22px; height: 34px; margin-left: -11px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #FFE08A, var(--sulfur) 45%, var(--match) 80%); animation: flick 0.6s ease-in-out infinite alternate; transform-origin: 50% 100%; }
@keyframes flick { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.9, 1.12) rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .flame::before { animation: none; } .card, .bar > i, .toast { transition: none !important; } }
.cov1 { background: var(--cov1); } .cov2 { background: var(--cov2); } .cov3 { background: var(--cov3); } .cov4 { background: var(--cov4); } .cov5 { background: var(--cov5); }
@media (max-width: 460px) {
  .hero h2 { font-size: 25px; }
  .fan { width: 78px; height: 108px; margin-inline: 14px 10px; }
  .fan .mini { font-size: 11px; padding: 8px; }
}
@media (max-width: 340px) { .hero { grid-template-columns: 1fr; } .fan { display: none; } }
</style>
<style>
.card .photo { height: 42%; flex: none; position: relative; background: rgba(0,0,0,.2); }
.card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card .photo::after { content: ""; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, var(--cov)); }
.card .photo .credit { position: absolute; right: 8px; top: 8px; font-size: 10px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: #fff; z-index: 1; }
.card .cover { padding-top: 14px; }
.card h3 { margin-top: 0; font-size: clamp(26px, 8vw, 34px); }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; }
.card .blurb { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .foot { margin-top: auto; }
.open { color: #A8F5CB; } .closed { color: #FFC7BE; }
.cov1 { --cov: var(--cov1); } .cov2 { --cov: var(--cov2); } .cov3 { --cov: var(--cov3); } .cov4 { --cov: var(--cov4); } .cov5 { --cov: var(--cov5); }
.attrib { text-align: center; font-size: 11px; color: var(--muted); }
.locbtn { white-space: nowrap; }
.area-row { display: flex; gap: 8px; }
.area-row .input { min-width: 0; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--match); }
.mitem .thumb { width: 34px; height: 44px; border-radius: 6px; object-fit: cover; display: block; }
.mitem .sw.has-img { background-size: cover; background-position: center; }
.mitem .sw.has-img span { background: rgba(0,0,0,.45); border-radius: 4px; padding: 0 4px; z-index: 1; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 10px; align-items: center; }
.stepper .btn { padding: 10px 0; font-size: 20px; }
.stepper-val { text-align: center; }
.stepper-val b { font-family: var(--f-mono); font-size: 20px; }
.mitem .yes { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--like); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="brand" id="homeBtn" type="button" aria-label="Matchbook home"><span class="brand-mark" aria-hidden="true"></span><h1>Matchbook</h1></button>
    <button class="code-pill" id="codePill" type="button" hidden></button>
  </header>
  <main id="view"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = [
  { id: "bars", label: "Bars" }, { id: "restaurants", label: "Restaurants" }, { id: "coffee", label: "Coffee & brunch" },
  { id: "activities", label: "Activities" }, { id: "sights", label: "Sights & tourism" }, { id: "outdoors", label: "Outdoors" },
  { id: "music", label: "Live music" }, { id: "dessert", label: "Dessert" }, { id: "custom", label: "Something else" },
];
const COVERS = ["cov1", "cov2", "cov3", "cov4", "cov5"];
const ICON = {
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.9 4.5c2.1 0 3.6 1.1 5.1 3 1.5-1.9 3-3 5.1-3 3.9 0 6 3.9 4.5 7.3C19.5 16.4 12 21 12 21z"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  pin: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>',
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function playerId() {
  let id = store.get("mb.player");
  if (!id || !/^[A-Za-z0-9]{8,40}$/.test(id)) {
    const a = new Uint8Array(12); crypto.getRandomValues(a);
    id = [...a].map((n) => "abcdefghijklmnopqrstuvwxyz0123456789"[n % 36]).join("");
    store.set("mb.player", id);
  }
  return id;
}

// ---------- iPhone app (Capacitor) ----------
// Inside the App Store app, Capacitor injects window.Capacitor with native plugins; on the web these are no-ops.
const SITE = "https://pm-toolkit-matchbook.vercel.app";
const NATIVE = !!window.Capacitor?.isNativePlatform?.();
const Plug = NATIVE ? window.Capacitor.Plugins : {};
function haptic(kind) {
  try {
    if (NATIVE) {
      if (kind === "match" || kind === "win") Plug.Haptics?.notification({ type: "SUCCESS" });
      else Plug.Haptics?.impact({ style: kind === "medium" ? "MEDIUM" : "LIGHT" });
    } else if (navigator.vibrate) navigator.vibrate(kind === "match" || kind === "win" ? [15, 40, 15] : 8);
  } catch {}
}
const inviteUrl = (code) => `${NATIVE ? SITE : location.origin}/j/${code}`;
const codeFromUrl = (url) => (String(url).match(/\/j\/([A-Za-z0-9]{5})/) || String(url).match(/#([A-Za-z0-9]{5})$/) || [])[1];

const pushOn = () => store.get("mb.push") === "on";
async function enablePush() {
  if (!NATIVE || !Plug.PushNotifications) return;
  try {
    let perm = await Plug.PushNotifications.checkPermissions();
    if (perm.receive !== "granted") perm = await Plug.PushNotifications.requestPermissions();
    if (perm.receive !== "granted") { toast("Notifications are off. You can turn them on in Settings → Matchbook."); return; }
    await Plug.PushNotifications.register(); // the token arrives in the "registration" listener
  } catch { toast("Couldn't turn on notifications."); }
}
if (NATIVE) {
  Plug.PushNotifications?.addListener("registration", async ({ value }) => {
    try { await api("/api/push", { playerId: S.me, token: value }); store.set("mb.push", "on"); toast("Notifications on"); render(); }
    catch (e) { toast(e.message); }
  });

  Plug.PushNotifications?.addListener("pushNotificationActionPerformed", ({ notification }) => {
    const code = notification?.data?.code; if (code) openSession(code);
  });
  Plug.App?.addListener("appUrlOpen", ({ url }) => { const code = codeFromUrl(url); if (code) openSession(code); });
  // Keep the token fresh on each launch once someone has opted in.
  if (pushOn()) Plug.PushNotifications?.register().catch(() => {});
}

let animating = false;
function wireCard(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false, pid = null;
  const yes = $(".stamp.yes", card), no = $(".stamp.no", card);
  card.addEventListener("pointerdown", (e) => {
    if (e.target.closest("a,button") || animating) return;
    active = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.setPointerCapture(pid); card.classList.add("dragging"); card.style.transition = "none";
  });
  card.addEventListener("pointermove", (e) => {
    if (!active || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px, ${dy * 0.4}px) rotate(${dx / 16}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90)); no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!active) return; active = false; card.classList.remove("dragging");
    if (Math.abs(dx) > 100) fly(card, dx > 0 ? 1 : -1, dy);
    else { card.style.transition = "transform .25s"; card.style.transform = ""; yes.style.opacity = 0; no.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", () => { if (active) { dx = 0; end(); } });
}
function flyTop(dir) { const c = $("#stack .card:not(.behind)"); if (c && !animating) fly(c, dir, 0); }
function fly(card, dir, dy) {
  animating = true;
  $(dir > 0 ? ".stamp.yes" : ".stamp.no", card).style.opacity = 1;
  haptic(dir > 0 ? "medium" : "light");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  card.style.transition = reduce ? "none" : "transform .32s ease-in, opacity .32s";
  card.style.transform = `translate(${dir * (window.innerWidth + 200)}px, ${dy * 0.4 + 40}px) rotate(${dir * 28}deg)`;
  card.style.opacity = 0;
  setTimeout(() => { animating = false; decide(card.dataset.id, dir > 0); }, reduce ? 0 : 300);
}
document.addEventListener("keydown", (e) => {
  if (S.view !== "swipe" || e.target.closest("input,textarea")) return;
  if (e.key === "ArrowLeft") flyTop(-1);
  if (e.key === "ArrowRight") flyTop(1);
});

function decide(id, liked) {
  const m = S.mine;
  if (liked) m.likes = [...m.likes, id]; else m.passes = [...m.passes, id];
  if (liked) {
    const others = Object.entries(S.swipes).filter(([pid, s]) => pid !== S.me && (s.likes || []).includes(id)).map(([pid]) => nameOf(pid));
    if (others.length) haptic("match");
    if (others.length) toast(others.length <= 2 ? `${others.join(" & ")} said yes too` : `You and ${others.length} others said yes`, "match");
  }
  m.done = remaining().length === 0;
  S.swipes[S.me] = { ...(S.swipes[S.me] || {}), name: S.name, likes: m.likes, passes: m.passes, done: m.done };
  saveMine();
  if (m.done) setView("waiting"); else render();
}

let saving = false, saveAgain = false;
async function saveMine() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    const r = await api("/api/action", { type: "swipe", code: S.code, playerId: S.me, name: S.name, likes: S.mine.likes, passes: S.mine.passes, done: S.mine.done });
    if (r.phase === "ranking") refresh();
  } catch (e) {
    toast(e.message);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; saveMine(); }
  }
}

const hostName = () => S.session.hostId ? nameOf(S.session.hostId) : "the host";
function defaultBar(n) { return n <= 3 ? n : Math.ceil((n * 2) / 3); }
function qualifying(minYes) {
  const c = likeCounts();
  return S.session.places.filter((p) => (c[p.id] || 0) >= minYes).sort((a, b) => c[b.id] - c[a.id]).map((p) => p.id);
}

function viewWaiting() {
  const ppl = participants(), n = ppl.length;
  const doneCount = ppl.filter((u) => S.swipes[u]?.done).length;
  const allDone = n > 0 && doneCount === n;
  const counts = likeCounts();
  const host = isHost();
  const stored = host && S.minYes != null ? S.minYes : S.session.minYes;
  const minYes = Math.min(Math.max(stored ?? defaultBar(n), 1), Math.max(n, 1));
  const ids = qualifying(minYes);

  const root = el(`<div class="app" style="padding:0">
    <div><div class="eyebrow">Round 1 · ${doneCount} of ${n} done swiping</div>
    <h2 style="font-size:28px;margin-top:4px">${n < 2 ? "Now invite your people" : allDone ? "Everyone's finished" : "Waiting on the others"}</h2></div>
  </div>`);
  root.append(inviteBlock());
  const ppanel = el(`<section class="panel"><div class="eyebrow">Who's swiping (${n})</div></section>`);
  ppanel.append(peopleBlock("swipe")); root.append(ppanel);

  const mp = el(`<section class="panel"></section>`);
  if (n >= 2) {
    mp.append(el(`<div class="field"><span class="label">Count it as a match when</span>
      <div class="stepper" role="group" aria-label="Yes votes needed">
        <button type="button" class="btn" data-step="-1" aria-label="Fewer" ${minYes <= 1 || !host ? "disabled" : ""}>−</button>
        <span class="stepper-val"><b>${minYes}</b> of ${n} say yes${minYes === n ? " (everyone)" : ""}</span>
        <button type="button" class="btn" data-step="1" aria-label="More" ${minYes >= n || !host ? "disabled" : ""}>+</button>
      </div>
      ${host ? "" : `<p class="small muted">${esc(hostName())} sets this.</p>`}</div>`));
  }
  const shown = ids.slice(0, 10);
  mp.append(el(`<div class="row spread"><div class="eyebrow">${n < 2 ? "Your yeses" : "Matches"}</div><span class="count">${ids.length}</span></div>`));
  if (shown.length) mp.append(el(`<ul class="mlist">${shown.map((id) => matchItem(id, null, n >= 2 ? `<span class="yes">${counts[id]}/${n}</span>` : "")).join("")}</ul>`));
  else mp.append(el(`<p class="muted">${n < 2 ? "You passed on everything." : "Nothing has that many yeses yet. Lower the bar or wait for more swipes."}</p>`));
  if (ids.length > 10) mp.append(el(`<p class="small muted">The 10 with the most yeses go to the ranking round.</p>`));
  mp.addEventListener("click", (e) => {
    const b = e.target.closest("[data-step]"); if (!b || !host) return;
    S.minYes = minYes + +b.dataset.step; render(); saveBar();
  });
  root.append(mp);

  const go = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
  if (host) {
    const left = n - doneCount;
    const label = `Start ranking ${Math.min(ids.length, 10)} place${ids.length === 1 ? "" : "s"}`;
    const btn = el(`<button class="btn primary block" type="button"></button>`);
    if (n < 2) {
      btn.textContent = ids.length ? label : "Nothing to rank yet";
      btn.disabled = !ids.length;
      btn.addEventListener("click", () => startRanking(minYes, btn));
      go.append(btn);
    } else if (allDone) {
      const anyYes = Object.keys(counts).length > 0;
      go.append(el(`<div class="notice">${anyYes ? "Getting the ranking round ready…" : "Nobody said yes to anything in this deck. Start a new one with a different category or area."}</div>`));
    } else {
      // Ranking starts for everyone when the last person finishes; one straggler shouldn't hold a big group forever.
      go.append(el(`<div class="notice">Ranking starts for everyone as soon as the last ${left === 1 ? "person finishes" : left + " people finish"}.</div>`));
      if (ids.length) {
        const early = el(`<button class="btn ghost block" type="button">${S.confirmEarly ? `Tap again: ${esc(label.toLowerCase())} without them` : "Start without them"}</button>`);
        early.addEventListener("click", () => {
          if (!S.confirmEarly) { S.confirmEarly = true; render(); return; }
          startRanking(minYes, early);
        });
        go.append(early);
        if (S.confirmEarly) go.append(el(`<p class="small muted">Their yeses won't count toward matches, but they can still rank.</p>`));
      }
    }
  } else {
    go.append(el(`<div class="notice">${allDone ? "Getting the ranking round ready…" : "Ranking starts for everyone as soon as the last person finishes. This page updates on its own."}</div>`));
  }
  const notify = pushPrompt("Notify me when it's time to rank");
  if (notify) go.append(notify);
  const again = el(`<button class="btn ghost block" type="button">Start a new deck</button>`);
  again.addEventListener("click", leave);
  go.append(again);
  root.append(go);
  return root;
}

let barTimer;
function saveBar() {
  clearTimeout(barTimer);
  barTimer = setTimeout(() => api("/api/action", { type: "bar", code: S.code, playerId: S.me, name: S.name, minYes: S.minYes }).catch((e) => toast(e.message)), 400);
}

async function startRanking(minYes, btn) {
  btn.disabled = true;
  try {
    const r = await api("/api/action", { type: "phase", code: S.code, playerId: S.me, name: S.name, minYes });
    S.session = { ...S.session, phase: "ranking", matches: r.matches };
    setView("rank");
  } catch (e) { btn.disabled = false; toast(e.message); }
}

function viewRank() {
  const ids = S.session.matches || [];
  if (!S.rankOrder || S.rankOrder.length !== ids.length || !ids.every((i) => S.rankOrder.includes(i))) {
    S.rankOrder = [...ids].sort((a, b) => (S.mine.likes.includes(b) ? 1 : 0) - (S.mine.likes.includes(a) ? 1 : 0));
  }
  const root = el(`<div class="app rank" style="padding:0">
    <div><div class="eyebrow">Round 2 · Rank</div><h2 style="font-size:28px;margin-top:4px">Put your favorite on top</h2>
    <p class="muted" style="margin-top:6px">Drag by the dots, or use the arrows. Everyone's lists combine into one winner.</p></div>
    <ol class="mlist" id="rankList"></ol>
    <button class="btn primary block" type="button" id="submitRank">Submit my ranking</button>
  </div>`);
  const list = $("#rankList", root);
  const draw = () => {
    list.innerHTML = S.rankOrder.map((id, i) => matchItem(id, i, `<span class="handle"><button type="button" data-mv="-1" aria-label="Move up" ${i === 0 ? "disabled" : ""}>${ICON.up}</button><button type="button" data-mv="1" aria-label="Move down" ${i === S.rankOrder.length - 1 ? "disabled" : ""}>${ICON.down}</button><span class="grip" aria-hidden="true">${ICON.grip}</span></span>`)).join("");
  };
  draw();
  list.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mv]"); if (!b) return;
    const id = b.closest(".mitem").dataset.id, i = S.rankOrder.indexOf(id), j = i + +b.dataset.mv;
    if (j < 0 || j >= S.rankOrder.length) return;
    [S.rankOrder[i], S.rankOrder[j]] = [S.rankOrder[j], S.rankOrder[i]]; draw(); haptic("light");
    list.querySelector(`[data-id="${CSS.escape(id)}"] [data-mv="${b.dataset.mv}"]`)?.focus();
  });
  let drag = null;
  list.addEventListener("pointerdown", (e) => {
    const item = e.target.closest(".mitem"); if (!item || e.target.closest("button")) return;
    if (e.pointerType !== "mouse" && !e.target.closest(".grip")) return;
    e.preventDefault(); drag = { item, pid: e.pointerId }; item.classList.add("lifted"); list.setPointerCapture(e.pointerId);
  });
  list.addEventListener("pointermove", (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    let placed = false;
    for (const s of [...list.children].filter((c) => c !== drag.item)) {
      const r = s.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { if (drag.item.nextElementSibling !== s) list.insertBefore(drag.item, s); placed = true; break; }
    }
    if (!placed && list.lastElementChild !== drag.item) list.append(drag.item);
  });
  const drop = () => {
    if (!drag) return; drag.item.classList.remove("lifted"); drag = null; haptic("light");
    S.rankOrder = [...list.children].map((c) => c.dataset.id); draw();
  };
  list.addEventListener("pointerup", drop); list.addEventListener("pointercancel", drop);

  $("#submitRank", root).addEventListener("click", async (e) => {
    const btn = e.currentTarget; btn.disabled = true;
    try {
      await api("/api/action", { type: "rank", code: S.code, playerId: S.me, name: S.name, order: S.rankOrder });
      S.ranks[S.me] = { name: S.name, order: [...S.rankOrder] };
      setView("results");
    } catch (err) { btn.disabled = false; toast(err.message); }
  });
  return root;
}

function tally() {
  const ids = S.session.matches || [], n = ids.length;
  const pts = Object.fromEntries(ids.map((i) => [i, 0])), per = {};
  for (const [pid, r] of Object.entries(S.ranks)) {
    (r.order || []).filter((i) => i in pts).forEach((id, pos) => { pts[id] += n - pos; (per[id] ||= {})[pid] = pos + 1; });
  }
  const ranked = ids.slice().sort((a, b) => pts[b] - pts[a] || ids.indexOf(a) - ids.indexOf(b));
  return { ranked, pts, per };
}

function viewResults() {
  const rankers = Object.keys(S.ranks);
  const everyone = [...new Set([...participants(), ...rankers])];
  const waiting = everyone.filter((u) => !S.ranks[u]);
  const { ranked, pts, per } = tally();
  const top = placeById(ranked[0]);
  const final = S.session.phase === "done" || (waiting.length === 0 && rankers.length > 0);
  if (final && S.celebrated !== S.code) { S.celebrated = S.code; haptic("win"); }
  const tied = ranked.slice(1).filter((id) => pts[id] === pts[ranked[0]]).map((id) => placeById(id)?.name);
  const waitingText = waiting.length <= 3 ? waiting.map(nameOf).join(", ") : `${waiting.slice(0, 2).map(nameOf).join(", ")} and ${waiting.length - 2} more`;
  const root = el(`<div class="app" style="padding:0">
    <div><div class="eyebrow">${final ? "The verdict" : `Results so far · ${rankers.length} of ${everyone.length} ranked`}</div>
    <h2 style="font-size:28px;margin-top:4px">${final ? "You're going to…" : `Waiting on ${esc(waitingText)}`}</h2></div>
  </div>`);
  if (top) root.append(el(`<section class="winner ${coverFor(top)}">
    ${top.photo ? `<img src="${esc(photoUrl(top))}" alt="" style="width:calc(100% + 44px);margin:-22px -22px 4px;height:180px;object-fit:cover;display:block" onerror="this.remove()">` : ""}
    <div class="pad">
    <div class="eyebrow" style="color:inherit;opacity:.85">${final ? "Winner" : "Leading"} · ${pts[top.id]} pts</div>
    <h2>${esc(top.name)}</h2>
    <div>${esc([top.kind, top.rating ? "★ " + top.rating.toFixed(1) : "", top.price].filter(Boolean).join(" · "))}</div>
    <div>${esc(top.address)}</div>
    ${tied.length ? `<p style="font-weight:600">Tied with ${esc(tied.join(" and "))}. It's listed first only because it had more yeses or came up earlier. Talk it out or flip a coin.</p>` : ""}
    <a class="maps" style="font-weight:700" href="${esc(mapsUrl(top))}" target="_blank" rel="noopener">Open in Google Maps</a>
  </div></section>`));
  // A column per person stops fitting past a few people, so big groups get points plus my own pick.
  const wide = rankers.length <= 4;
  root.append(el(`<section class="panel"><div class="eyebrow">Combined ranking</div><div class="table-wrap"><table class="scores">
    <thead><tr><th>#</th><th>Place</th>${wide ? rankers.map((u) => `<th class="n">${esc(nameOf(u))}</th>`).join("") : S.ranks[S.me] ? `<th class="n">You</th>` : ""}<th class="n">Pts</th></tr></thead>
    <tbody>${ranked.map((id, i) => `<tr><td>${i + 1}</td><td>${esc(placeById(id)?.name)}</td>${wide ? rankers.map((u) => `<td class="n">${per[id]?.[u] ?? "–"}</td>`).join("") : S.ranks[S.me] ? `<td class="n">${per[id]?.[S.me] ?? "–"}</td>` : ""}<td class="n">${pts[id]}</td></tr>`).join("")}</tbody>
  </table></div><p class="small muted">Each person's list gives their top pick ${ranked.length} points, the next ${Math.max(ranked.length - 1, 0)}, and so on.</p></section>`));
  const pp = el(`<section class="panel"><div class="eyebrow">Rankings in (${rankers.length}/${everyone.length})</div></section>`);
  pp.append(peopleBlock("rank")); root.append(pp);
  const row = el(`<div style="display:flex;flex-direction:column;gap:8px"></div>`);
  if (!final && isHost()) {
    const close = el(`<button class="btn primary block" type="button">Close voting and pick the winner</button>`);
    close.addEventListener("click", async () => {
      close.disabled = true;
      try { await api("/api/action", { type: "close", code: S.code, playerId: S.me, name: S.name }); S.session = { ...S.session, phase: "done" }; render(); }
      catch (e) { close.disabled = false; toast(e.message); }
    });
    row.append(close);
  }
  if (!final) { const notify = pushPrompt("Notify me when the winner is picked"); if (notify) row.append(notify); }
  if (S.session.phase === "ranking") {
    const edit = el(`<button class="btn block" type="button">Change my ranking</button>`); edit.addEventListener("click", () => setView("rank"));
    row.append(edit);
  }
  const again = el(`<button class="btn ghost block" type="button">Start a new deck</button>`); again.addEventListener("click", leave);
  row.append(again); root.append(row);
  return root;
}

// ---------- flows ----------
async function createDeck() {
  const f = S.form; S.error = "";
  if (f.cat === "custom" && !f.custom.trim()) { S.error = "Type what kind of place you're looking for."; return render(); }
  if (f.lat == null && !f.area.trim()) { S.error = "Add a city, neighborhood or ZIP code, or tap Near me."; return render(); }
  setView("loading");
  try {
    const { code } = await api("/api/deck", {
      category: f.cat, custom: f.custom, area: f.area, lat: f.lat, lng: f.lng, areaLabel: f.lat != null ? "you" : "",
      playerId: S.me, radiusMi: f.radius, count: f.count, openNow: f.openNow, maxPrice: f.maxPrice,
    });
    openSession(code);
  } catch (e) { S.error = e.message; setView("home"); }
}

function stopPolling() { clearInterval(S.pollTimer); S.pollTimer = null; }
function leave() {
  stopPolling();
  Object.assign(S, { code: null, session: null, swipes: {}, ranks: {}, rankOrder: null, minYes: null, confirmEarly: false, mine: { likes: [], passes: [], done: false }, error: "" });
  try { history.replaceState(null, "", "/"); } catch {}
  setView("home");
}

async function refresh() {
  if (!S.code || document.hidden) return;
  try {
    const r = await api("/api/deck?code=" + S.code);
    S.session = r.deck; S.swipes = r.swipes; S.ranks = r.ranks;
    if (!S.swipes[S.me]) S.swipes[S.me] = { name: S.name, likes: S.mine.likes, passes: S.mine.passes, done: S.mine.done };
    route();
  } catch { /* keep showing what we have; the next poll tries again */ }
}

function route() {
  const mineRanked = !!S.ranks[S.me];
  let want;
  if (S.session.phase === "done") want = "results";
  else if (S.session.phase === "ranking") want = !mineRanked ? "rank" : S.view === "rank" ? "rank" : "results";
  else want = remaining().length === 0 ? "waiting" : "swipe";
  if (want !== S.view) setView(want);
  else if (S.view === "waiting" || S.view === "results") render(); // live updates; never redraw mid-swipe or mid-sort
}

async function openSession(raw) {
  const code = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5);
  if (!code) return;
  if (!S.name) { S.pendingCode = code; return setView("name"); }
  stopPolling();
  Object.assign(S, { code, session: null, swipes: {}, ranks: {}, rankOrder: null, minYes: null, confirmEarly: false, mine: { likes: [], passes: [], done: false }, error: "" });
  try { history.replaceState(null, "", "/#" + code); } catch {}
  let r;
  try { r = await api("/api/deck?code=" + code); }
  catch (e) { S.error = e.message; S.code = null; return setView("missing"); }
  S.session = r.deck; S.swipes = r.swipes; S.ranks = r.ranks;
  remember(r.deck);
  const mine = S.swipes[S.me];
  if (mine) S.mine = { likes: [...(mine.likes || [])], passes: [...(mine.passes || [])], done: !!mine.done };
  else { S.swipes[S.me] = { name: S.name, likes: [], passes: [], done: false }; saveMine(); } // join as a swiper
  if (S.ranks[S.me]) S.rankOrder = [...S.ranks[S.me].order];
  S.view = "";
  route();
  S.pollTimer = setInterval(refresh, 3000);
}

$("#homeBtn").addEventListener("click", () => { if (S.view !== "loading") leave(); });
$("#codePill").addEventListener("click", () => { if (S.session) invite(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

const fromLink = codeFromUrl(location.pathname) || codeFromUrl(location.hash);
if (fromLink) openSession(fromLink); else render();
</script>
</body>
