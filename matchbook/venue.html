<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="List group deals on Matchbook and get booked by groups deciding where to go.">
<title>Matchbook for Venues</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #F4F5F7; --surface: #FFFFFF; --sunk: #ECEEF2; --ink: #10151D; --muted: #5E6875; --line: #E3E6EB; --match: #D33A2C; --match-ink: #FFFFFF; --like: #23895B; --sulfur: #E9A92E;
  --soft-shadow: 0 1px 2px rgba(16,21,29,.05), 0 10px 28px rgba(16,21,29,.07); --ring: color-mix(in srgb, var(--match) 35%, transparent);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif; --f-body: "Figtree", system-ui, -apple-system, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0B0E13; --surface: #151A21; --sunk: #1D232C; --ink: #EEF1F5; --muted: #98A2B1; --line: #262E39; --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --sulfur: #F2BB4A; --soft-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0B0E13; --surface: #151A21; --sunk: #1D232C; --ink: #EEF1F5; --muted: #98A2B1; --line: #262E39; --match: #F0624F; --match-ink: #1A0B08; --like: #44C089; --sulfur: #F2BB4A; --soft-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); color-scheme: dark; }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top, 0) 16px 48px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; } a { color: var(--match); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--match); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 4px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand svg { width: 20px; height: 42px; } .brand b { font-family: var(--f-display); font-size: 21px; } .brand span { color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border-radius: 22px; box-shadow: var(--soft-shadow); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .label { font-weight: 700; font-size: 15px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input, select.input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid transparent; background: var(--sunk); }
.input:focus { outline: none; border-color: var(--match); background: var(--surface); box-shadow: 0 0 0 4px var(--ring); }
textarea.input { resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 14px; border: 0; cursor: pointer; font-weight: 700; background: var(--sunk); color: var(--ink); text-decoration: none; }
.btn.primary { background: var(--match); color: var(--match-ink); }
.btn.block { width: 100%; } .btn.small { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .spread { justify-content: space-between; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 13px; border-radius: 999px; border: 0; background: var(--sunk); font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--sunk); }
.seg button { border: 0; background: none; padding: 10px; border-radius: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--soft-shadow); }
.err { color: var(--match); font-weight: 600; font-size: 14px; }
.badge { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--sunk); white-space: nowrap; }
.badge.live { background: color-mix(in srgb, var(--like) 22%, transparent); color: var(--like); }
.badge.wait { background: color-mix(in srgb, var(--sulfur) 28%, transparent); }
.badge.no { background: color-mix(in srgb, var(--match) 18%, transparent); color: var(--match); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.steps li { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; }
.steps .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); font-weight: 800; font-size: 14px; }
.steps .done .n { background: var(--like); color: #fff; }
.offer { border-radius: 18px; background: var(--sunk); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.offer h3 { font-size: 19px; }
.stats { display: flex; gap: 16px; font-size: 14px; color: var(--muted); } .stats b { color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 10px; }
.bk { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; border-radius: 16px; background: var(--sunk); }
.bk .when { font-weight: 800; } .bk .sub { font-size: 14px; color: var(--muted); }
.items { display: flex; flex-direction: column; gap: 6px; }
.item-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.hero { padding: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
.hero h1 { font-size: clamp(30px, 7vw, 42px); line-height: 1.05; }
.perks { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.perk { background: var(--surface); border-radius: 18px; box-shadow: var(--soft-shadow); padding: 16px; }
.perk b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 10; }
.toast.show { opacity: 1; }
.places { display: flex; flex-direction: column; gap: 6px; }
.places button { text-align: left; border: 0; background: var(--sunk); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.places button span { display: block; font-size: 13px; color: var(--muted); }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/venue.html"><svg viewBox="31 12 38 80" aria-hidden="true"><path d="M50 44 C36 35 33 21 42 17 C47 15 50 19 50 22 C50 19 53 15 58 17 C67 21 64 35 50 44Z" fill="#E9A92E"/><path d="M50 40 C42 34 41 26 45 24 C48 23 50 26 50 27 C50 26 52 23 55 24 C59 26 58 34 50 40Z" fill="#FFE08A"/><rect x="45" y="50" width="10" height="40" rx="3" fill="#C9A37A"/><ellipse cx="50" cy="50" rx="8" ry="9" fill="#D33A2C"/></svg><b>Matchbook</b><span>for venues</span></a>
    <button class="btn ghost small" id="logout" hidden>Log out</button>
  </header>
  <main id="view" class="wrap"><p class="muted">Loading…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const money = (c) => "$" + (c / 100).toLocaleString(undefined, { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const KINDS = { restaurant: "Restaurant", bar: "Bar", activity: "Activity", other: "Other" };
const fmt12 = (t) => { const [h, m] = t.split(":").map(Number); return `${((h + 11) % 12) + 1}${m ? ":" + String(m).padStart(2, "0") : ""}${h < 12 ? "am" : "pm"}`; };
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
let toastT; const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2800); };

async function api(op, data, method = data ? "POST" : "GET") {
  const r = await fetch("/api/market?op=" + op, { method, headers: { "Content-Type": "application/json" }, body: data ? JSON.stringify(data) : undefined, credentials: "same-origin" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong. Try again."), { status: r.status });
  return j;
}

const S = { data: null, mode: "signup", editing: null, error: "" };

async function load() {
  try { S.data = await api("me"); } catch (e) { S.data = null; if (e.status !== 401) S.error = e.message; }
  render();
}
function render() {
  $("#logout").hidden = !S.data;
  const v = $("#view"); v.innerHTML = "";
  v.append(S.data ? (S.editing ? offerEditor() : dashboard()) : welcome());
}

// ---------- signed out ----------
function welcome() {
  const signup = S.mode === "signup";
  const root = el(`<div class="wrap">
    <section class="hero"><h1>Get booked by groups who are deciding where to go.</h1>
      <p class="muted">Matchbook groups swipe on places together. List a group deal (a bundle, a price per person, the times you can take a group) and they book it right in the app, each person paying their share.</p></section>
    <div class="perks">
      <div class="perk"><b>Nothing upfront</b><span class="muted small">Matchbook keeps 10% of each booking. Payouts go straight to your bank through Stripe.</span></div>
      <div class="perk"><b>Paid before they arrive</b><span class="muted small">A booking only confirms once everyone in the group has paid.</span></div>
      <div class="perk"><b>Get seen</b><span class="muted small">Your deal shows on your card while groups swipe. Boost it to appear between swipes nearby.</span></div>
    </div>
    <section class="panel">
      <div class="seg" role="group"><button type="button" data-mode="signup" aria-pressed="${signup}">Create an account</button><button type="button" data-mode="login" aria-pressed="${!signup}">Log in</button></div>
      <form id="authForm" style="display:flex;flex-direction:column;gap:14px" novalidate>
        ${signup ? `
        <div class="field"><label for="name">Business name</label><input class="input" id="name" maxlength="80" autocomplete="organization" required></div>
        <div class="field"><span class="label">What kind of place?</span><div class="chips" id="kinds">${Object.entries(KINDS).map(([k, l], i) => `<button type="button" class="chip" data-kind="${k}" aria-pressed="${i === 0}">${l}</button>`).join("")}</div></div>
        <div class="field"><label for="address">Address</label><input class="input" id="address" maxlength="160" autocomplete="street-address" placeholder="Street, city, state"></div>
        <div class="grid2"><div class="field"><label for="contact">Your name</label><input class="input" id="contact" maxlength="60" autocomplete="name"></div>
        <div class="field"><label for="phone">Phone</label><input class="input" id="phone" maxlength="30" autocomplete="tel" inputmode="tel"></div></div>` : ""}
        <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" maxlength="254" autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" minlength="8" autocomplete="${signup ? "new-password" : "current-password"}">${signup ? `<span class="small muted">At least 8 characters.</span>` : ""}</div>
        ${S.error ? `<p class="err">${esc(S.error)}</p>` : ""}
        <button class="btn primary block" type="submit">${signup ? "Create my venue account" : "Log in"}</button>
        ${signup ? `<p class="small muted">We review every venue before it goes live, usually within a day.</p>` : `<p class="small muted">Forgot your password? Email us from your account's address and we'll reset it.</p>`}
      </form>
    </section></div>`);
  root.addEventListener("click", (e) => {
    const m = e.target.closest("[data-mode]"); if (m) { S.mode = m.dataset.mode; S.error = ""; render(); }
    const k = e.target.closest("[data-kind]"); if (k) root.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", b === k));
  });
  $("#authForm", root).addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = $("button[type=submit]", root); btn.disabled = true;
    const val = (id) => $("#" + id, root)?.value.trim() || "";
    try {
      if (signup) await api("signup", { name: val("name"), kind: $("[data-kind][aria-pressed=true]", root).dataset.kind, address: val("address"), contact: val("contact"), phone: val("phone"), email: val("email"), password: $("#password", root).value, tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
      else await api("login", { email: val("email"), password: $("#password", root).value });
      S.error = ""; await load();
    } catch (err) { S.error = err.message; btn.disabled = false; render(); }
  });
  return root;
}

// ---------- dashboard ----------
function dashboard() {
  const { venue: v, offers, bookings, feePercent, boostDaily, paymentsOn } = S.data;
  const status = v.status === "approved" ? `<span class="badge live">Approved</span>` : v.status === "rejected" ? `<span class="badge no">Not approved</span>` : `<span class="badge wait">In review</span>`;
  const anyLive = offers.some((o) => o.live);
  const root = el(`<div class="wrap">
    <div class="row spread"><div><div class="eyebrow">${esc(KINDS[v.kind] || "Venue")} · ${esc(v.address)}</div><h1 style="font-size:30px">${esc(v.name)}</h1></div>${status}</div>
    ${anyLive ? "" : `<section class="panel"><h2 style="font-size:20px">Getting live</h2><ol class="steps">
      <li class="${v.status === "approved" ? "done" : ""}"><span class="n">${v.status === "approved" ? "✓" : 1}</span><span><b>Matchbook approves your venue</b><br><span class="small muted">${v.status === "rejected" ? "We couldn't verify this venue. Reply to our email or contact us to sort it out." : v.status === "approved" ? "You're approved." : "We review new venues within a day."}</span></span><span></span></li>
      <li class="${v.payoutsReady ? "done" : ""}"><span class="n">${v.payoutsReady ? "✓" : 2}</span><span><b>Set up payouts</b><br><span class="small muted">${v.payoutsReady ? "Payouts are set up with Stripe." : "Stripe collects your bank details so groups' payments reach you. Matchbook never sees them."}</span></span>
        ${v.payoutsReady ? "<span></span>" : `<button class="btn primary small" type="button" data-payouts ${paymentsOn ? "" : "disabled"}>${v.stripeAccount ? "Finish setup" : "Set up"}</button>`}</li>
      <li class="${offers.length ? "done" : ""}"><span class="n">${offers.length ? "✓" : 3}</span><span><b>Create a group offer</b><br><span class="small muted">A bundle with a price per person and the times you can host a group.</span></span>
        ${offers.length ? "<span></span>" : `<button class="btn small" type="button" data-new>Create</button>`}</li>
    </ol>${paymentsOn ? "" : `<p class="small muted">Payments are being switched on. You can create offers now.</p>`}</section>`}
    <section class="panel"><div class="row spread"><h2 style="font-size:20px">Group offers</h2><button class="btn primary small" type="button" data-new>New offer</button></div>
      <div class="list" id="offers"></div></section>
    <section class="panel"><h2 style="font-size:20px">Bookings</h2><div class="list" id="bookings"></div></section>
    <section class="panel" id="profile"><h2 style="font-size:20px">Venue details</h2>
      <div class="grid2"><div class="field"><label for="pName">Business name</label><input class="input" id="pName" maxlength="80" value="${esc(v.name)}"></div>
      <div class="field"><label for="pPhone">Phone</label><input class="input" id="pPhone" maxlength="30" value="${esc(v.phone)}"></div></div>
      <div class="field"><label for="pAddress">Address</label><input class="input" id="pAddress" maxlength="160" value="${esc(v.address)}"></div>
      <div class="field"><label for="pAbout">About your place <span class="muted">(shown on your offers)</span></label><textarea class="input" id="pAbout" rows="3" maxlength="400">${esc(v.about)}</textarea></div>
      <div class="field"><span class="label">Your Google Maps listing</span>
        <p class="small muted">${v.gid ? "Linked. Your deal shows on your card when groups swipe past you." : "Link it so your deal shows on your card when groups swipe past you."}</p>
        <div class="row"><input class="input" id="gq" style="flex:1;min-width:0" placeholder="${esc(v.name)}, city"><button class="btn small" type="button" data-gsearch>Find</button>${v.gid ? `<button class="btn ghost small" type="button" data-gunlink>Unlink</button>` : ""}</div>
        <div class="places" id="gres"></div></div>
      <button class="btn block" type="button" data-save>Save details</button>
    </section>
    <p class="small muted">Matchbook keeps ${feePercent}% of each booking. Boosts are ${money(boostDaily)} a day. Questions? <a href="https://github.com/robertfrazee-dev/pm-toolkit/issues" rel="noopener">Contact us</a>.</p>
  </div>`);

  const ol = $("#offers", root);
  if (!offers.length) ol.append(el(`<p class="muted">No offers yet. A good first one: a set menu or a reserved area for 6–12 people at a fixed price per person.</p>`));
  for (const o of offers) {
    const boosted = (o.boostUntil || 0) > Date.now();
    const card = el(`<article class="offer"><div class="row spread"><h3>${esc(o.title)}</h3>${o.live ? `<span class="badge live">${boosted ? "Live · boosted" : "Live"}</span>` : o.active ? `<span class="badge wait">Not live yet</span>` : `<span class="badge">Paused</span>`}</div>
      <div><b>${money(o.ppp)}</b> per person · groups of ${o.minGroup}–${o.maxGroup} · ${o.days.map((d) => DAYS[d]).join(", ")} at ${o.times.map(fmt12).join(", ")}</div>
      ${o.includes.length ? `<div class="small muted">Includes: ${o.includes.map(esc).join(" · ")}</div>` : ""}
      <div class="stats"><span><b>${o.stats.views || 0}</b> seen</span><span><b>${o.stats.taps || 0}</b> opened</span><span><b>${o.stats.bookings || 0}</b> booked</span>${boosted ? `<span>Boosted until ${new Date(o.boostUntil).toLocaleDateString()}</span>` : ""}</div>
      <div class="row"><button class="btn small" type="button" data-edit="${o.id}">Edit</button>
        <button class="btn small" type="button" data-toggle="${o.id}">${o.active ? "Pause" : "Resume"}</button>
        ${o.live ? `<select class="input" style="width:auto;padding:8px 10px" data-boostdays="${o.id}">${[1, 3, 7, 14, 30].map((d) => `<option value="${d}" ${d === 7 ? "selected" : ""}>${d} day${d > 1 ? "s" : ""} · ${money(d * boostDaily)}</option>`).join("")}</select><button class="btn primary small" type="button" data-boost="${o.id}">Boost</button>` : ""}
        <button class="btn ghost small" type="button" data-del="${o.id}">Delete</button></div></article>`);
    ol.append(card);
  }

  const bl = $("#bookings", root);
  const upcoming = bookings.filter((b) => ["confirmed", "holding"].includes(b.status) && b.slotAt > Date.now() - 6 * 3600e3);
  const past = bookings.filter((b) => !upcoming.includes(b)).slice(0, 10);
  if (!bookings.length) bl.append(el(`<p class="muted">No bookings yet. They'll show here as groups book, with who's paid.</p>`));
  for (const b of [...upcoming.sort((a, c) => a.slotAt - c.slotAt), ...past]) {
    const label = { confirmed: "Confirmed · paid", holding: `Waiting on payments · ${b.paid}/${b.size}`, expired: "Expired · not paid in time", canceled: "Canceled by group", canceled_by_venue: "Canceled · refunded" }[b.status] || b.status;
    const row = el(`<div class="bk"><span class="when">${esc(fmtDay(b.date))} · ${esc(fmt12(b.time))}</span><span class="badge ${b.status === "confirmed" ? "live" : b.status === "holding" ? "wait" : ""}">${esc(label)}</span>
      <span class="sub">${esc(b.title)} · group of ${b.size} · booked by ${esc(b.organizerName)} · ${money(b.total)} (you get ${money(Math.round(b.total * (1 - S.data.feePercent / 100)))})</span>
      ${["confirmed", "holding"].includes(b.status) ? `<button class="btn ghost small" type="button" data-cancel="${b.id}">Cancel</button>` : "<span></span>"}</div>`);
    bl.append(row);
  }

  root.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t) return;
    try {
      if (t.matches("[data-new]")) { S.editing = { id: "", title: "", about: "", includes: [], ppp: 3000, minGroup: 4, maxGroup: 12, days: [4, 5, 6], times: ["19:00"], perSlot: 1, leadHours: 24, duration: 120, active: true }; render(); scrollTo(0, 0); }
      if (t.dataset.edit) { S.editing = structuredClone(offers.find((o) => o.id === t.dataset.edit)); render(); scrollTo(0, 0); }
      if (t.dataset.toggle) { const o = offers.find((x) => x.id === t.dataset.toggle); await api("offer", offerPayload({ ...o, active: !o.active })); toast(o.active ? "Paused" : "Resumed"); await load(); }
      if (t.dataset.del) { if (!confirm("Delete this offer? Bookings already made stay.")) return; await api("offerdelete", { id: t.dataset.del }); toast("Deleted"); await load(); }
      if (t.dataset.boost) { t.disabled = true; const days = $(`[data-boostdays="${t.dataset.boost}"]`, root).value; location.href = (await api("boost", { offerId: t.dataset.boost, days })).url; }
      if (t.matches("[data-payouts]")) { t.disabled = true; location.href = (await api("payouts", {})).url; }
      if (t.dataset.cancel) {
        const b = bookings.find((x) => x.id === t.dataset.cancel);
        if (!confirm(b.status === "confirmed" ? "Cancel this booking? Everyone in the group gets a full refund." : "Cancel this booking? Nobody has been charged yet.")) return;
        await api("vcancel", { bookingId: b.id }); toast("Booking canceled"); await load();
      }
      if (t.matches("[data-gsearch]")) {
        const res = $("#gres", root); res.innerHTML = `<p class="small muted">Searching…</p>`;
        const r = await api("placesearch", { q: $("#gq", root).value || v.name + " " + v.address });
        res.innerHTML = r.places.length ? "" : `<p class="small muted">Nothing found. Try your name and city.</p>`;
        for (const p of r.places) res.append(el(`<button type="button" data-gid="${esc(p.gid)}"><b>${esc(p.name)}</b><span>${esc(p.address)}</span></button>`));
      }
      if (t.dataset.gid) { await api("profile", { ...profileVals(root), gid: t.dataset.gid }); toast("Google listing linked"); await load(); }
      if (t.matches("[data-gunlink]")) { await api("profile", { ...profileVals(root), gid: "" }); toast("Unlinked"); await load(); }
      if (t.matches("[data-save]")) { t.disabled = true; await api("profile", profileVals(root)); toast("Saved"); await load(); }
    } catch (err) { toast(err.message); t.disabled = false; }
  });
  return root;
}
const profileVals = (root) => ({ name: $("#pName", root).value, phone: $("#pPhone", root).value, address: $("#pAddress", root).value, about: $("#pAbout", root).value, kind: S.data.venue.kind, tz: S.data.venue.tz, gid: S.data.venue.gid });
const offerPayload = (o) => ({ id: o.id || undefined, title: o.title, about: o.about, includes: o.includes, price: o.ppp / 100, minGroup: o.minGroup, maxGroup: o.maxGroup, days: o.days, times: o.times, perSlot: o.perSlot, leadHours: o.leadHours, duration: o.duration, active: o.active });

// ---------- offer editor ----------
function offerEditor() {
  const o = S.editing, fee = S.data.feePercent;
  const root = el(`<form class="panel" novalidate>
    <div class="row spread"><h2 style="font-size:22px">${o.id ? "Edit offer" : "New group offer"}</h2><button class="btn ghost small" type="button" data-back>Cancel</button></div>
    <div class="field"><label for="oTitle">Name</label><input class="input" id="oTitle" maxlength="60" placeholder="Birthday package for 6–12" value="${esc(o.title)}"></div>
    <div class="field"><label for="oAbout">Describe it</label><textarea class="input" id="oAbout" rows="3" maxlength="400" placeholder="What the night looks like, where they'll sit, anything to know.">${esc(o.about)}</textarea></div>
    <div class="field"><span class="label">What's included</span><div class="items" id="items">${o.includes.map((x, i) => `<div class="item-row"><input class="input" data-item="${i}" maxlength="60" value="${esc(x)}"><button class="btn small" type="button" data-rmitem="${i}" aria-label="Remove">×</button></div>`).join("")}</div>
      ${o.includes.length < 8 ? `<button class="btn small" type="button" data-additem style="align-self:flex-start">+ Add an item</button>` : ""}<span class="small muted">For example: reserved booth, 2 pitchers per 4 people, wings platter.</span></div>
    <div class="grid2"><div class="field"><label for="oPrice">Price per person ($)</label><input class="input" id="oPrice" type="number" min="1" max="2000" step="0.5" inputmode="decimal" value="${o.ppp / 100}"><span class="small muted" id="youGet"></span></div>
      <div class="field"><label for="oDur">How long (minutes)</label><input class="input" id="oDur" type="number" min="30" max="600" step="15" value="${o.duration}"></div></div>
    <div class="grid2"><div class="field"><label for="oMin">Smallest group</label><input class="input" id="oMin" type="number" min="2" max="50" value="${o.minGroup}"></div>
      <div class="field"><label for="oMax">Largest group</label><input class="input" id="oMax" type="number" min="2" max="100" value="${o.maxGroup}"></div></div>
    <div class="field"><span class="label">Days</span><div class="chips">${DAYS.map((d, i) => `<button type="button" class="chip" data-day="${i}" aria-pressed="${o.days.includes(i)}">${d}</button>`).join("")}</div></div>
    <div class="field"><span class="label">Start times</span><div class="chips">${o.times.map((t, i) => `<button type="button" class="chip" aria-pressed="true" data-rmtime="${i}" aria-label="Remove ${fmt12(t)}">${fmt12(t)} ×</button>`).join("")}</div>
      <div class="row"><input class="input" id="oTime" type="time" step="900" style="width:auto"><button class="btn small" type="button" data-addtime>Add time</button></div></div>
    <div class="grid2"><div class="field"><label for="oPer">Groups you can host per time</label><input class="input" id="oPer" type="number" min="1" max="20" value="${o.perSlot}"></div>
      <div class="field"><label for="oLead">Book at least (hours ahead)</label><input class="input" id="oLead" type="number" min="3" max="336" value="${o.leadHours}"></div></div>
    <label class="row" style="font-weight:700"><input type="checkbox" id="oActive" ${o.active ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--match)"> Taking bookings</label>
    <p class="err" id="oErr" hidden></p>
    <button class="btn primary block" type="submit">${o.id ? "Save changes" : "Create offer"}</button>
  </form>`);
  const sync = () => {
    o.title = $("#oTitle", root).value; o.about = $("#oAbout", root).value;
    o.includes = [...root.querySelectorAll("[data-item]")].map((i) => i.value);
    o.ppp = Math.round(Number($("#oPrice", root).value) * 100) || 0; o.duration = +$("#oDur", root).value;
    o.minGroup = +$("#oMin", root).value; o.maxGroup = +$("#oMax", root).value; o.perSlot = +$("#oPer", root).value; o.leadHours = +$("#oLead", root).value;
    o.active = $("#oActive", root).checked;
    $("#youGet", root).textContent = o.ppp ? `You get ${money(Math.round(o.ppp * (1 - fee / 100)))} per person after Matchbook's ${fee}%.` : "";
  };
  root.addEventListener("input", sync); setTimeout(sync);
  root.addEventListener("click", (e) => {
    const t = e.target.closest("button"); if (!t || t.type === "submit") return;
    sync();
    if (t.matches("[data-back]")) { S.editing = null; render(); return; }
    if (t.dataset.day != null) { const d = +t.dataset.day; o.days = o.days.includes(d) ? o.days.filter((x) => x !== d) : [...o.days, d].sort(); }
    if (t.matches("[data-additem]")) { o.includes.push(""); render(); $(`[data-item="${o.includes.length - 1}"]`)?.focus(); return; }
    if (t.dataset.rmitem != null) o.includes.splice(+t.dataset.rmitem, 1);
    if (t.matches("[data-addtime]")) { const v = $("#oTime", root).value; if (!v) return toast("Pick a time first."); if (!o.times.includes(v)) o.times = [...o.times, v].sort(); }
    if (t.dataset.rmtime != null) o.times.splice(+t.dataset.rmtime, 1);
    render();
  });
  root.addEventListener("submit", async (e) => {
    e.preventDefault(); sync();
    const btn = $("button[type=submit]", root); btn.disabled = true;
    try { await api("offer", offerPayload({ ...o, includes: o.includes.filter((x) => x.trim()) })); S.editing = null; toast(o.id ? "Offer saved" : "Offer created"); await load(); scrollTo(0, 0); }
    catch (err) { const m = $("#oErr", root); m.textContent = err.message; m.hidden = false; btn.disabled = false; }
  });
  return root;
}

$("#logout").addEventListener("click", async () => { await api("logout", {}).catch(() => {}); S.data = null; S.mode = "login"; render(); });
const q = new URLSearchParams(location.search);
if (q.get("payouts") === "done") toast("Checking your payout setup…");
if (q.get("boost") === "done") toast("Thanks! Your boost is on.");
if (q.size) history.replaceState(null, "", "/venue.html");
load();
</script>
</body>
