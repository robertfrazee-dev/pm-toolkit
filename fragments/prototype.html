<style>
  /* Layout: one calm phone-width column; bottom tab bar with a raised Capture button. Single dark look by design. */
  :root {
    --bg: #0e0f12;
    --surface: #17191e;
    --surface-2: #21242b;
    --line: rgba(230, 236, 255, 0.09);
    --fg: #eef0f4;
    --muted: #8d94a3;
    --faint: #59606d;
    --accent: #f2b84b;
    --accent-ink: #1d1503;
    --ok: #3fbf8a;
    --warn: #e5654f;
    --font: "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; }

  .wrap { max-width: 38rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 130px; display: flex; flex-direction: column; gap: 18px; }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--faint); flex-wrap: wrap; }
  .brand { font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
  .view { display: flex; flex-direction: column; gap: 22px; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .section { display: flex; flex-direction: column; gap: 10px; }

  .greet { display: flex; flex-direction: column; gap: 4px; }

  .note { border: 1px dashed rgba(242,184,75,.45); color: var(--muted); border-radius: 14px; padding: 10px 14px; font-size: 14px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .note strong { color: var(--accent); }

  /* Ask */
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); padding: 12px 14px; font-size: 1rem; }
  .answer { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
  .answer p { margin: 0; white-space: pre-wrap; }
  .answer .q { color: var(--muted); font-size: 14px; }

  /* Next-up card */
  .next { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .next .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .next .big { font-size: 1.9rem; font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
  .next .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .step { font-size: 15px; color: var(--fg); background: var(--surface-2); border-radius: 12px; padding: 8px 12px; }
  .step span { color: var(--accent); font-weight: 700; }
  .steps { gap: 4px; }
  .stepline { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--muted); }
  .stepline.now { color: var(--fg); font-weight: 700; }
  .stepline.done span { text-decoration: line-through; color: var(--faint); }
  .stepline small { color: var(--faint); font-weight: 400; }
  .check.small { width: 22px; height: 22px; }
  .check.small svg { width: 12px; height: 12px; }
  .fixes { display: flex; flex-wrap: wrap; gap: 6px; }
  .fix { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; background: var(--surface-2); text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .btn:disabled { opacity: .35; cursor: default; filter: none; }

  .alarm { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .alarm strong { font-size: 1.15rem; }
  .alarm .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .alarm .btn { background: rgba(0,0,0,.15); color: var(--accent-ink); }

  /* Item rows */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; }
  .check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; display: grid; place-items: center; margin-top: 1px; padding: 0; }
  .check:hover { border-color: var(--muted); }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .check svg { width: 16px; height: 16px; }
  .glyph { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--bg); margin-top: 1px; }
  .item-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }

  /* Life */

  .heat b { font-size: 11px; color: var(--faint); text-align: center; font-weight: 400; }
  .legend { font-size: 12px; color: var(--faint); }
  .horizon { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

  .horizon li:last-child { border-bottom: 0; }
  .horizon .when { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }

  .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

  .doc pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font); font-size: 15px; line-height: 1.5; max-height: 420px; overflow: auto; }

  /* Capture */
  .capture { display: flex; flex-direction: column; gap: 14px; }
  textarea, input[type=text], select { width: 100%; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; font-size: 1.1rem; }
  textarea { resize: none; }
  textarea::placeholder, input::placeholder { color: var(--faint); }
  .save { border: 0; border-radius: 16px; padding: 16px; background: var(--accent); color: var(--accent-ink); font-size: 1.15rem; font-weight: 700; }
  .save:disabled { opacity: .3; cursor: default; }
  .hint { color: var(--faint); font-size: 14px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 14px; color: var(--muted); text-align: left; text-decoration: none; }
  .chip:hover { color: var(--fg); border-color: rgba(230,236,255,.2); }

  .frag .said { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
  .frag .said::before { content: "\201C"; color: var(--faint); }
  .frag .said::after { content: "\201D"; color: var(--faint); }
  .frag .did { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
  .frag .reply { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 15px; }
  .frag .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .status { font-size: 13px; color: var(--muted); }
  .status.working { color: var(--accent); }
  .status.error { color: var(--warn); }
  .status.undone { color: var(--faint); }
  .src { font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; }

  .empty { background: var(--surface); border: 1px dashed rgba(230,236,255,.18); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .empty p { margin: 0; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details[open] summary { margin-bottom: 8px; }
  .wrapup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }

  /* Bottom nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(14,15,18,.96); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  nav .tabs { max-width: 38rem; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
  nav a { text-align: center; padding: 14px 0 12px; color: var(--faint); text-decoration: none; font-size: 13px; font-weight: 700; position: relative; }
  nav a[aria-current="page"] { color: var(--fg); }
  nav a.cap span { display: grid; place-items: center; width: 54px; height: 54px; margin: -22px auto 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(242,184,75,.25); }
  nav a.cap svg { width: 26px; height: 26px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; }

  .toast-zone { position: fixed; left: 0; right: 0; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; padding: 0 16px; z-index: 30; }
  .toast { border-radius: 999px; padding: 12px 20px; font-weight: 700; color: #fff; background: #23705a; box-shadow: 0 8px 24px rgba(0,0,0,.45); text-align: center; max-width: 100%; }
  .toast.info { background: var(--surface-2); }
  .toast.error { background: #8d3a2e; }

  /* Item sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); border-radius: 22px 22px 0 0; width: 100%; max-width: 38rem; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow: auto; }
  .sheet .field { display: flex; flex-direction: column; gap: 6px; }
  .sheet .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sheet .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
  .sheet select, .sheet input[type=text] { font-size: 1rem; padding: 12px; border-radius: 12px; background: var(--surface-2); }
  @media (max-width: 380px) { .sheet .two { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
</style>

<script>
/* ---------- helpers ---------- */
const h = (tag, props, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
};
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clone = (x) => JSON.parse(JSON.stringify(x));
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const DEFAULT_AREAS = [
  { id: "health", name: "Health", description: "Body, mind, appointments, fitness", color: "#4fc98d" },
  { id: "work", name: "Work", description: "Job and career", color: "#6aa5ff" },
  { id: "side", name: "Side Projects", description: "Things I'm building for fun or profit", color: "#b58cff" },
  { id: "home", name: "Home", description: "House, errands, pets, chores", color: "#f2b84b" },
  { id: "money", name: "Money", description: "Bills, rent, budget", color: "#3cc7c0" },
  { id: "people", name: "People", description: "Family, friends, relationships", color: "#f27cb0" },
];
const EXAMPLES = [
  "gotta go to the gym",
  "I need to schedule that doctor appointment before the 15th",
  "idea for the fitness app — show weekly streaks",
  "call mom sunday",
  "did I pay rent?",
  "lacrosse playbook should let coaches drag players on the field",
  "buy dog food",
  "also get treats",
  "remind me tonight at 8 to pack my gym bag",
];
const TYPE_LABEL = { task: "Task", idea: "Idea", reminder: "Reminder", habit: "Habit", event: "Event", note: "Note" };
const CHECKABLE = new Set(["task", "reminder", "habit", "event"]);

function emptyState() {
  return { v: 2, rev: 0, areas: clone(DEFAULT_AREAS), projects: [], items: [], links: [], fragments: [], corrections: [] };
}

/* ---------- dates ---------- */
const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const fmtTime = (d) => new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(d).replace(":00", "");
const fmtDay = (d) => new Intl.DateTimeFormat("en-US", { weekday: "long", month: "short", day: "numeric" }).format(d);
const fmtMD = (d) => new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(d);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function offsetString(d) {
  const m = -d.getTimezoneOffset();
  const s = m >= 0 ? "+" : "-";
  const a = Math.abs(m);
  return s + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}
function localIso(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00${offsetString(d)}`;
}
function parseDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function fmtWhen(d) {
  const now = new Date();
  const k = dayKey(d);
  const t = fmtTime(d);
  if (k === dayKey(now)) return "Today " + t;
  if (k === dayKey(addDays(now, 1))) return "Tomorrow " + t;
  if (k === dayKey(addDays(now, -1))) return "Yesterday " + t;
  const diff = (d - now) / 864e5;
  if (diff > 0 && diff < 6) return new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(d) + " " + t;
  return fmtMD(d) + (d.getHours() === 0 && d.getMinutes() === 0 ? "" : " " + t);
}
function daysUntil(d) {
  const a = new Date(); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 864e5);
}
const DAYS = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
const DAY_NAMES = { SU: "Sun", MO: "Mon", TU: "Tue", WE: "Wed", TH: "Thu", FR: "Fri", SA: "Sat" };
function rruleParts(r) {
  const out = {};
  for (const part of String(r || "").replace(/^RRULE:/i, "").split(";")) {
    const [k, v] = part.split("=");
    if (k && v) out[k.toUpperCase()] = v.toUpperCase();
  }
  return out;
}
function recurrenceLabel(r) {
  const p = rruleParts(r);
  if (!p.FREQ) return "";
  if (p.FREQ === "DAILY") return "Every day";
  if (p.FREQ === "WEEKLY") return p.BYDAY ? p.BYDAY.split(",").map((d) => DAY_NAMES[d] || d).join(", ") : "Weekly";
  if (p.FREQ === "MONTHLY") return "Monthly";
  return p.FREQ.toLowerCase();
}
function habitDueOn(item, date) {
  const p = rruleParts(item.recurrence);
  if (p.FREQ === "WEEKLY" && p.BYDAY) return p.BYDAY.split(",").includes(DAYS[date.getDay()]);

const LOCAL_KEY = "fragments-prototype-v2";
const MODE_KEY = "fragments-mode";
let docRef = null;

function loadLocal() {

async function persist() {
  state.rev = (state.rev || 0) + 1;

  mine = state;
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(mine)); } catch (e) {}
  if (!docRef) return;
  dirty = true;
  if (writing) return;
  writing = true;
  while (dirty) {
    dirty = false;
    try { await docRef.set(clone(mine)); } catch (e) { toast("Couldn't sync. Saved in this browser.", "error"); }
  }
  writing = false;
}

/* ---------- organizer ---------- */
const STOP = new Set("the a an and or to of for in on at my me i is it that this be with get got gotta need want should also just some about from have has do did was are will can".split(" "));
const words = (s) => norm(s).replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w));

function contextItems(text) {
  const fw = new Set(words(text));
  const open = state.items.filter((i) => i.status === "open");
  const scored = open.map((it, idx) => {
    const iw = words(it.title + " " + (it.body || "") + " " + placeLabel(it));
    let overlap = 0;
    for (const w of iw) if (fw.has(w) || [...fw].some((f) => f.length > 3 && (w.startsWith(f) || f.startsWith(w)))) overlap++;
    return { it, score: overlap * 10 + idx / open.length };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 30).map((s) => s.it);
}
function itemLine(i) {
  const bits = [i.id, i.type, placeLabel(i), JSON.stringify(i.title)];
  if (i.body) bits.push("details: " + JSON.stringify(i.body.slice(0, 160)));
  if (i.dueAt) bits.push("due " + i.dueAt);
  if (i.remindAt) bits.push("remind " + i.remindAt);
  if (i.recurrence) bits.push("repeats " + i.recurrence);
  if (i.inInbox) bits.push("(in inbox)");
  return "- " + bits.join(" | ");
}

function organizerPrompt(text) {
  const now = new Date();
  const areas = state.areas.map((a) => `- ${a.name}: ${a.description}`).join("\n");
  const projects = state.projects.filter((p) => p.status !== "done").map((p) => `- ${p.id} | ${areaById(p.areaId)?.name} | ${p.name} | ${p.summary || ""}`).join("\n") || "(none yet)";
  const open = contextItems(text).map(itemLine).join("\n") || "(none yet)";
  const done = state.items.filter((i) => i.status === "done").sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || "")).slice(0, 10)
    .map((i) => `- ${i.title} | ${placeLabel(i)} | done ${i.doneAt || "?"}`).join("\n") || "(none)";
  const corrections = state.corrections.slice(-8).map((c) => `- "${c.title}": you filed it under ${c.from}; the user moved it to ${c.to}`).join("\n") || "(none yet)";
  return `You are the organizer inside Fragments, an "external brain" app for a person with ADHD. They capture scattered thoughts by voice or text. Read ONE new fragment and decide how to file it, using what the app already knows.

CURRENT TIME: ${fmtDay(now)}, ${fmtTime(now)} — ISO ${localIso(now)} (time zone ${TZ}). Write every timestamp as full ISO 8601 with this offset (${offsetString(now)}).

AREAS (file every item under exactly one, by exact name):
${areas}

PROJECTS (id | area | name | summary):
${projects}

OPEN ITEMS most related to this fragment (id | type | area → project | title | ...):
${open}

RECENTLY COMPLETED:
${done}

RECENT CORRECTIONS (the user moved items you filed — learn from these):
${corrections}

RULES
- Prefer existing Areas and Projects. Only create a project for an ongoing effort with more to come (a named app, a playbook, a trip, a renovation, an event to plan). Single errands and one-off appointments go directly in an Area with no project.
- A habit ("go to the gym", "drink more water") is type "habit" with an RRULE recurrence (e.g. "FREQ=WEEKLY;BYDAY=MO,WE,FR" or "FREQ=DAILY"), not a one-off task. If no frequency is given, pick a sensible default and say so in "explain".
- "remind me ... at <time>" → type "reminder" with remindAt. Something that happens at a set time → "event" with dueAt. Something to do → "task". Product or project thoughts and "idea: ..." → "idea". Facts worth keeping → "note".
- Resolve vague references ("that doctor appointment", "also get treats") against OPEN ITEMS. If the fragment adds to or completes an existing open item, use update_item on it instead of creating a duplicate (e.g. "Buy dog food" becomes "Buy dog food and treats"; "paid rent" sets status "done"). If it's related but separate, create it and link_items.
- Parse relative dates in the user's time zone. "tonight" with no time = 20:00 today. "Sunday" = the coming Sunday. "before the 15th" = dueAt the 14th at 17:00. A day with no time for a call or errand: dueAt that day at 17:00.
- One fragment can hold several thoughts ("ok so X, and also Y, oh and Z"). Split it into separate operations, one per thought.
- Never invent details the user didn't say (no made-up people, places or times). Only set remindAt if they asked to be reminded or gave a time to act.
- Titles: short, plain, action-first ("Book doctor appointment", "Call Mom"). Use body only for extra detail the user actually gave.
- If the moment to act is a place or event rather than a clock time ("when I get home", "next time I'm at the store", "after my meeting"), set cue to that phrase in plain words ("When you get home") instead of inventing a time.
- For a big or vague task ("clean the garage", "do taxes", "plan the trip"), set firstStep to one concrete action that takes under 5 minutes. Leave it null for small, clear tasks.
- If the fragment is a question ("did I pay rent?"), answer it in "reply" using only the data above, and say plainly when there's no record. Create a task only if it helps (e.g. "Check whether rent is paid").
- When an idea lands in a project, also update_project_summary for that project (1–2 sentences covering what the project is and its current ideas).
- confidence (0–1) = how sure you are about BOTH the type and the placement. Anything under 0.6 goes to the user's Inbox to confirm. If you can't make sense of the fragment, use send_to_inbox.

Reply with only one JSON object, no prose:
{"explain": "<one short sentence telling the user what you did>", "reply": null or "<short answer if they asked a question>", "operations": [ ... ]}

Operation shapes (omit fields you don't need):
{"op":"create_project","area":"<area name>","name":"<project name>","summary":"<1–2 sentences>","confidence":0.9}
{"op":"create_item","ref":"n1","type":"task|idea|reminder|habit|event|note","title":"...","body":"...","area":"<area name>","project":"<existing or newly created project name, or null>","dueAt":"<ISO or null>","remindAt":"<ISO or null>","recurrence":"<RRULE or null>","priority":"low|normal|high","firstStep":"<or null>","cue":"<place or event cue, or null>","confidence":0.9}
{"op":"update_item","id":"<existing item id>","changes":{"title":"...","body":"...","status":"open|done","dueAt":"...","remindAt":"...","recurrence":"...","priority":"...","type":"...","area":"<area name>","project":"<project name>","firstStep":"..."},"confidence":0.9}
{"op":"link_items","from":"<item id or ref>","to":"<item id or ref>","reason":"...","confidence":0.9}
{"op":"update_project_summary","project":"<project id>","summary":"...","confidence":0.9}
{"op":"send_to_inbox","title":"<short title>","reason":"<why you're unsure>","confidence":0.3}

FRAGMENT: ${JSON.stringify(text)}`;
}

function applyOperations(frag, out) {
  const undo = { createdItems: [], createdProjects: [], createdLinks: [], before: [], projectBefore: [] };
  const did = [];
  const refs = {};
  let filed = null;
  const ops = Array.isArray(out && out.operations) ? out.operations : [];
  const nowIso = new Date().toISOString();

  const ensureProject = (areaId, name, summary) => {
    if (!name) return null;
    let p = findProject(areaId, name);
    if (!p && areaId) {
      p = { id: uid("p"), areaId, name: String(name).slice(0, 80), summary: summary || "", status: "active", createdAt: nowIso, docs: [] };
      state.projects.push(p);
      undo.createdProjects.push(p.id);
      did.push(`Started project “${p.name}” in ${areaById(areaId).name}`);
    }
    return p;
  };

  for (const op of ops) if (op && op.op === "create_project") {
    const a = findArea(op.area);
    if (a) ensureProject(a.id, op.name, op.summary);
  }
  for (const op of ops) {
    if (!op || typeof op !== "object") continue;
    const conf = typeof op.confidence === "number" ? op.confidence : 0.8;
    if (op.op === "create_item" || op.op === "send_to_inbox") {
      const isInbox = op.op === "send_to_inbox";
      const a = isInbox ? null : findArea(op.area);
      const p = a && op.project && norm(op.project) !== "null" ? ensureProject(a.id, op.project) : null;
      const type = TYPE_LABEL[op.type] ? op.type : "note";
      const item = {
        id: uid("i"), type: isInbox ? "note" : type,
        title: String(op.title || frag.text).slice(0, 140),
        body: String((isInbox ? op.reason : op.body) || "").slice(0, 2000),
        areaId: a ? a.id : null, projectId: p ? p.id : null,
        status: "open", dueAt: parseDate(op.dueAt) ? op.dueAt : null, remindAt: parseDate(op.remindAt) ? op.remindAt : null,
        recurrence: op.recurrence || null, priority: ["low", "normal", "high"].includes(op.priority) ? op.priority : "normal",
        firstStep: typeof op.firstStep === "string" && op.firstStep.trim() ? op.firstStep.slice(0, 140) : null,
        cue: typeof op.cue === "string" && op.cue.trim() ? op.cue.slice(0, 80) : null,
        confidence: conf, inInbox: isInbox || !a || conf < 0.6, fragmentId: frag.id, createdAt: nowIso, history: type === "habit" ? [] : undefined,
      };
      state.items.push(item);
      undo.createdItems.push(item.id);
      (frag.itemIds ||= []).push(item.id);
      if (op.ref) refs[op.ref] = item.id;
      if (item.inInbox) { did.push(`Sent “${item.title}” to your Inbox to confirm`); filed = filed || "Sent to Inbox to confirm"; }
      else { did.push(`Added ${TYPE_LABEL[item.type].toLowerCase()} “${item.title}” to ${placeLabel(item)}`); filed = filed || "Filed under " + placeLabel(item); }
    } else if (op.op === "update_item") {
      const it = itemById(op.id);
      if (!it || !op.changes || typeof op.changes !== "object") continue;
      undo.before.push(clone(it));
      const c = op.changes;
      for (const k of ["title", "body", "recurrence", "firstStep"]) if (typeof c[k] === "string") it[k] = c[k].slice(0, k === "body" ? 2000 : 140);
      for (const k of ["dueAt", "remindAt"]) if (k in c) it[k] = parseDate(c[k]) ? c[k] : null;
      if (["low", "normal", "high"].includes(c.priority)) it.priority = c.priority;
      if (TYPE_LABEL[c.type]) it.type = c.type;
      if (c.status === "done" && it.status !== "done") { it.status = "done"; it.doneAt = nowIso; }
      if (c.status === "open") it.status = "open";

    } else if (op.op === "link_items") {

  frag.reply = typeof out.reply === "string" && out.reply.trim() ? out.reply : null;

}

function undoFragment(frag) {
  const u = frag.undo;
  if (!u) return;
  state.items = state.items.filter((i) => !u.createdItems.includes(i.id));
  state.links = state.links.filter((l) => !u.createdLinks.includes(l.id) && itemById(l.from) && itemById(l.to));
  for (const before of u.before) { const idx = state.items.findIndex((i) => i.id === before.id); if (idx >= 0) state.items[idx] = before; }
  for (const pb of u.projectBefore) { const p = projectById(pb.id); if (p) p.summary = pb.summary; }

}

let pumping = false;
async function pump() {
  if (pumping || !loaded) return;
  pumping = true;

    for (;;) {
      const s = state;
      const frag = s.fragments.find((f) => f.status === "queued");
      if (!frag) break;
      frag.status = "working";
      frag.startedAt = Date.now();
      render();
      const sample = await getSample();
      if (!sample) {
        frag.status = "error";
        frag.error = "Organizing needs Claude, which isn't available in this view. Your thought is saved.";
        frag.blocked = true;
        claudeState = "unavailable";
        await persist(); render();
        break;
      }
      try {
        const out = await sample.json(organizerPrompt(frag.text), { cache: false, modelTier: "quick" });
        if (state !== s) { frag.status = "queued"; break; }

        frag.status = "error";
        frag.error = claudeError(e);
        if (e && e.code === "not_granted") { frag.blocked = true; claudeState = "denied"; }
        toast("Saved, but not organized yet", "error");
        await persist(); render();
        if (e && (e.code === "not_granted" || e.code === "rate_limited")) break;
        continue;
      }

      render();
    }
  } finally { pumping = false; }
}

function capture(text) {

  if (!t) return;
  state.fragments.push({ id: uid("f"), text: t, source: "web", createdAt: new Date().toISOString(), status: "queued" });
  persist();
  render();
  pump();
}

/* ---------- Ask your brain ---------- */
let lastAnswer = null;
function brainContext() {
  const items = state.items.filter((i) => i.status !== "dismissed").map((i) => {
    const bits = [i.type, placeLabel(i), i.title, "status " + i.status];
    if (i.body) bits.push(i.body);
    if (i.dueAt) bits.push("due " + i.dueAt);
    if (i.remindAt) bits.push("remind " + i.remindAt);
    if (i.doneAt) bits.push("done " + i.doneAt.slice(0, 10));
    if (i.recurrence) bits.push("repeats " + recurrenceLabel(i.recurrence) + `, streak ${habitStreak(i)}, done ${(i.history || []).length} times`);

  }).join("\n");
  const projects = state.projects.map((p) => `- ${p.name} (${areaById(p.areaId)?.name}): ${p.summary}`).join("\n");
  const said = state.fragments.slice(-120).map((f) => `- ${f.createdAt.slice(0, 10)}: ${f.text}`).join("\n");
  return `PROJECTS:\n${projects || "(none)"}\n\nITEMS:\n${items || "(none)"}\n\nEVERYTHING THEY SAID (oldest first):\n${said || "(nothing yet)"}`;
}

NOW: ${fmtDay(now)} ${fmtTime(now)} (${TZ})

${brainContext()}

QUESTION: ${JSON.stringify(q)}`;

/* ---------- first steps ---------- */
const skipped = new Set();
const showAllSteps = new Set();
let breaking = null;
function stepsBlock(item) {

    const nextIdx = item.steps.findIndex((s) => !s.done);

      h("div", { class: "row", style: "margin-top:8px;display:flex;gap:8px;flex-wrap:wrap" },
        h("button", { class: "btn small primary", onclick: async () => { st.done = true; if (item.steps.every((x) => x.done)) { await toggleDone(item); return; } await persist(); render(); toast(doneN + 1 >= 2 ? "Nice. Next step's ready." : "Started. That's the hard part."); } }, "Did it"),

}
async function breakDown(item) {

  const sample = await getSample();
  if (!sample) { toast("Breaking things down needs Claude, which isn't available in this view", "error"); return; }
  breaking = item.id; render();
  const prompt = `Break this task into 3–6 tiny, concrete steps for a person with ADHD who is stuck starting. The first step must take about 2 minutes and need no decisions. Use only what's known; don't invent facts. Reply with only JSON: {"steps":[{"text":"<short imperative step>","mins":<estimated minutes>}]}

TASK: ${JSON.stringify(item.title)}
DETAILS: ${JSON.stringify(item.body || "")}
WHERE IT LIVES: ${placeLabel(item)}`;
  try {
    const out = await sample.json(prompt, { modelTier: "quick" });
    const steps = Array.isArray(out && out.steps) ? out.steps.filter((x) => x && x.text).slice(0, 6).map((x) => ({ text: String(x.text).slice(0, 120), mins: Number(x.mins) || null, done: false })) : [];

/* ---------- actions ---------- */

    h("div", { class: "summary" }, h("span", { class: "label" }, "Where it stands · kept up to date by Claude"), h("p", null, p.summary || "No summary yet."),
      todo.length ? h("div", { class: "bar", title: `${todo.filter((i) => i.status === "done").length} of ${todo.length} done` }, h("i", { style: `width:${Math.round((todo.filter((i) => i.status === "done").length / todo.length) * 100)}%;background:${a.color}` })) : null,
      todo.length ? h("span", { class: "legend" }, `${todo.filter((i) => i.status === "done").length} of ${todo.length} to-dos done`) : null),
    h("section", { class: "section" }, h("h2", null, "Work on this with Claude"),
      h("div", { class: "chips" },
        h("button", { class: "btn primary", onclick: () => runAction(p, "plan") }, "Make a plan"),
        h("button", { class: "btn", onclick: () => runAction(p, "brief") }, "Claude Code brief")),
      h("div", { id: "action-out", class: "section" }),
      p.docs.slice().reverse().map((d) => docCard(p, d))),
    groupByType(open),
    linked.length ? h("section", { class: "section" }, h("h2", null, "Connected elsewhere"), list(linked)) : null,
    done.length ? h("details", null, h("summary", null, `Done (${done.length})`), list(done, { showPlace: false })) : null,
    history.length ? h("details", null, h("summary", null, `How this project grew (${history.length} thoughts)`), history.map(fragCard)) : null,
  ];
}

function docCard(p, d) {
  return h("div", { class: "doc" },
    h("div", { class: "row" }, h("span", { class: "label" }, (d.kind === "plan" ? "Plan" : "Claude Code brief") + " · " + fmtWhen(new Date(d.createdAt))),
      h("span", null,
        h("button", { class: "btn small", onclick: (e) => copyText(d.text, e.currentTarget) }, "Copy"), " ",
        h("button", { class: "btn small ghost", onclick: async () => { p.docs = p.docs.filter((x) => x !== d); await persist(); render(); } }, "Delete"))),
    h("pre", null, d.text));
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) { const pre = btn.closest(".doc").querySelector("pre"); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected. Press copy."; }
}

let actionBusy = false;
async function runAction(p, kind) {
  if (actionBusy) return;
  const sample = await getSample();
  if (!sample) { toast("Claude isn't available in this view", "error"); return; }
  actionBusy = true;
  const items = state.items.filter((i) => i.projectId === p.id);
  const fmtItems = (f) => items.filter(f).map((i) => `- [${i.status === "done" ? "x" : " "}] ${i.type}: ${i.title}${i.body ? " — " + i.body : ""}`).join("\n") || "(none)";
  const history = state.fragments.filter((f) => items.some((i) => i.fragmentId === f.id)).map((f) => `- ${f.createdAt.slice(0, 10)}: "${f.text}"`).join("\n") || "(none)";
  const ctx = `PROJECT: ${p.name} (area: ${areaById(p.areaId).name})\nSUMMARY: ${p.summary || "(none)"}\n\nIDEAS:\n${fmtItems((i) => i.type === "idea")}\n\nTASKS AND OTHER ITEMS:\n${fmtItems((i) => i.type !== "idea")}\n\nWHAT THE USER SAID, IN ORDER:\n${history}`;
  const prompt = kind === "plan"
    ? `You help a person with ADHD turn scattered ideas into action. Write a short, practical plan for this project using ONLY what's below; don't invent features, deadlines or facts. Plain text, no Markdown symbols: a one-line goal, then "Phases" (2–4 small phases with 2–4 concrete steps each, smallest first), then "The very next step" (one action doable in under 30 minutes), then "Open questions". Under 250 words.\n\n${ctx}`
    : `Write a Markdown brief the user will paste into a fresh Claude Code session to start building this project. Use ONLY what's below; mark anything unknown as an open question instead of guessing. Sections: "# ${p.name}", "## Goal", "## Background (what I've said so far)", "## Decisions so far", "## Features / ideas to build", "## Open tasks", "## Open questions", "## Suggested first step for Claude Code". Be concise.\n\n${ctx}`;
  const outBox = document.getElementById("action-out");
  const pre = h("pre", { class: "spin" }, "Thinking…");
  if (outBox) outBox.replaceChildren(h("div", { class: "doc" }, h("span", { class: "label" }, kind === "plan" ? "Writing a plan…" : "Writing a Claude Code brief…"), pre));
  try {
    const { text } = await sample(prompt, { onText: ({ text }) => { pre.classList.remove("spin"); pre.textContent = text; } });
    p.docs = p.docs || [];
    p.docs.push({ kind, text, createdAt: new Date().toISOString() });
    claudeState = "granted";
    await persist();
    toast(kind === "plan" ? "Plan saved to the project" : "Brief saved to the project");
  } catch (e) { toast(claudeError(e), "error"); if (e && e.code === "not_granted") claudeState = "denied"; }
  actionBusy = false;
  render();
}

function placeSelectors(item) {
  const areaSel = h("select", { id: "sheet-area-" + item.id, "aria-label": "Area" }, state.areas.map((a) => h("option", { value: a.id }, a.name)));
  areaSel.value = item.areaId || state.areas[0].id;
  const projSel = h("select", { id: "sheet-project-" + item.id, "aria-label": "Project" });
  const fill = () => {
    projSel.replaceChildren(h("option", { value: "" }, "No project"), state.projects.filter((p) => p.areaId === areaSel.value).map((p) => h("option", { value: p.id }, p.name)));
    projSel.value = item.areaId === areaSel.value && item.projectId ? item.projectId : "";
  };
  areaSel.addEventListener("change", fill);
  fill();
  return { areaSel, projSel };
}

function viewInbox() {
  const items = inboxItems();
  return [
    h("h1", null, "Inbox"),
    h("p", { class: "sub" }, "Things Claude wasn't sure about. Pick where they go, one tap each. Claude learns from every choice."),
    items.length ? items.map((item) => {
      const { areaSel, projSel } = placeSelectors(item);
      const frag = state.fragments.find((f) => f.id === item.fragmentId);
      return h("div", { class: "frag" },
        frag ? h("p", { class: "said" }, frag.text) : h("strong", null, item.title),
        item.body ? h("p", { class: "sub", style: "font-size:14px" }, item.body) : null,
        h("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:8px" }, areaSel, projSel),
        h("div", { class: "row" },
          h("button", { class: "btn primary small", onclick: async () => { moveItem(item, areaSel.value, projSel.value); await persist(); render(); toast("Filed under " + placeLabel(item)); } }, "File it"),
          h("button", { class: "btn ghost small", onclick: async () => { item.status = "dismissed"; await persist(); render(); } }, "Dismiss")));
    }) : h("div", { class: "empty" }, h("strong", null, "All clear."), h("p", null, "Nothing waiting for you here.")),
  ];
}

const SRC = { watch: "⌚ Watch", phone: "Phone", web: null };
function fragCard(f) {
  const statusText = { queued: "Waiting…", working: "Organizing…", organized: "Organized", error: "Not organized", undone: "Undone" }[f.status] || f.status;
  return h("div", { class: "frag" },
    h("p", { class: "said" }, f.text),
    f.reply ? h("p", { class: "reply" }, f.reply) : null,
    f.status === "organized" && f.did && f.did.length ? h("ul", { class: "did" }, f.did.map((d) => h("li", null, d))) : null,
    f.status === "organized" && f.itemIds && f.itemIds.some(itemById) ? h("div", { class: "fixes" }, f.itemIds.map(itemById).filter(Boolean).map((it) =>
      h("button", { class: "fix", title: "Wrong place? Tap to move it", onclick: () => openSheet(it) }, (it.inInbox ? "Inbox" : placeLabel(it)) + " · Change"))) : null,
    f.status === "organized" && f.explain && (!f.did || !f.did.length) ? h("p", { class: "sub", style: "font-size:14px" }, f.explain) : null,
    f.error && f.status === "error" ? h("p", { class: "sub", style: "font-size:14px" }, f.error) : null,
    h("div", { class: "row" },
      h("span", { class: "status " + (f.status === "working" || f.status === "queued" ? "working spin" : f.status === "error" ? "error" : f.status === "undone" ? "undone" : "") },
        fmtTime(new Date(f.createdAt)) + " · " + statusText, f.status === "working" ? h("span", { class: "elapsed", "data-start": String(f.startedAt || Date.now()) }) : null,
        SRC[f.source] ? h("span", { class: "src" }, SRC[f.source]) : null),
      f.status === "organized" && f.undo ? h("button", { class: "btn small ghost", onclick: async () => { undoFragment(f); await persist(); render(); toast("Undone", "info"); } }, "Undo") : null,
      f.status === "error" || f.status === "undone" ? h("button", { class: "btn small", onclick: () => { f.status = "queued"; f.error = null; persist(); render(); pump(); } }, "Organize") : null));
}

function viewCapture() {
  const ta = h("textarea", { id: "capture-text", rows: "4", placeholder: "Say or type anything…", "aria-label": "Your thought" });
  const save = h("button", { type: "submit", class: "save", disabled: true }, "Save");
  ta.addEventListener("input", () => (save.disabled = !ta.value.trim()));
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); } });
  const submit = () => { if (!ta.value.trim()) return; capture(ta.value); ta.value = ""; save.disabled = true; toast("Saved. Organizing…", "info"); };
  const form = h("form", { class: "capture", onsubmit: (e) => { e.preventDefault(); submit(); } }, ta, save);
  const recent = state.fragments.slice(-4).reverse();
  const tries = mode === "demo"
    ? ["ok so the hotel is booked, the one by the river, and I still need to call the dentist, and when I get home check if sara replied about mom's party", "idea for the playbook: let players vote on plays", "did I ever book the dentist?", "remind me tomorrow at 7 to take vitamins"]
    : EXAMPLES;
  return [
    h("h1", null, "What's on your mind?"),
    h("p", { class: "hint" }, "On a phone, tap the mic on your keyboard to talk. Don't sort it. Just say it."),
    form,
    h("section", { class: "section" }, h("h2", null, mode === "demo" ? "Try one on the demo month" : "Try one"),
      h("div", { class: "chips" }, tries.map((ex) => h("button", { class: "chip", onclick: () => { capture(ex); toast("Saved. Organizing…", "info"); } }, ex)))),
    recent.length ? h("section", { class: "section" }, h("h2", null, "Just captured"), recent.map(fragCard)) : null,
  ];
}

function viewTimeline() {
  const frags = state.fragments.slice().reverse();
  const days = [];
  for (const f of frags) {
    const label = fmtDay(new Date(f.createdAt));
    const last = days[days.length - 1];
    if (last && last.label === label) last.items.push(f); else days.push({ label, items: [f] });
  }
  return [
    h("h1", null, "Timeline"),
    h("p", { class: "sub" }, `Everything you've said (${state.fragments.length} thoughts), and what Claude did with each one.`),
    state.fragments.some((f) => f.status === "error") ? h("button", { class: "btn small", style: "align-self:flex-start", onclick: () => { for (const f of state.fragments) if (f.status === "error") { f.status = "queued"; f.error = null; f.blocked = false; } persist(); render(); pump(); } }, "Organize everything that didn't go through") : null,
    days.length ? days.map((d) => h("section", { class: "section" }, h("h2", null, d.label), d.items.map(fragCard))) : h("div", { class: "empty" }, h("p", null, "Nothing captured yet.")),
    mode === "mine" && state.fragments.length ? h("details", null, h("summary", null, "Start over"),
      h("p", { class: "sub", style: "font-size:14px" }, "Deletes every thought, item and project in your brain."),
      h("button", { class: "btn small", style: "margin-top:8px", onclick: async () => { state = Object.assign(emptyState(), { rev: state.rev }); await persist(); location.hash = "#today"; render(); } }, "Delete everything")) : null,
  ];
}

function loadExamples() {
  for (const ex of EXAMPLES) state.fragments.push({ id: uid("f"), text: ex, source: "web", createdAt: new Date().toISOString(), status: "queued" });
  persist();
  location.hash = "#timeline";
  render();
  pump();
}

/* ---------- item sheet ---------- */
function openSheet(item) {
  const root = document.getElementById("sheet-root");
  const close = () => root.replaceChildren();
  const title = h("input", { type: "text", id: "sheet-title", value: item.title, "aria-label": "Title" });
  const typeSel = h("select", { id: "sheet-type", "aria-label": "Type" }, Object.entries(TYPE_LABEL).map(([k, v]) => h("option", { value: k }, v)));
  typeSel.value = item.type;
  const { areaSel, projSel } = placeSelectors(item);
  const frag = state.fragments.find((f) => f.id === item.fragmentId);
  const links = state.links.filter((l) => l.from === item.id || l.to === item.id).map((l) => ({ other: itemById(l.from === item.id ? l.to : l.from), reason: l.reason })).filter((x) => x.other);
  const sheet = h("div", { class: "sheet", role: "dialog", "aria-label": "Edit item" },
    h("div", { class: "field" }, h("span", { class: "label" }, "Title"), title),
    item.body ? h("p", { class: "sub" }, item.body) : null,
    itemMeta(item, { showPlace: false }),
    stepsBlock(item),
    item.remindAt && item.status === "open" ? h("p", { class: "hint" }, `One nudge at ${fmtWhen(parseDate(item.remindAt))}. If you're busy, it waits at the top of Today. No repeat pings.`) : null,
    item.type === "habit" ? h("p", { class: "hint" }, "Missed a day? One rest day a week never breaks your streak.") : null,
    item.type === "habit" ? h("div", { class: "field" }, h("span", { class: "label" }, `Last 14 days · kept ${habitKept(item).kept} of ${habitKept(item).due} · ${habitStreak(item)}-day streak`), habitDays(item)) : null,
    h("div", { class: "two" }, h("div", { class: "field" }, h("span", { class: "label" }, "Type"), typeSel), h("div", { class: "field" }, h("span", { class: "label" }, "Area"), areaSel)),
    h("div", { class: "field" }, h("span", { class: "label" }, "Project"), projSel),
    links.length ? h("div", { class: "field" }, h("span", { class: "label" }, "Connected to"), links.map((x) => h("span", { class: "sub", style: "font-size:14px" }, "↔ " + x.other.title + (x.reason ? " · " + x.reason : "")))) : null,
    frag ? h("p", { class: "hint" }, `You said “${frag.text}” · ${fmtWhen(new Date(frag.createdAt))}`) : null,
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: async () => {
        item.title = title.value.trim() || item.title;
        item.type = typeSel.value;
        if (areaSel.value !== item.areaId || (projSel.value || null) !== (item.projectId || null) || item.inInbox) moveItem(item, areaSel.value, projSel.value);
        await persist(); close(); render(); toast("Saved");
      } }, "Save"),
      h("button", { class: "btn", onclick: async () => { close(); await toggleDone(item); } }, item.status === "done" ? "Reopen" : item.type === "habit" ? (habitDoneToday(item) ? "Not done today" : "Done today") : "Mark done"),
      h("button", { class: "btn ghost", onclick: async () => { item.status = "dismissed"; await persist(); close(); render(); toast("Removed", "info"); } }, "Remove"),
      h("button", { class: "btn ghost", onclick: close }, "Close")));
  const scrim = h("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) close(); } }, sheet);
  scrim.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  root.replaceChildren(scrim);
  title.focus();
}

/* ---------- router ---------- */
let lastHash = null;
function render() {
  const hash = location.hash.slice(1) || "today";
  const view = document.getElementById("view");
  let tab = hash;
  let content;
  if (mode === "mine" && !mineLoaded) content = [h("p", { class: "sub spin" }, "Loading your brain…")];
  else if (hash.startsWith("area-")) { tab = "life"; content = viewArea(hash.slice(5)); }
  else if (hash.startsWith("project-")) { tab = "life"; content = viewProject(hash.slice(8)); }
  else if (hash === "capture") content = viewCapture();
  else if (hash === "life" || hash === "areas") { tab = "life"; content = viewLife(); }
  else if (hash === "inbox") content = viewInbox();
  else if (hash === "timeline") content = viewTimeline();
  else { tab = "today"; content = viewToday(); }
  const draft = document.getElementById("capture-text");
  const draftVal = draft && hash === "capture" ? draft.value : "";
  const askEl = document.getElementById("ask-input");
  const askVal = askEl && document.activeElement === askEl ? askEl.value : null;
  const focusCapture = hash === "capture" && lastHash !== "capture";
  lastHash = hash;
  view.replaceChildren(...[loaded ? modeNote() : null, loaded ? claudeBanner() : null, ...content].flat().filter(Boolean));
  if (draftVal) { const t = document.getElementById("capture-text"); t.value = draftVal; t.dispatchEvent(new Event("input")); }
  if (askVal != null) { const a = document.getElementById("ask-input"); if (a) { a.value = askVal; a.focus(); } }
  if (focusCapture) document.getElementById("capture-text")?.focus();
  for (const a of document.querySelectorAll("nav a")) {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  const n = inboxItems().length;
  document.getElementById("inbox-badge").replaceChildren(n ? h("span", { class: "badge" }, n) : "");
}
window.addEventListener("hashchange", () => { document.getElementById("sheet-root").replaceChildren(); render(); window.scrollTo(0, 0); });
setInterval(() => { for (const el of document.querySelectorAll(".elapsed")) el.textContent = " " + Math.round((Date.now() - Number(el.dataset.start)) / 1000) + "s"; }, 1000);
setInterval(() => { if ((location.hash || "#today") === "#today" && !document.getElementById("sheet-root").firstChild && document.activeElement?.id !== "ask-input") render(); }, 60e3);

demo = buildDemo();
state = demo;
render();
initStore();
</script>
