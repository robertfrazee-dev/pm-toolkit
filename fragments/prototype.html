<style>
  /* Layout: a calm one-column command center. Static "Tell me anything" bar + 3 tabs at the bottom. Single dark look by design. */
  :root {
    --bg: #0e0f12;
    --surface: #17191e;
    --surface-2: #21242b;
    --line: rgba(230, 236, 255, 0.09);
    --fg: #eef0f4;
    --muted: #8d94a3;
    --faint: #59606d;
    --accent: #f2b84b;
    --accent-ink: #1d1503;
    --ok: #3fbf8a;
    --warn: #e5654f;
    --font: "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; }

  .wrap { max-width: 36rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 190px; display: flex; flex-direction: column; gap: 18px; }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--faint); }
  .brand { font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .top-right { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border: 0; background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
  .gear { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; }
  .gear svg { width: 16px; height: 16px; }
  .view { display: flex; flex-direction: column; gap: 24px; }
  h1 { font-size: 1.7rem; line-height: 1.2; margin: 0; text-wrap: balance; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .section { display: flex; flex-direction: column; gap: 10px; }
  .sub { color: var(--muted); margin: 0; }
  .back { color: var(--muted); text-decoration: none; font-size: 15px; background: none; border: 0; padding: 0; text-align: left; }
  .greet { display: flex; flex-direction: column; gap: 6px; }
  .brief { font-size: 1.1rem; color: var(--fg); margin: 0; text-wrap: pretty; }
  .brief b { color: var(--accent); font-weight: 700; }
  .demo-pill { font-size: 12px; color: var(--accent); border: 1px dashed rgba(242,184,75,.5); border-radius: 999px; padding: 3px 10px; align-self: flex-start; }

  /* Exchange card: what you just said and what Fragments did */
  .exchange { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .exchange .you { color: var(--muted); font-size: 14px; margin: 0; }
  .exchange .me { margin: 0; white-space: pre-wrap; }
  .exchange ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
  .exchange .from { color: var(--faint); font-size: 13px; margin: 0; }
  .exchange .row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

  /* Now card */
  .now { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .now .big { font-size: 2rem; font-weight: 700; line-height: 1.12; margin: 0; text-wrap: balance; overflow-wrap: anywhere; background: none; border: 0; padding: 0; text-align: left; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .step { font-size: 15px; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .step .lbl { color: var(--accent); font-weight: 700; }
  .step small { color: var(--faint); }
  .btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; background: var(--surface-2); text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
  .draftchip { display: flex; gap: 10px; align-items: center; border: 1px solid rgba(242,184,75,.35); background: rgba(242,184,75,.07); color: var(--fg); border-radius: 14px; padding: 10px 12px; text-align: left; width: 100%; }
  .draftchip b { color: var(--accent); }
  .draftchip span { flex: 1; min-width: 0; }

  .alarm { background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .alarm strong { font-size: 1.15rem; }
  .alarm .btn { background: rgba(0,0,0,.15); color: var(--accent-ink); }

  /* "I took care of" */
  .did { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .did li { border-bottom: 1px solid var(--line); }
  .did li:last-child { border-bottom: 0; }
  .did button { width: 100%; display: flex; gap: 12px; align-items: flex-start; background: none; border: 0; padding: 11px 0; text-align: left; }
  .did .ico { flex: none; width: 28px; height: 28px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; font-size: 14px; }
  .did .txt { flex: 1; min-width: 0; }
  .did .txt small { display: block; color: var(--faint); font-size: 13px; }

  /* Compact rows */
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; min-width: 0; }
  .check { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; display: grid; place-items: center; padding: 0; }
  .check:hover { border-color: var(--muted); }
  .check.on { background: var(--ok); border-color: var(--ok); }
  .check svg { width: 15px; height: 15px; }
  .glyph { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--bg); }
  .item-main { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .item-title { font-size: 1.02rem; overflow-wrap: anywhere; }
  .item.done .item-title { color: var(--faint); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta .hot { color: var(--accent); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; flex: none; }
  .habits { display: flex; flex-wrap: wrap; gap: 8px; }
  .habit { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 6px; font-size: 14px; }
  .habit .check { width: 24px; height: 24px; }
  .habit small { color: var(--accent); font-weight: 700; }
  .soon { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .soon li button { width: 100%; display: grid; grid-template-columns: 76px 1fr; gap: 10px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 0; text-align: left; align-items: baseline; }
  .soon li:last-child button { border-bottom: 0; }
  .soon .when { color: var(--accent); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .soon small { display: block; color: var(--muted); font-size: 13px; }

  /* Life tree */
  .tree { display: flex; flex-direction: column; gap: 8px; }
  .area { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .area-head { width: 100%; display: flex; gap: 12px; align-items: center; background: none; border: 0; padding: 14px 16px; text-align: left; }
  .area-head .dot { width: 12px; height: 12px; }
  .area-head .name { font-weight: 700; font-size: 1.1rem; }
  .area-head .status { color: var(--muted); font-size: 14px; }
  .area-head .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .chev { color: var(--faint); transition: transform .15s; }
  .area.open .chev { transform: rotate(90deg); }
  .area-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .proj { width: 100%; background: var(--surface-2); border: 0; border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .proj .name { font-weight: 700; }
  .proj .nxt { color: var(--muted); font-size: 14px; }
  .proj .nxt b { color: var(--fg); font-weight: 400; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.06); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 3px; }
  .loose { display: flex; flex-direction: column; gap: 4px; padding: 4px 4px 0; }
  .loose .lrow { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
  .loose .lrow .item-main { font-size: 15px; }
  .muted-line { color: var(--faint); font-size: 13px; padding: 0 4px; background: none; border: 0; text-align: left; }

  .summary { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .summary p { margin: 0; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .doc { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .doc pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font); font-size: 15px; line-height: 1.5; max-height: 360px; overflow: auto; }
  .doc .row { justify-content: space-between; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  details[open] summary { margin-bottom: 8px; }

  /* Activity */
  .frag { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .frag .said { margin: 0; font-size: 1.02rem; overflow-wrap: anywhere; }
  .frag .said::before { content: "\201C"; color: var(--faint); }
  .frag .said::after { content: "\201D"; color: var(--faint); }
  .frag ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
  .frag .reply { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 15px; }
  .frag .row { justify-content: space-between; }
  .status { font-size: 13px; color: var(--muted); }
  .status.working { color: var(--accent); }
  .status.error { color: var(--warn); }
  .src { font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; }

  .empty { background: var(--surface); border: 1px dashed rgba(230,236,255,.18); border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .empty p { margin: 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 14px; color: var(--muted); text-align: left; }
  .chip:hover { color: var(--fg); }
  .hint { color: var(--faint); font-size: 13px; margin: 0; }

  /* Bottom: command bar + tabs */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(14,15,18,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .dock-inner { max-width: 36rem; margin: 0 auto; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
  .cmd { display: flex; gap: 8px; align-items: center; }
  .cmd input { flex: 1; min-width: 0; border-radius: 999px; border: 1px solid rgba(242,184,75,.35); background: var(--surface); padding: 13px 18px; font-size: 1rem; }
  .cmd input::placeholder { color: var(--faint); }
  .cmd button { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .cmd button svg { width: 22px; height: 22px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); }
  .tabs a { text-align: center; padding: 10px 0 10px; color: var(--faint); text-decoration: none; font-size: 13px; font-weight: 700; }
  .tabs a[aria-current="page"] { color: var(--fg); }

  .toast-zone { position: fixed; left: 0; right: 0; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; padding: 0 16px; z-index: 30; }
  .toast { border-radius: 999px; padding: 12px 20px; font-weight: 700; color: #fff; background: #23705a; box-shadow: 0 8px 24px rgba(0,0,0,.45); text-align: center; max-width: 100%; }
  .toast.info { background: var(--surface-2); }
  .toast.error { background: #8d3a2e; }

  /* Sheets */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); border-radius: 22px 22px 0 0; width: 100%; max-width: 36rem; padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 90%; overflow: auto; }
  .sheet h3 { margin: 0; font-size: 1.4rem; line-height: 1.2; overflow-wrap: anywhere; }
  .sheet .tell { display: flex; gap: 8px; }
  .sheet .tell input { flex: 1; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); padding: 12px; }
  .plan { border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .plan.pick { border-color: var(--accent); }
  .plan b { font-size: 1.05rem; }
  .plan .price { font-size: 1.4rem; font-weight: 700; }
  .plan .price small { font-size: 14px; color: var(--muted); font-weight: 400; }
  .days { display: flex; gap: 4px; }
  .days i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--faint); }
  .days i.done { border-color: transparent; }
  .days i.off { border: 0; background: var(--line); transform: scale(.45); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
</style>

<script>
/* ---------- helpers ---------- */
const h = (tag, props, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
};
const uid = (p) => p + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clone = (x) => JSON.parse(JSON.stringify(x));
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const DEFAULT_AREAS = [
  { id: "health", name: "Health", description: "Body, mind, appointments, fitness", color: "#4fc98d" },
  { id: "work", name: "Work", description: "Job and career", color: "#6aa5ff" },
  { id: "side", name: "Side Projects", description: "Things I'm building for fun or profit", color: "#b58cff" },
  { id: "home", name: "Home", description: "House, errands, pets, chores", color: "#f2b84b" },
  { id: "money", name: "Money", description: "Bills, rent, budget", color: "#3cc7c0" },
  { id: "people", name: "People", description: "Family, friends, relationships", color: "#f27cb0" },
];
const EXAMPLES = [
  "gotta go to the gym",
  "I need to schedule that doctor appointment before the 15th",
  "idea for the fitness app — show weekly streaks",
  "call mom sunday",
  "did I pay rent?",
  "lacrosse playbook should let coaches drag players on the field",
  "buy dog food",
  "also get treats",
  "remind me tonight at 8 to pack my gym bag",
];
const TYPE_LABEL = { task: "Task", idea: "Idea", reminder: "Reminder", habit: "Habit", event: "Event", note: "Note" };
const CHECKABLE = new Set(["task", "reminder", "habit", "event"]);

function emptyState() {
  return { v: 2, rev: 0, areas: clone(DEFAULT_AREAS), projects: [], items: [], links: [], fragments: [], corrections: [] };
}

/* ---------- dates ---------- */
const dayKey = (d) => new Intl.DateTimeFormat("en-CA", { year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const fmtTime = (d) => new Intl.DateTimeFormat("en-US", { hour: "numeric", minute: "2-digit" }).format(d).replace(":00", "");
const fmtDay = (d) => new Intl.DateTimeFormat("en-US", { weekday: "long", month: "short", day: "numeric" }).format(d);
const fmtMD = (d) => new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric" }).format(d);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function offsetString(d) {
  const m = -d.getTimezoneOffset();
  const s = m >= 0 ? "+" : "-";
  const a = Math.abs(m);
  return s + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}
function localIso(d) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00${offsetString(d)}`;
}
function parseDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
function fmtWhen(d) {
  const now = new Date();
  const k = dayKey(d);
  const t = fmtTime(d);
  if (k === dayKey(now)) return "Today " + t;
  if (k === dayKey(addDays(now, 1))) return "Tomorrow " + t;

/* ---------- storage: private Claude db, with browser storage as fallback ---------- */
const LOCAL_KEY = "fragments-prototype-v2";
const MODE_KEY = "fragments-mode";
let docRef = null;
let writing = false, dirty = false;

function loadLocal() {
  try { const raw = localStorage.getItem(LOCAL_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
async function persist() {

  if (mode !== "mine") return;
  mine = state;
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(mine)); } catch (e) {}
  if (!docRef) return;
  dirty = true;
  if (writing) return;
  writing = true;
  while (dirty) {
    dirty = false;
    try { await docRef.set(clone(mine)); } catch (e) { toast("Couldn't sync. Saved in this browser.", "error"); }
  }
  writing = false;
}
function setMode(m) {

  try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
  document.getElementById("mode-demo").setAttribute("aria-pressed", String(m === "demo"));

}
document.getElementById("mode-demo").addEventListener("click", () => setMode("demo"));
document.getElementById("mode-mine").addEventListener("click", () => setMode("mine"));

async function initStore() {
  const local = loadLocal();
  if (local) mine = local;
  const use = window.claude && window.claude.use;
  if (use) {
    try {
      const [db, user] = await Promise.all([use("db"), use("user")]);
      if (db && user) {

        const snap = await docRef.get();
        if (snap.exists) mine = snap.data();
        else if (local) await docRef.set(clone(mine));
        docRef.onSnapshot((s) => {
          if (!s.exists || s.metadata.hasPendingWrites) return;
          const d = s.data();

        }, () => {});
      }
    } catch (e) {}
  }
  for (const f of mine.fragments) if (f.status === "working") f.status = "queued";
  let saved = null;
  try { saved = localStorage.getItem(MODE_KEY); } catch (e) {}
  mineLoaded = true;
  if (!use) claudeState = "unavailable";

}

let claudeState = "checking"; // checking | granted | prompt | denied | unavailable
let permsPromise = null;
const getPerms = () => (permsPromise ||= window.claude && window.claude.use ? window.claude.use("permissions").catch(() => null) : Promise.resolve(null));

function claudeBanner() {

/* ---------- organizer ---------- */
const STOP = new Set("the a an and or to of for in on at my me i is it that this be with get got gotta need want should also just some about from have has do did was are will can".split(" "));
const words = (s) => norm(s).replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w.length > 2 && !STOP.has(w));

function contextItems(text) {
  const fw = new Set(words(text));
  const open = state.items.filter((i) => i.status === "open");
  const scored = open.map((it, idx) => {
    const iw = words(it.title + " " + (it.body || "") + " " + placeLabel(it));
    let overlap = text.includes(it.id) ? 100 : 0;
    for (const w of iw) if (fw.has(w) || [...fw].some((f) => f.length > 3 && (w.startsWith(f) || f.startsWith(w)))) overlap++;
    return { it, score: overlap * 10 + idx / open.length };
  });
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 30).map((s) => s.it);
}
function itemLine(i) {
  const bits = [i.id, i.type, placeLabel(i), JSON.stringify(i.title)];
  if (i.body) bits.push("details: " + JSON.stringify(i.body.slice(0, 160)));
  if (i.dueAt) bits.push("due " + i.dueAt);
  if (i.remindAt) bits.push("remind " + i.remindAt);
  if (i.recurrence) bits.push("repeats " + i.recurrence);
  if (i.cue) bits.push("cue " + i.cue);
  return "- " + bits.join(" | ");
}

function organizerPrompt(text) {
  const now = new Date();
  const areas = state.areas.map((a) => `- ${a.name}: ${a.description}`).join("\n");
  const projects = state.projects.filter((p) => p.status !== "done").map((p) => `- ${p.id} | ${areaById(p.areaId)?.name} | ${p.name} | ${p.summary || ""}`).join("\n") || "(none yet)";
  const open = contextItems(text).map(itemLine).join("\n") || "(none yet)";
  const done = state.items.filter((i) => i.status === "done").sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || "")).slice(0, 10)
    .map((i) => `- ${i.title} | ${placeLabel(i)} | done ${i.doneAt || "?"}`).join("\n") || "(none)";
  const corrections = state.corrections.slice(-8).map((c) => `- "${c.title}": first filed under ${c.from}; the user said it belongs in ${c.to}`).join("\n") || "(none yet)";
  return `You are Fragments, a personal assistant and "external brain" for a person with ADHD. They tell you things in passing: tasks, ideas, reminders, plans, corrections, questions. Your job is to keep their whole life organized for them, so they never have to sort anything themselves. Read ONE message and act on it.

CURRENT TIME: ${fmtDay(now)}, ${fmtTime(now)} — ISO ${localIso(now)} (time zone ${TZ}). Write every timestamp as full ISO 8601 with this offset (${offsetString(now)}).

AREAS (file every item under exactly one, by exact name):
${areas}

PROJECTS (id | area | name | summary):
${projects}

OPEN ITEMS most related to this message (id | type | area → project | title | ...):
${open}

RECENTLY COMPLETED:
${done}

PAST CORRECTIONS (learn from these):
${corrections}

RULES
- Always file. Never ask the user where something goes. If unsure, pick the most likely place and give a lower confidence.
- Nest well: Area → Project → item. Put an item in an existing project when it belongs to that effort. Create a project only for an ongoing effort with more to come (an app, a trip, an event to plan, a renovation). One-off errands go straight in an Area.
- One message can hold several thoughts ("ok so X, and also Y, oh and Z"). Split it into separate operations.
- Messages can be commands about existing items: "done with X", "move X to Friday", "X is actually for the wedding", "forget about X". Use update_item (status "done" or "dismissed", new dates, new area/project). When the user moves something, that is a correction.
- A habit ("go to the gym") is type "habit" with an RRULE recurrence (e.g. "FREQ=WEEKLY;BYDAY=MO,WE,FR" or "FREQ=DAILY").
- "remind me ... at <time>" → "reminder" with remindAt. Something at a set time → "event" with dueAt. Something to do → "task". Product or project thoughts → "idea". Facts to keep → "note".
- Resolve vague references ("that doctor appointment", "also get treats") against OPEN ITEMS and update the existing item instead of duplicating it.
- Dates are in the user's time zone. "tonight" = 20:00 today. "Sunday" = the coming Sunday. "before the 15th" = dueAt the 14th at 17:00.
- If the moment to act is a place or event ("when I get home", "next time I'm at the store"), set cue to it in plain words instead of a clock time.
- Do things for the user:
  - A task with no date and no cue: set scheduleFor to a sensible slot in the next 7 days (weekend mornings for errands and calls to businesses, evenings for personal calls). The app tells the user you picked it.
  - A task that means contacting someone (call, text, email, ask, tell, book, cancel): write a ready-to-use draft. kind "text" for texts, "email" for emails, "call" for a short script of what to say. Use only facts you have; put unknowns in [brackets]. Warm, short, plain.
  - A big or vague task: set firstStep to one action that takes about 2 minutes.
  - When an idea lands in a project, also update_project_summary (1–2 sentences on what the project is and where it stands).
- If the message is a question, answer it in "reply" using only the data above; say plainly when there's no record.
- Never invent facts the user didn't say (people, places, prices, numbers).
- Titles: short, plain, action-first ("Book doctor appointment", "Call Mom").

Reply with only one JSON object, no prose:
{"explain": "<one short, friendly sentence on what you did>", "reply": null or "<answer if they asked something>", "operations": [ ... ]}

Operation shapes (omit fields you don't need):
{"op":"create_project","area":"<area name>","name":"<project name>","summary":"<1–2 sentences>","confidence":0.9}
{"op":"create_item","ref":"n1","type":"task|idea|reminder|habit|event|note","title":"...","body":"...","area":"<area name>","project":"<existing or new project name, or null>","dueAt":"<ISO or null>","remindAt":"<ISO or null>","scheduleFor":"<ISO or null>","recurrence":"<RRULE or null>","priority":"low|normal|high","firstStep":"<or null>","cue":"<or null>","draft":{"kind":"text|email|call","to":"<who>","subject":"<email only>","text":"..."} or null,"confidence":0.9}
{"op":"update_item","id":"<existing item id>","changes":{"title":"...","body":"...","status":"open|done|dismissed","dueAt":"...","remindAt":"...","recurrence":"...","priority":"...","type":"...","area":"<area name>","project":"<project name>","firstStep":"...","cue":"...","draft":{...}},"confidence":0.9}
{"op":"link_items","from":"<item id or ref>","to":"<item id or ref>","reason":"...","confidence":0.9}
{"op":"update_project_summary","project":"<project id>","summary":"...","confidence":0.9}

MESSAGE: ${JSON.stringify(text)}`;
}

const DRAFT_ICON = { text: "💬", email: "✉️", call: "📞" };
function addAction(icon, text, itemId) {
  state.actions = state.actions || [];
  state.actions.push({ id: uid("a"), at: new Date().toISOString(), icon, text, itemId: itemId || null });
  state.actions = state.actions.slice(-200);
}
function cleanDraft(d) {
  if (!d || typeof d !== "object" || typeof d.text !== "string" || !d.text.trim()) return null;
  return { kind: DRAFT_ICON[d.kind] ? d.kind : "text", to: String(d.to || "").slice(0, 80), subject: d.subject ? String(d.subject).slice(0, 120) : null, text: d.text.slice(0, 2000) };
}

function applyOperations(frag, out) {
  const undo = { createdItems: [], createdProjects: [], createdLinks: [], before: [], projectBefore: [], actions: (state.actions || []).length };
  const did = [];
  const refs = {};
  let filed = null;
  const ops = Array.isArray(out && out.operations) ? out.operations : [];
  const nowIso = new Date().toISOString();
  const fallbackArea = (text) => {
    const w = new Set(words(text));
    return state.areas.map((a) => [a, words(a.name + " " + a.description).filter((x) => w.has(x)).length]).sort((x, y) => y[1] - x[1])[0][0];
  };

  const ensureProject = (areaId, name, summary) => {
    if (!name || norm(name) === "null") return null;
    let p = findProject(areaId, name);
    if (!p && areaId) {
      p = { id: uid("p"), areaId, name: String(name).slice(0, 80), summary: summary || "", status: "active", createdAt: nowIso, docs: [] };
      state.projects.push(p);
      undo.createdProjects.push(p.id);
      did.push(`Started a project, “${p.name}”, in ${areaById(areaId).name}`);
    }
    return p;
  };

  for (const op of ops) if (op && op.op === "create_project") {
    const a = findArea(op.area);
    if (a) ensureProject(a.id, op.name, op.summary);
  }
  for (const op of ops) {
    if (!op || typeof op !== "object") continue;
    const conf = typeof op.confidence === "number" ? op.confidence : 0.8;
    if (op.op === "create_item") {
      const a = findArea(op.area) || fallbackArea(op.title + " " + frag.text);
      const p = op.project ? ensureProject(a.id, op.project) : null;
      const type = TYPE_LABEL[op.type] ? op.type : "note";
      const item = {
        id: uid("i"), type, title: String(op.title || frag.text).slice(0, 140), body: String(op.body || "").slice(0, 2000),
        areaId: a.id, projectId: p ? p.id : null, status: "open",
        dueAt: parseDate(op.dueAt) ? op.dueAt : null, remindAt: parseDate(op.remindAt) ? op.remindAt : null,
        recurrence: op.recurrence || null, priority: ["low", "normal", "high"].includes(op.priority) ? op.priority : "normal",
        firstStep: typeof op.firstStep === "string" && op.firstStep.trim() ? op.firstStep.slice(0, 140) : null,
        cue: typeof op.cue === "string" && op.cue.trim() ? op.cue.slice(0, 80) : null,
        draft: cleanDraft(op.draft), confidence: conf, guess: conf < 0.6, fragmentId: frag.id, createdAt: nowIso,
        history: type === "habit" ? [] : undefined,
      };
      if (!item.dueAt && !item.remindAt && !item.cue && type === "task" && parseDate(op.scheduleFor)) {
        item.dueAt = op.scheduleFor; item.autoScheduled = true;
        addAction("📅", `Put “${item.title}” on ${fmtWhen(parseDate(item.dueAt))}.`, item.id);
      }
      if (item.draft) addAction(DRAFT_ICON[item.draft.kind], `${item.draft.kind === "call" ? "Wrote what to say" : "Drafted a " + item.draft.kind} for “${item.title}”.`, item.id);
      state.items.push(item);
      undo.createdItems.push(item.id);
      (frag.itemIds ||= []).push(item.id);
      if (op.ref) refs[op.ref] = item.id;
      did.push(`Added ${TYPE_LABEL[item.type].toLowerCase()} “${item.title}” to ${placeLabel(item)}${item.guess ? " (best guess)" : ""}`);
      filed = filed || "Filed under " + placeLabel(item);
    } else if (op.op === "update_item") {
      const it = itemById(op.id);
      if (!it || !op.changes || typeof op.changes !== "object") continue;
      undo.before.push(clone(it));
      const c = op.changes;
      const fromPlace = placeLabel(it);
      for (const k of ["title", "body", "recurrence", "firstStep", "cue"]) if (typeof c[k] === "string") it[k] = c[k].slice(0, k === "body" ? 2000 : 140);
      for (const k of ["dueAt", "remindAt"]) if (k in c) { it[k] = parseDate(c[k]) ? c[k] : null; it.autoScheduled = false; }
      if (["low", "normal", "high"].includes(c.priority)) it.priority = c.priority;
      if (TYPE_LABEL[c.type]) it.type = c.type;
      if (c.draft) it.draft = cleanDraft(c.draft) || it.draft;
      if (c.area) { const a = findArea(c.area); if (a) { it.areaId = a.id; if (!c.project) it.projectId = null; } }
      if (c.project) { const p = ensureProject(it.areaId, c.project); if (p) { it.projectId = p.id; it.areaId = p.areaId; } }
      if (placeLabel(it) !== fromPlace) { state.corrections.push({ title: it.title, from: fromPlace, to: placeLabel(it), at: nowIso }); state.corrections = state.corrections.slice(-20); it.guess = false; }
      let verb = "Updated";
      if (c.status === "done" && it.status !== "done") { it.status = "done"; it.doneAt = nowIso; verb = "Checked off"; }
      else if (c.status === "dismissed") { it.status = "dismissed"; verb = "Let go of"; }
      else if (c.status === "open") it.status = "open";
      it.updatedAt = nowIso;
      did.push(placeLabel(it) !== fromPlace ? `Moved “${it.title}” to ${placeLabel(it)}` : `${verb} “${it.title}”`);
      filed = filed || (placeLabel(it) !== fromPlace ? "Moved to " + placeLabel(it) : `${verb} “${it.title}”`);
    } else if (op.op === "link_items") {
      const from = refs[op.from] || op.from, to = refs[op.to] || op.to;
      if (!itemById(from) || !itemById(to) || from === to) continue;
      const link = { id: uid("l"), from, to, reason: String(op.reason || "").slice(0, 200) };
      state.links.push(link);
      undo.createdLinks.push(link.id);
      did.push(`Connected “${itemById(from).title}” to “${itemById(to).title}”`);
    } else if (op.op === "update_project_summary") {
      const p = projectById(op.project) || findProject(null, op.project);
      if (!p || typeof op.summary !== "string") continue;
      undo.projectBefore.push({ id: p.id, summary: p.summary });
      p.summary = op.summary.slice(0, 600);
      did.push(`Updated where “${p.name}” stands`);
    }
  }
  frag.status = "organized";
  frag.processedAt = nowIso;
  frag.explain = typeof out.explain === "string" ? out.explain : "";
  frag.reply = typeof out.reply === "string" && out.reply.trim() ? out.reply : null;
  frag.did = did;
  frag.undo = undo;
  frag.error = null;
  return filed || (frag.reply ? "Answered" : "Got it");
}

function undoFragment(frag) {
  const u = frag.undo;
  if (!u) return;
  state.items = state.items.filter((i) => !u.createdItems.includes(i.id));
  state.links = state.links.filter((l) => !u.createdLinks.includes(l.id) && itemById(l.from) && itemById(l.to));
  for (const before of u.before) { const idx = state.items.findIndex((i) => i.id === before.id); if (idx >= 0) state.items[idx] = before; }
  for (const pb of u.projectBefore) { const p = projectById(pb.id); if (p) p.summary = pb.summary; }
  state.projects = state.projects.filter((p) => !u.createdProjects.includes(p.id) || state.items.some((i) => i.projectId === p.id));
  if (state.actions) state.actions = state.actions.slice(0, u.actions);
  frag.status = "undone";
  frag.undo = null;
}

let pumping = false;
async function pump() {
  if (pumping || !loaded) return;
  pumping = true;
  try {
    for (;;) {
      const s = state;
      const frag = s.fragments.find((f) => f.status === "queued");
      if (!frag) break;
      frag.status = "working";
      frag.startedAt = Date.now();
      render();
      const sample = await getSample();
      if (!sample) {
        frag.status = "error";
        frag.error = "I need Claude to organize this, and it isn't available in this view. Your words are saved.";
        frag.blocked = true;
        claudeState = "unavailable";
        await persist(); render();
        break;
      }
      try {
        const out = await sample.json(organizerPrompt(frag.text), { cache: false, modelTier: "quick" });
        if (state !== s) { frag.status = "queued"; break; }
        claudeState = "granted";
        toast(applyOperations(frag, out || {}));
      } catch (e) {
        frag.status = "error";
        frag.error = claudeError(e);
        if (e && e.code === "not_granted") { frag.blocked = true; claudeState = "denied"; }
        await persist(); render();
        if (e && (e.code === "not_granted" || e.code === "rate_limited")) break;
        continue;
      }
      await persist();
      render();
    }
  } finally { pumping = false; }
}

/* ---------- one box for everything ---------- */
let lastExchange = null; // {kind:"capture", fragId} | {kind:"ask", q, text, busy}
const QUESTION = /\?\s*$|^(what|when|where|who|why|how|did|do|does|is|are|was|were|can|could|should|have|has|which|am i|tell me|show me|remind me what)\b/i;

function send(text, about) {

              its.length ? h("div", { class: "bar" }, h("i", { style: `width:${Math.round((d / its.length) * 100)}%;background:${a.color}` })) : null);
          }),
          todo.length || habits.length ? h("div", { class: "loose" },
            todo.map((i) => h("div", { class: "lrow" }, checkBtn(i), h("button", { class: "item-main", onclick: () => openItem(i) }, h("span", null, i.title), metaLine(i, { place: false })))),
            habits.map((i) => h("div", { class: "lrow" }, checkBtn(i), h("button", { class: "item-main", onclick: () => openItem(i) }, h("span", null, i.title), h("span", { class: "meta" }, `↻ ${recurrenceLabel(i.recurrence)} · ${habitKept(i).kept} of last ${habitKept(i).due}`))))) : null,
          kept.length ? h("details", null, h("summary", null, `${plural(kept.length, "note")} and ideas`), list(kept, { place: false })) : null,

    })),

}

function viewProject(id) {
  const p = projectById(id);
  if (!p) return [h("p", { class: "sub" }, "That project isn't here anymore."), h("a", { class: "back", href: "#life" }, "← Life")];

  const todo = items.filter((i) => ["task", "reminder", "event"].includes(i.type));
  const openTodo = todo.filter((i) => i.status === "open").sort((x, y) => (whenOf(x) || 9e15) - (whenOf(y) || 9e15));
  const ideas = items.filter((i) => i.status === "open" && (i.type === "idea" || i.type === "note"));
  const habits = items.filter((i) => i.status === "open" && i.type === "habit");
  const done = todo.filter((i) => i.status === "done");

  p.docs = p.docs || [];
  if (!p.docs.length && ideas.length >= 3 && claudeState === "granted" && !p.autoPlanned) setTimeout(() => runAction(p, "plan", true), 0);
  return [
    h("button", { class: "back", onclick: () => { openAreas.add(a.id); location.hash = "#life"; } }, "← " + a.name),

  ];
}
function docCard(p, d) {
  return h("div", { class: "doc" },
    h("div", { class: "row" }, h("span", { class: "label" }, (d.kind === "plan" ? "Plan" : "Claude Code brief") + " · " + fmtWhen(new Date(d.createdAt))),

}
let actionBusy = false;
async function runAction(p, kind, auto) {
  if (actionBusy) return;
  if (auto) p.autoPlanned = true;
  const sample = await getSample();
  if (!sample) { if (!auto) toast("I need Claude for that, and it isn't available in this view", "error"); return; }
  actionBusy = true;
  const items = state.items.filter((i) => i.projectId === p.id);
  const fmtItems = (f) => items.filter(f).map((i) => `- [${i.status === "done" ? "x" : " "}] ${i.type}: ${i.title}${i.body ? " — " + i.body : ""}`).join("\n") || "(none)";
  const history = state.fragments.filter((f) => items.some((i) => i.fragmentId === f.id)).map((f) => `- ${f.createdAt.slice(0, 10)}: "${f.said || f.text}"`).join("\n") || "(none)";
  const ctx = `PROJECT: ${p.name} (area: ${areaById(p.areaId).name})\nSUMMARY: ${p.summary || "(none)"}\n\nIDEAS:\n${fmtItems((i) => i.type === "idea")}\n\nTASKS AND OTHER ITEMS:\n${fmtItems((i) => i.type !== "idea")}\n\nWHAT THE USER SAID, IN ORDER:\n${history}`;
  const prompt = kind === "plan"
    ? `You help a person with ADHD turn scattered ideas into action. Write a short, practical plan for this project using ONLY what's below; don't invent features, deadlines or facts. Plain text, no Markdown symbols: a one-line goal, then 2–4 small numbered phases with 2–3 concrete steps each, then "Very next step:" (one action under 30 minutes), then "Open questions:". Under 220 words.\n\n${ctx}`
    : `Write a Markdown brief the user will paste into a fresh Claude Code session to start building this project. Use ONLY what's below; mark anything unknown as an open question. Sections: "# ${p.name}", "## Goal", "## Background (what I've said so far)", "## Decisions so far", "## Features / ideas to build", "## Open tasks", "## Open questions", "## Suggested first step for Claude Code". Be concise.\n\n${ctx}`;
  const outBox = document.getElementById("action-out");
  const pre = h("pre", { class: "spin" }, "Writing…");
  if (outBox) outBox.replaceChildren(h("div", { class: "doc" }, h("span", { class: "label" }, kind === "plan" ? "Writing the plan…" : "Writing a Claude Code brief…"), pre));
  try {
    const { text } = await sample(prompt, { onText: ({ text }) => { pre.classList.remove("spin"); pre.textContent = text; } });
    p.docs.push({ kind, text, createdAt: new Date().toISOString() });
    addAction("📝", `${kind === "plan" ? "Wrote a plan" : "Wrote a Claude Code brief"} for ${p.name}.`, null);
    claudeState = "granted";
    await persist();
    if (!auto) toast(kind === "plan" ? "Plan saved" : "Brief saved");
  } catch (e) { if (!auto) toast(claudeError(e), "error"); if (e && e.code === "not_granted") claudeState = "denied"; }

  render();
}

/* ---------- Activity ---------- */

}
function viewActivity() {
  const frags = state.fragments.slice().reverse();

    days.length ? days.map((d) => h("section", { class: "section" }, h("h2", null, d.label), d.items.map(fragCard))) : h("div", { class: "empty" }, h("p", null, "Nothing yet. Tell me anything below.")),
  ];
}

/* ---------- sheets ---------- */

  const root = document.getElementById("sheet-root");
  const close = () => root.replaceChildren();
  const sheet = h("div", { class: "sheet", role: "dialog" }, content(close));
  const scrim = h("div", { class: "scrim", onclick: (e) => { if (e.target === scrim) close(); } }, sheet);
  scrim.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

  sheet.querySelector("button, input")?.focus();
}

      d && item.status === "open" ? h("div", { class: "doc" }, h("div", { class: "row" }, h("span", { class: "label" }, `${DRAFT_ICON[d.kind]} ${d.kind === "call" ? "What to say" : "Draft " + d.kind}${d.to ? " · " + d.to : ""}`), h("button", { class: "btn small", onclick: (e) => copyText((d.subject ? "Subject: " + d.subject + "\n\n" : "") + d.text, e.currentTarget) }, "Copy")),
        d.subject ? h("p", { class: "sub", style: "font-size:14px" }, "Subject: " + d.subject) : null, h("pre", null, d.text),
        h("p", { class: "hint" }, "I never send anything for you. Copy it, tweak it, send it.")) : null,
      item.type === "habit" ? h("div", { class: "section" }, h("span", { class: "label" }, `Kept ${habitKept(item).kept} of the last ${habitKept(item).due} days`), habitDays(item), h("p", { class: "hint" }, "Missed a day? That's fine. One rest day a week never breaks a streak.")) : null,
      item.remindAt && item.status === "open" ? h("p", { class: "hint" }, `One nudge at ${fmtWhen(parseDate(item.remindAt))}. If you're busy, it waits at the top of Home. No repeat pings.`) : null,
      links.length ? h("div", { class: "section" }, h("span", { class: "label" }, "Connected to"), links.map((x) => h("button", { class: "back", onclick: () => openItem(x.other) }, "↔ " + x.other.title + (x.reason ? " · " + x.reason : "")))) : null,
      frag ? h("p", { class: "hint" }, `You said “${frag.said || frag.text}” · ${fmtWhen(new Date(frag.createdAt))}`) : null,
      h("form", { class: "tell", onsubmit: (e) => { e.preventDefault(); if (!tell.value.trim()) return; send(tell.value, item); close(); } }, tell, h("button", { class: "btn small", type: "submit" }, "Tell")),

        CHECKABLE.has(item.type) ? h("button", { class: "btn primary", onclick: async () => { close(); await toggleDone(item); } }, item.status === "done" ? "Reopen" : item.type === "habit" ? (habitDoneToday(item) ? "Not done today" : "Done today") : "Done") : null,

    h("button", { class: "btn ghost", onclick: close }, "Close"),

document.getElementById("settings-btn").addEventListener("click", openSettings);

/* ---------- router ---------- */
function render() {
  const hash = location.hash.slice(1) || "home";
  const view = document.getElementById("view");
  let tab = hash, content;
  if (mode === "mine" && !mineLoaded) content = [h("p", { class: "sub spin" }, "Loading your brain…")];
  else if (hash.startsWith("project-")) { tab = "life"; content = viewProject(hash.slice(8)); }
  else if (hash === "life") content = viewLife();
  else if (hash === "activity") content = viewActivity();
  else { tab = "home"; content = viewHome(); }
  view.replaceChildren(...[claudeBanner(), ...content].flat().filter(Boolean));
  for (const a of document.querySelectorAll(".tabs a")) {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
}
window.addEventListener("hashchange", () => { document.getElementById("sheet-root").replaceChildren(); render(); window.scrollTo(0, 0); });
